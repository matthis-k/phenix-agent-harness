name: Remove contract versioning

on:
  push:
    branches:
      - cleanup/remove-contract-versioning

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: cleanup/remove-contract-versioning
          fetch-depth: 0

      - name: Remove contract versioning
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          changed = []
          for name in tracked:
              if not name or not (name.endswith(".ts") or name.endswith(".md")):
                  continue
              path = Path(name)
              text = path.read_text()
              rewritten = re.sub(
                  r"\b((?:request|outcome|tool)\.[a-z0-9.-]+)\.v\d+\b",
                  r"\1",
                  text,
              )
              rewritten = re.sub(r"\b([A-Za-z_][A-Za-z0-9_]*)V\d+\b", r"\1", rewritten)
              if name == "modules/phenix-pi/domain/workflow/checkpoint.ts":
                  rewritten = rewritten.replace("  readonly version: 1;\n", "")
                  rewritten = rewritten.replace("    version: 1,\n", "")
                  rewritten = rewritten.replace(
                      "  if (!isRecord(value) || value.version !== 1) return undefined;\n",
                      "  if (!isRecord(value)) return undefined;\n",
                  )
              if rewritten != text:
                  path.write_text(rewritten)
                  changed.append(name)

          print("Rewritten files:")
          print("\n".join(changed))
          PY

          git diff --check
          if git diff --quiet; then
            echo "No versioned contracts remain to rewrite."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove contract versioning"
          git push origin HEAD:cleanup/remove-contract-versioning
