[workspace]
resolver = "2"
members = [
  "crates/phenix-acp",
  "crates/phenix-acp-backend",
  "crates/phenix-acp-presets",
  "crates/phenix-conductor",
  "crates/phenix-frontend-config",
  "crates/phenix-runtime-api",
  "crates/phenix-tui",
  "crates/phenix-ui-core",
  "crates/phenix-ui-lua",
  "crates/phenix-ui-runtime",
]

[workspace.dependencies]
agent-client-protocol = { version = "2.0.0", features = [
  "unstable_auth_methods",
  "unstable_elicitation",
  "unstable_end_turn_token_usage",
  "unstable_session_fork",
] }
base64 = "0.22"
blocking = "1.6"
clap = { version = "4.5.47", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
futures = "0.3"
mlua = { version = "0.12.0", features = ["lua54", "vendored"] }
ratatui = "0.30.2"
ron = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
shell-words = "1.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.9"
