name: Finalize unified Phenix UI

on:
  push:
    branches: [feat/unified-phenix-ui]

permissions:
  contents: write

concurrency:
  group: finalize-unified-phenix-ui
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: feat/unified-phenix-ui
          fetch-depth: 0

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with: { name: devenv }

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Refine tab state and run rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("modules/phenix-pi/extension/phenix-ui.ts")
          text = path.read_text()

          old = '''  private snapshot: PhenixUiSnapshot;
          private view: PhenixUiView;
          private pane: UiPane = 0;
          private filter = "";
          private filtering = false;
          '''
          new = '''  private snapshot: PhenixUiSnapshot;
          private view: PhenixUiView;
          private readonly panes: Record<PhenixUiView, UiPane> = {
            status: 0,
            runs: 0,
            facts: 0,
            catalog: 0,
          };
          private readonly filters: Record<PhenixUiView, string> = {
            status: "",
            runs: "",
            facts: "",
            catalog: "",
          };
          private filtering = false;
          '''
          assert old in text
          text = text.replace(old, new, 1)

          constructor = '''  constructor(options: PhenixUiOptions) {
          '''
          accessors = '''  private get pane(): UiPane {
            return this.panes[this.view];
          }

          private set pane(value: UiPane) {
            this.panes[this.view] = value;
          }

          private get filter(): string {
            return this.filters[this.view];
          }

          private set filter(value: string) {
            this.filters[this.view] = value;
          }

          constructor(options: PhenixUiOptions) {
          '''
          assert constructor in text
          text = text.replace(constructor, accessors, 1)

          switch = '''  private switchView(view: PhenixUiView): void {
            this.view = view;
            this.pane = 0;
            this.goPrefix = false;
          '''
          replacement = '''  private switchView(view: PhenixUiView): void {
            this.view = view;
            this.goPrefix = false;
          '''
          assert switch in text
          text = text.replace(switch, replacement, 1)

          runs = '''    const runs = flattenRuns(this.snapshot.tree.root, new Set())
            .filter((item) => item.node.run.id !== this.snapshot.tree.root.run.id)
            .filter((item) => !TERMINAL_STATES.has(item.node.run.state));
          '''
          assert text.count(runs) == 2
          text = text.replace(runs, '''    const runs = this.statusRuns();
          ''')
          text = text.replace(
              '''    runs.slice(0, Math.max(3, Math.floor(this.layout.bodyHeight / 2) - 4)).forEach((run, index) => {
          ''',
              '''    runs.forEach((run, index) => {
          ''',
              1,
          )

          target_marker = '''  private statusTargets(): readonly ({ readonly kind: "run"; readonly item: FlatRun } | { readonly kind: "fact"; readonly item: RunFact })[] {
          '''
          status_runs = '''  private statusRuns(): readonly FlatRun[] {
            return flattenRuns(this.snapshot.tree.root, new Set())
              .filter((item) => item.node.run.id !== this.snapshot.tree.root.run.id)
              .filter((item) => !TERMINAL_STATES.has(item.node.run.state))
              .slice(0, Math.max(3, Math.floor(this.layout.bodyHeight / 2) - 4));
          }

          private statusTargets(): readonly ({ readonly kind: "run"; readonly item: FlatRun } | { readonly kind: "fact"; readonly item: RunFact })[] {
          '''
          assert target_marker in text
          text = text.replace(target_marker, status_runs, 1)

          preview = '''    try {
            lines = renderRunTreeSequence({ root: node }, { expanded: true }).split("\\n");
          '''
          preview_replacement = '''    try {
            const root =
              node.run.kind === "root"
                ? node
                : { ...this.snapshot.tree.root, children: [node] };
            lines = renderRunTreeSequence({ root }, { expanded: true }).split("\\n");
          '''
          assert preview in text
          text = text.replace(preview, preview_replacement, 1)

          path.write_text(text)
          PY

          rm -f modules/phenix-pi/extension/catalog-browser.ts
          rm -f modules/phenix-pi/tests/catalog-browser.test.ts

      - name: Apply canonical maintenance fixes
        run: devenv tasks run maintenance:fix

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/finalize-unified-phenix-ui.yml
          rm -f .github/unified-ui-finalize-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --stat
          git commit -m "Finalize unified full-screen Phenix UI [skip ci]"
          git push origin HEAD:feat/unified-phenix-ui
