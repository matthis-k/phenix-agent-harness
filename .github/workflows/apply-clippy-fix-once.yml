name: Apply reviewed Clippy fix once

on:
  push:
    branches:
      - feature/rust-ratatui-frontend
    paths:
      - .github/workflows/apply-clippy-fix-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feature/rust-ratatui-frontend
          fetch-depth: 0
      - name: Apply reviewed derive fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rust/crates/phenix-acp/src/runtime/gateway.rs')
          source = path.read_text()
          source = source.replace(
              '#[derive(Clone)]\npub struct PhenixAcpGatewayBuilder',
              '#[derive(Clone, Default)]\npub struct PhenixAcpGatewayBuilder',
              1,
          )
          start = source.index('impl Default for PhenixAcpGatewayBuilder {')
          end = source.index('\n\nimpl PhenixAcpGatewayBuilder {', start)
          source = source[:start] + source[end + 2:]
          path.write_text(source)
          PY
          cd rust
          cargo fmt --all
          cd ..
          rm .github/workflows/apply-clippy-fix-once.yml
          git add rust/crates/phenix-acp/src/runtime/gateway.rs .github/workflows/apply-clippy-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(acp): derive gateway builder default"
          git push origin HEAD:feature/rust-ratatui-frontend
