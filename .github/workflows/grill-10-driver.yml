name: Grill 10 patch driver

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/grill-10-readonly-bash'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/grill-10-apply.yml').read_text().splitlines()
          start = source.index("          python3 <<'PY'") + 1
          end = source.index('          PY', start)
          inside_string = False
          extracted = []
          for raw_line in source[start:end]:
              line = raw_line
              if not inside_string and line.startswith('          '):
                  line = line[10:]
              extracted.append(line)
              if line.count("'''") % 2:
                  inside_string = not inside_string
          Path('/tmp/grill-10-apply.py').write_text('\n'.join(extracted) + '\n')
          PY
          python3 /tmp/grill-10-apply.py
          rm .github/workflows/grill-10-apply.yml
      - name: Commit implementation
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: sandbox read-only bash executions"
          git push origin "HEAD:$HEAD_REF"
