name: Frontend Rust check

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/frontend-rust-check.yml
      - rust/**

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@4305c38b25d97ef35a8ad1f985ccf2d2242004f2
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply remaining Rust migrations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("rust/crates/phenix-frontend-config/src/lib.rs")
          content = path.read_text()
          old = '''#[derive(Clone, Debug, Eq, PartialEq)]
          pub struct FrontendConfig {
              pub theme: ThemeConfig,
              pub layout: LayoutConfig,
              pub keymaps: Vec<KeymapDescription>,
          }

          impl Default for FrontendConfig {
              fn default() -> Self {
                  Self {
                      theme: ThemeConfig::default(),
                      layout: LayoutConfig::default(),
                      keymaps: Vec::new(),
                  }
              }
          }
          '''.replace("          ", "")
          new = '''#[derive(Clone, Debug, Default, Eq, PartialEq)]
          pub struct FrontendConfig {
              pub theme: ThemeConfig,
              pub layout: LayoutConfig,
              pub keymaps: Vec<KeymapDescription>,
          }
          '''.replace("          ", "")
          if old in content:
              path.write_text(content.replace(old, new))
          elif new not in content:
              raise SystemExit("expected FrontendConfig Default implementation missing")
          PY
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Commit generated Rust files
        run: |
          if ! git diff --quiet -- rust; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add rust
            git commit -m "derive default frontend configuration"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - name: Check
        run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked
