name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Final maintenance checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: feat/unified-phenix-ui
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with: { name: devenv }
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Apply unified UI refinement
        run: python .github/scripts/refine-unified-ui.py
      - name: Remove superseded UI and temporary files
        shell: bash
        run: |
          rm -f .github/scripts/refine-unified-ui.py
          rm -f .github/workflows/finalize-unified-phenix-ui.yml
          rm -f .github/unified-ui-finalize-trigger
          rm -f modules/phenix-pi/extension/catalog-browser.ts
          rm -f modules/phenix-pi/tests/catalog-browser.test.ts
      - name: Commit refined unified UI
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize unified full-screen Phenix UI [skip ci]"
          git push origin HEAD:feat/unified-phenix-ui
      - name: Apply canonical maintenance fixes
        shell: bash
        run: |
          set +e
          devenv tasks run maintenance:fix > maintenance-fix.log 2>&1
          status=$?
          tail -n 320 maintenance-fix.log
          exit "$status"
      - name: Run repository maintenance
        shell: bash
        run: |
          set +e
          devenv test > devenv-test.log 2>&1
          status=$?
          tail -n 320 devenv-test.log
          exit "$status"
      - name: Upload devenv diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devenv-diagnostics
          path: |
            maintenance-fix.log
            devenv-test.log
          if-no-files-found: warn
