name: Apply Canonical Rustfmt

on:
  push:
    branches:
      - ci-format-diagnostic
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: fix/ci-baseline-regressions

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with: { name: devenv }

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Apply canonical Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          devenv tasks run maintenance:fix:rust-format --mode single
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "rust/crates/phenix-tui/src/rich_document.rs"
          git diff --check

      - name: Commit and push formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/phenix-tui/src/rich_document.rs
          git commit -m 'style: apply canonical rustfmt'
          git push origin HEAD:fix/ci-baseline-regressions
