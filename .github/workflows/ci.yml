name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Final maintenance checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Apply one-shot import organization
        if: github.head_ref == 'ui/turn-steering-interrupt'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("modules/phenix-pi/extension/phenix-workspace.ts")
          text = path.read_text()
          old = '''import { renderWorkspaceTurn } from "./workspace/turn-indicator.ts";
import { stripTranscriptAnsi } from "./workspace/transcript-selection.ts";
import { TranscriptSelectionSurface } from "./workspace/transcript-selection-surface.ts";
'''
          new = '''import { stripTranscriptAnsi } from "./workspace/transcript-selection.ts";
import { TranscriptSelectionSurface } from "./workspace/transcript-selection-surface.ts";
import { renderWorkspaceTurn } from "./workspace/turn-indicator.ts";
'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("workspace import block did not match")
          PY
          rm -f .github/workflows/fix-turn-import-order.yml
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Organize workspace imports"
            git push origin HEAD:ui/turn-steering-interrupt
          fi
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with: { name: devenv }
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Run repository maintenance
        shell: bash
        run: |
          set +e
          devenv test > devenv-test.log 2>&1
          status=$?
          tail -n 320 devenv-test.log
          exit "$status"
      - name: Upload devenv diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devenv-test-log
          path: devenv-test.log
          if-no-files-found: error
