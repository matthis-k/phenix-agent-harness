name: Fix rich transcript table assertion

on:
  push:
    branches:
      - refactor/rich-transcript-blocks

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
      - name: Patch table assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('rust/crates/phenix-tui/src/rich_document.rs')
          source = path.read_text()
          old = '.any(|line| line.starts_with("  ┌") || line.starts_with(\'┌\')));'
          new = '.any(|line| line.trim_start().starts_with(\'┌\')));'
          if old not in source:
              if new in source:
                  raise SystemExit(0)
              raise SystemExit('table assertion marker not found')
          path.write_text(source.replace(old, new, 1))
          PY

          cd rust
          cargo fmt --all
          cargo test -p phenix-tui rich_document::tests::table_views_are_visually_distinct --locked
          cd ..

          if git diff --quiet -- rust/crates/phenix-tui/src/rich_document.rs; then
            exit 0
          fi
          git config user.name "Matthis Kälble"
          git config user.email "69082876+matthis-k@users.noreply.github.com"
          git add rust/crates/phenix-tui/src/rich_document.rs
          git commit -m "fix(tui): make table-view assertion margin agnostic"
          git push origin HEAD:refactor/rich-transcript-blocks
