name: Apply session budget mode

on:
  push:
    branches:
      - feat/session-budget-mode

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/session-budget-mode
      - name: Apply migration
        run: |
          python scripts/fix_apply_session_budget_mode.py
          python scripts/apply_session_budget_mode.py
          git diff --check
      - name: Commit clean result
        run: |
          rm scripts/apply_session_budget_mode.py
          rm scripts/fix_apply_session_budget_mode.py
          rm .github/workflows/apply-session-budget-mode.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate session budget modes and per-run difficulty"
          git push origin HEAD:feat/session-budget-mode
