name: PR 265 Rust check

on:
  push:
    branches:
      - tmp/pr265-rust-check
    paths:
      - .github/workflows/pr265-rust-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Rust check
        run: cargo check --workspace
        working-directory: rust
