name: Patch native clear handling

on:
  push:
    branches: [ui/turn-steering-interrupt]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ui/turn-steering-interrupt
          fetch-depth: 0
      - name: Patch contextual clear behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workspace = Path("modules/phenix-pi/extension/phenix-workspace.ts")
          text = workspace.read_text()
          old = '''  setRootTurnActive(active: boolean): void {
    if (this.rootTurnActive === active) return;
    this.rootTurnActive = active;
    this.requestRender();
  }

'''
          new = '''  setRootTurnActive(active: boolean): void {
    if (this.rootTurnActive === active) return;
    this.rootTurnActive = active;
    this.requestRender();
  }

  hasTranscriptSelection(): boolean {
    return this.transcriptSelection.selection !== undefined;
  }

'''
          if text.count(old) != 1:
              raise SystemExit("workspace turn setter match failed")
          workspace.write_text(text.replace(old, new))

          extension = Path("modules/phenix-pi/extension/default-workspace-extension.ts")
          text = extension.read_text()
          old = '''    return handoffNativeWorkspaceInput({
      data,
      keybindings: activeKeybindings,
      handoff: (delegation) => {
'''
          new = '''    return handoffNativeWorkspaceInput({
      data,
      keybindings: activeKeybindings,
      accept: (delegation) =>
        delegation.action !== "app.clear" || !activeWorkspace.hasTranscriptSelection(),
      handoff: (delegation) => {
'''
          if text.count(old) != 1:
              raise SystemExit("native handoff match failed")
          extension.write_text(text.replace(old, new))
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-native-clear-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Preserve clear and transcript copy semantics"
          git push origin HEAD:ui/turn-steering-interrupt
