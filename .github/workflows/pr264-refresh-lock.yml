name: PR 264 refresh Cargo.lock

on:
  push:
    branches:
      - refactor/phenix-acp-boundaries-routing-d0-d4

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: refactor/phenix-acp-boundaries-routing-d0-d4
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh lockfile
        working-directory: rust
        run: cargo check --workspace --all-targets
      - name: Commit refreshed lockfile and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/Cargo.lock
          git rm .github/workflows/pr264-refresh-lock.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c core.hooksPath=/dev/null -c commit.gpgSign=false commit --no-verify -m "fix: refresh Rust lockfile"
          git push origin HEAD:refactor/phenix-acp-boundaries-routing-d0-d4
