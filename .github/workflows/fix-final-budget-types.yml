name: Fix final budget types

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/session-budget-mode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/session-budget-mode
      - name: Apply fixes
        run: |
          python scripts/fix_final_budget_types.py
          git diff --check
      - name: Commit clean result
        run: |
          rm scripts/fix_final_budget_types.py
          rm .github/workflows/fix-final-budget-types.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete budget policy typing and fixtures"
          git push origin HEAD:feat/session-budget-mode
