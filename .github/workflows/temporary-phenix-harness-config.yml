name: Temporary Phenix Harness config migration

on:
  push:
    branches:
      - feat/phenix-acp-config-directory

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply migration
        run: |
          python .github/scripts/apply-phenix-harness-lua-config.py
          python .github/scripts/fix-phenix-harness-test-paths.py
      - name: Format
        working-directory: rust
        run: cargo fmt --all
      - name: Test affected crates
        working-directory: rust
        run: |
          cargo test --package phenix-acp --test legacy_definitions
          cargo test --package phenix-ui-lua
          cargo test --package phenix-tui
      - name: Commit clean result
        run: |
          rm .github/scripts/apply-phenix-harness-lua-config.py
          rm .github/scripts/fix-phenix-harness-test-paths.py
          rm .github/workflows/temporary-phenix-harness-config.yml
          git config user.name "Phenix CI"
          git config user.email "69082876+matthis-k@users.noreply.github.com"
          git add -A
          git commit -m "feat: configure ACP session trees from frontend Lua"
          git push origin HEAD:feat/phenix-acp-config-directory
