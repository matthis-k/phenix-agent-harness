name: Rust boilerplate audit source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"missing anchor in {path}: {old[:100]!r}")
              write(path, text.replace(old, new, 1))

          def replace_re(path, pattern, replacement):
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"expected one regex match in {path}: {pattern!r}; got {count}")
              write(path, updated)

          def replace_json_after(path, marker, replacement):
              text = read(path)
              marker_at = text.index(marker)
              start = text.index("json!(", marker_at)
              open_paren = start + len("json!")
              depth = 0
              in_string = False
              escaped = False
              end = None
              for index in range(open_paren, len(text)):
                  char = text[index]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == '"':
                          in_string = False
                      continue
                  if char == '"':
                      in_string = True
                  elif char == '(':
                      depth += 1
                  elif char == ')':
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          break
              if end is None:
                  raise SystemExit(f"unterminated json! after {marker!r} in {path}")
              write(path, text[:start] + replacement + text[end:])

          replace_once(
              "rust/Cargo.toml",
              'reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }\nserde = { version = "1", features = ["derive"] }',
              'reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }\nschemars = "1"\nserde = { version = "1", features = ["derive"] }',
          )
          replace_once(
              "rust/Cargo.toml",
              'tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }\nurl = "2"',
              'thiserror = "2"\ntokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }\nurl = "2"',
          )
          replace_once(
              "rust/crates/phenix-backend/Cargo.toml",
              'phenix-core = { path = "../phenix-core" }\n',
              'phenix-core = { path = "../phenix-core" }\nthiserror.workspace = true\n',
          )
          replace_once(
              "rust/crates/phenix-conductor/Cargo.toml",
              'phenix-protocol = { path = "../phenix-protocol" }\nserde.workspace = true\nserde_json.workspace = true\n',
              'phenix-protocol = { path = "../phenix-protocol" }\nschemars.workspace = true\nserde.workspace = true\nserde_json.workspace = true\nthiserror.workspace = true\n',
          )

          backend = "rust/crates/phenix-backend/src/lib.rs"
          replace_once(
              backend,
              'use std::collections::BTreeSet;\nuse std::error::Error;\nuse std::fmt::{self, Display, Formatter};\nuse std::sync::Arc;\n',
              'use std::collections::BTreeSet;\nuse std::sync::Arc;\nuse thiserror::Error;\n',
          )
          replace_re(
              backend,
              r'#\[derive\(Clone, Debug, Eq, PartialEq\)\]\npub enum BackendError \{.*?\nimpl Error for BackendError \{\}\n',
              '''#[derive(Clone, Debug, Eq, Error, PartialEq)]
          pub enum BackendError {
              #[error("unsupported backend capability: {0}")]
              Unsupported(String),
              #[error("backend transport error: {0}")]
              Transport(String),
              #[error("backend protocol error: {0}")]
              Protocol(String),
          }
          ''',
          )

          provider = "rust/crates/phenix-conductor/src/execution_provider.rs"
          replace_once(
              provider,
              'use std::fmt::{self, Debug, Display, Formatter};\nuse std::sync::Arc;\n',
              'use std::fmt::{self, Debug, Formatter};\nuse std::sync::Arc;\nuse thiserror::Error;\n',
          )
          replace_re(
              provider,
              r'#\[derive\(Clone, Debug, Eq, PartialEq\)\]\npub enum ExecutionProviderError \{.*?\nimpl std::error::Error for ExecutionProviderError \{\}\n',
              '''#[derive(Clone, Debug, Eq, Error, PartialEq)]
          pub enum ExecutionProviderError {
              #[error("unsupported execution provider capability: {0}")]
              Unsupported(String),
              #[error("execution provider failed: {0}")]
              Failed(String),
              #[error("execution provider protocol error: {0}")]
              Protocol(String),
          }
          ''',
          )

          conductor = "rust/crates/phenix-conductor/src/lib.rs"
          replace_once(
              conductor,
              'use serde_json::Value;\nuse std::collections::{BTreeMap, BTreeSet};\nuse std::error::Error;\nuse std::fmt::{self, Display, Formatter};\n',
              'use serde_json::Value;\nuse std::collections::{BTreeMap, BTreeSet};\nuse thiserror::Error;\n',
          )
          replace_re(
              conductor,
              r'#\[derive\(Clone, Debug, Eq, PartialEq\)\]\npub enum ConductorError \{.*?\n(?=#\[derive\(Clone, Debug\)\]\nstruct SessionRecord)',
              '''#[derive(Clone, Debug, Eq, Error, PartialEq)]
          pub enum ConductorError {
              #[error("unknown session: {0}")]
              UnknownSession(SessionId),
              #[error("session is closed: {0}")]
              ClosedSession(SessionId),
              #[error("session has active executions and cannot close: {0}")]
              SessionHasActiveExecutions(SessionId),
              #[error("unknown execution: {0}")]
              UnknownExecution(ExecutionId),
              #[error("input must not be empty")]
              EmptyInput,
              #[error("execution is not runnable: {0}")]
              InvalidLifecycle(ExecutionId),
              #[error("execution is not model-provider backed: {0}")]
              NonModelExecution(ExecutionId),
              #[error("execution is not non-model-provider backed: {0}")]
              NonProviderExecution(ExecutionId),
              #[error("{denial}")]
              PolicyDenied {
                  execution_id: ExecutionId,
                  denial: PolicyDenial,
              },
              #[error(transparent)]
              CallableRegistry(#[from] CallableRegistryError),
              #[error(transparent)]
              ExecutionProvider(#[from] ExecutionProviderError),
              #[error(transparent)]
              Journal(#[from] JournalError),
              #[error(transparent)]
              Routing(#[from] RoutingRegistryError),
              #[error(transparent)]
              Context(#[from] ContextError),
              #[error(transparent)]
              Backend(#[from] BackendError),
          }

          ''',
          )

          workspace = "rust/crates/phenix-conductor/src/workspace_tools.rs"
          replace_once(
              workspace,
              'use phenix_core::{CallableDescriptor, CallableId, CallableKind, CallablePolicy, CapabilitySet};\nuse serde::Deserialize;\nuse serde_json::{json, Value};\n',
              'use phenix_core::{CallableDescriptor, CallableId, CallableKind, CallablePolicy, CapabilitySet};\nuse schemars::{schema_for, JsonSchema};\nuse serde::Deserialize;\nuse serde_json::{json, Value};\n',
          )
          replace_re(
              workspace,
              r'#\[derive\(Deserialize\)\]\n#\[serde\(deny_unknown_fields\)\]\nstruct BashInput \{.*?\nstruct GrepInput \{.*?\n\}\n',
              '''#[derive(Deserialize, JsonSchema)]
          #[serde(deny_unknown_fields)]
          struct BashInput {
              /// Bash program to execute in the current Phenix workspace.
              #[schemars(length(min = 1))]
              command: String,
          }

          #[derive(Deserialize, JsonSchema)]
          #[serde(deny_unknown_fields)]
          struct ReadInput {
              /// Workspace-relative file path.
              #[schemars(length(min = 1))]
              path: String,
              /// 1-based first line to return. Defaults to 1.
              #[schemars(range(min = 1))]
              offset: Option<usize>,
              /// Maximum number of lines to return. Defaults to 400.
              #[schemars(range(min = 1, max = 2000))]
              limit: Option<usize>,
          }

          #[derive(Deserialize, JsonSchema)]
          #[serde(deny_unknown_fields)]
          struct WriteInput {
              /// Workspace-relative file path.
              #[schemars(length(min = 1))]
              path: String,
              /// Complete UTF-8 file contents.
              content: String,
          }

          #[derive(Deserialize, JsonSchema)]
          #[serde(deny_unknown_fields)]
          struct EditInput {
              /// Workspace-relative file path.
              #[schemars(length(min = 1))]
              path: String,
              /// Exact text to replace.
              #[schemars(length(min = 1))]
              old_text: String,
              /// Replacement text.
              new_text: String,
              /// Replace every exact match. Defaults to false and otherwise requires a unique match.
              replace_all: Option<bool>,
          }

          #[derive(Deserialize, JsonSchema)]
          #[serde(deny_unknown_fields)]
          struct GrepInput {
              /// Regular expression to search for.
              #[schemars(length(min = 1))]
              pattern: String,
              /// Workspace-relative, home-relative, or absolute path resolving inside the workspace.
              #[schemars(length(min = 1))]
              path: Option<String>,
              /// Whether matching is case-sensitive. Defaults to true.
              case_sensitive: Option<bool>,
          }
          ''',
          )
          for marker, typ in [
              ('            "bash",', 'BashInput'),
              ('            "read",', 'ReadInput'),
              ('            "write",', 'WriteInput'),
              ('            "edit",', 'EditInput'),
              ('            "grep",', 'GrepInput'),
          ]:
              replace_json_after(workspace, marker, f'input_schema::<{typ}>()')
          replace_once(
              workspace,
              '\nfn tool_descriptor(\n',
              '''
          fn input_schema<T: JsonSchema>() -> Value {
              serde_json::to_value(schema_for!(T)).expect("derived input schema must serialize")
          }

          fn tool_descriptor(
          ''',
          )
          replace_once(
              workspace,
              '    fn fixture_descriptor(id: &str, kind: CallableKind) -> CallableDescriptor {',
              '''    #[test]
              fn derived_workspace_input_schemas_preserve_parser_constraints() {
                  let bash = input_schema::<BashInput>();
                  assert_eq!(bash["additionalProperties"], false);
                  assert_eq!(bash["properties"]["command"]["minLength"], 1);

                  let read = input_schema::<ReadInput>();
                  assert_eq!(read["properties"]["offset"]["minimum"], 1);
                  assert_eq!(read["properties"]["limit"]["maximum"], MAX_READ_LINES);
              }

              fn fixture_descriptor(id: &str, kind: CallableKind) -> CallableDescriptor {''',
          )

          semantic = "rust/crates/phenix-conductor/src/semantic_tools.rs"
          replace_once(
              semantic,
              'use phenix_core::{\n    CallableDescriptor, CallableId, CallableKind, CallablePolicy, CapabilitySet,\n    ExecutionEventKind, ExecutionKind, ExecutionSummary, SkillId,\n};\nuse serde::Deserialize;\n',
              'use phenix_core::{\n    CallableDescriptor, CallableId, CallableKind, CallablePolicy, CapabilitySet,\n    ExecutionEventKind, ExecutionKind, ExecutionSummary, SkillId,\n};\nuse schemars::{schema_for, JsonSchema};\nuse serde::Deserialize;\n',
          )
          replace_re(
              semantic,
              r'#\[derive\(Debug, Deserialize\)\]\n#\[serde\(deny_unknown_fields\)\]\nstruct OrchestrationStartInput \{.*?\nstruct SkillResourceReadInput \{.*?\n\}\n',
              '''#[derive(Debug, Deserialize, JsonSchema)]
          #[serde(deny_unknown_fields)]
          struct EmptyInput {}

          #[derive(Debug, Deserialize, JsonSchema)]
          #[serde(deny_unknown_fields)]
          struct OrchestrationStartInput {
              /// Orchestration id returned by phenix_orchestration_list.
              #[schemars(length(min = 1))]
              orchestration: String,
              /// Objective for the orchestration.
              #[schemars(length(min = 1))]
              objective: String,
          }

          #[derive(Debug, Deserialize, JsonSchema)]
          #[serde(deny_unknown_fields)]
          struct SkillLoadInput {
              /// Skill id from the available-skills catalog.
              #[schemars(length(min = 1))]
              skill: String,
          }

          #[derive(Debug, Deserialize, JsonSchema)]
          #[serde(deny_unknown_fields)]
          struct SkillResourceReadInput {
              /// Active skill id.
              #[schemars(length(min = 1))]
              skill: String,
              /// Relative resource path exactly as listed by the active skill.
              #[schemars(length(min = 1))]
              path: String,
          }
          ''',
          )
          replace_re(
              semantic,
              r'fn parse_list\(arguments_json: &str\) -> Result<\(\), String> \{.*?\n\}\n',
              '''fn parse_list(arguments_json: &str) -> Result<(), String> {
              serde_json::from_str::<EmptyInput>(arguments_json)
                  .map(|_| ())
                  .map_err(|error| format!("invalid orchestration list arguments: {error}"))
          }
          ''',
          )
          for marker, typ in [
              ('fn skill_load_descriptor()', 'SkillLoadInput'),
              ('fn skill_resource_read_descriptor()', 'SkillResourceReadInput'),
              ('fn orchestration_list_descriptor()', 'EmptyInput'),
              ('fn orchestration_start_descriptor()', 'OrchestrationStartInput'),
          ]:
              replace_json_after(semantic, marker, f'input_schema::<{typ}>()')
          replace_once(
              semantic,
              '\nfn skill_load_descriptor() -> CallableDescriptor {\n',
              '''
          fn input_schema<T: JsonSchema>() -> Value {
              serde_json::to_value(schema_for!(T)).expect("derived input schema must serialize")
          }

          fn skill_load_descriptor() -> CallableDescriptor {
          ''',
          )
          write(
              semantic,
              read(semantic)
              + '''

          #[cfg(test)]
          mod schema_tests {
              use super::*;

              #[test]
              fn derived_semantic_input_schemas_preserve_parser_constraints() {
                  let empty = input_schema::<EmptyInput>();
                  assert_eq!(empty["additionalProperties"], false);

                  let start = input_schema::<OrchestrationStartInput>();
                  assert_eq!(start["properties"]["orchestration"]["minLength"], 1);
                  assert_eq!(start["properties"]["objective"]["minLength"], 1);

                  let resource = input_schema::<SkillResourceReadInput>();
                  assert_eq!(resource["properties"]["path"]["minLength"], 1);
              }
          }
          '''
          )
          PY
