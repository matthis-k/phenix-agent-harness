name: Verify generic authentication terminal once

on:
  push:
    branches:
      - fix/acp-auth-transcript-errors
    paths:
      - .github/workflows/verify-auth-terminal-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: fix/acp-auth-transcript-errors
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run full Rust gates
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR=/tmp/phenix-target

          set +e
          cargo fmt --manifest-path rust/Cargo.toml --all --check > /tmp/fmt.log 2>&1
          fmt_status=$?
          cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --locked --message-format=short > /tmp/check.log 2>&1
          check_status=$?
          clippy_status=0
          test_status=0
          if (( fmt_status == 0 && check_status == 0 )); then
            cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked --message-format=short -- -D warnings > /tmp/clippy.log 2>&1
            clippy_status=$?
          else
            : > /tmp/clippy.log
          fi
          if (( fmt_status == 0 && check_status == 0 && clippy_status == 0 )); then
            cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked --message-format=short > /tmp/test.log 2>&1
            test_status=$?
          else
            : > /tmp/test.log
          fi
          set -e

          rm -f .github/diagnostics-auth-terminal.txt
          if (( fmt_status || check_status || clippy_status || test_status )); then
            {
              echo "fmt_status=${fmt_status}"
              echo "check_status=${check_status}"
              echo "clippy_status=${clippy_status}"
              echo "test_status=${test_status}"
              for phase in fmt check clippy test; do
                echo
                echo "## ${phase}"
                grep -E '(^|: )(error(\[[A-Z0-9]+\])?:|warning:|test result:|Diff in )' "/tmp/${phase}.log" | tail -n 240 || true
                tail -n 120 "/tmp/${phase}.log"
              done
            } > .github/diagnostics-auth-terminal.txt
          fi

          rm .github/workflows/verify-auth-terminal-once.yml
          git add -u .github/diagnostics-auth-terminal.txt .github/workflows/verify-auth-terminal-once.yml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "chore(auth): update terminal verification diagnostics"
            git push --quiet origin HEAD:fix/acp-auth-transcript-errors
          fi

          echo "fmt=${fmt_status} check=${check_status} clippy=${clippy_status} test=${test_status}"
          if (( fmt_status || check_status || clippy_status || test_status )); then
            exit 1
          fi
