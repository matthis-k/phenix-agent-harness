name: Remove Phenix API versioning

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/session-budget-mode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/session-budget-mode
      - name: Apply cleanup
        run: |
          python scripts/remove_phenix_api_versioning.py
          git diff --check
      - name: Commit canonical API
        run: |
          rm scripts/remove_phenix_api_versioning.py
          rm .github/workflows/remove-phenix-api-versioning.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Phenix API versioning and update consumers"
          git push origin HEAD:feat/session-budget-mode
