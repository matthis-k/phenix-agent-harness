name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Maintenance checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: Produce canonical formatter output
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/phenix-cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/phenix-cargo-target"
          nix run .#phenix-maintenance -- fix
          tar -czf "$RUNNER_TEMP/phenix-flake-maintenance-lib.tar.gz" vendor/phenix-flake-maintenance/lib

      - name: Upload canonical formatter output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formatted-maintenance-lib
          path: ${{ runner.temp }}/phenix-flake-maintenance-lib.tar.gz
          if-no-files-found: error
