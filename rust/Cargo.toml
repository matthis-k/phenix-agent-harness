[workspace]
resolver = "2"
members = [
  "crates/phenix-acp",
  "crates/phenix-acp-presets",
  "crates/phenix-frontend-config",
  "crates/phenix-process-backend",
  "crates/phenix-runtime-api",
  "crates/phenix-tui",
  "crates/phenix-ui-core",
  "crates/phenix-ui-lua",
  "crates/phenix-ui-runtime",
]

[workspace.dependencies]
clap = { version = "4.5.47", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
mlua = { version = "0.12.0", features = ["lua54", "vendored"] }
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
