name: context-skills-patch

on:
  push:
    branches:
      - agent/context-and-skills

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/context-and-skills
          fetch-depth: 0
      - name: Apply implementation
        run: python3 .github/apply-context-skills.py
      - name: Format Rust
        run: cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust
          git commit -m 'feat: add conductor context and skills'
          git push origin HEAD:agent/context-and-skills
      - name: Focused Rust tests
        run: cargo test --manifest-path rust/Cargo.toml -p phenix-core -p phenix-protocol -p phenix-conductor
