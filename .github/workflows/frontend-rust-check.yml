name: Frontend Rust check

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/frontend-rust-check.yml
      - rust/**

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@4305c38b25d97ef35a8ad1f985ccf2d2242004f2
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply event envelope migration
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("rust/crates/phenix-ui-core/src/reducer.rs"): [
                  ("    Backend(BackendOutput),", "    Backend(Box<BackendOutput>),"),
                  (
                      "        AppEvent::Backend(output) => reduce_backend_output(state, output),",
                      "        AppEvent::Backend(output) => reduce_backend_output(state, *output),",
                  ),
              ],
              Path("rust/crates/phenix-ui-runtime/src/consumers.rs"): [
                  (
                      "BusReaction::App(AppEvent::Backend(output.clone()))",
                      "BusReaction::App(AppEvent::Backend(Box::new(output.clone())))",
                  ),
              ],
          }

          for path, edits in replacements.items():
              content = path.read_text()
              for old, new in edits:
                  if old in content:
                      content = content.replace(old, new)
                  elif new not in content:
                      raise SystemExit(f"expected migration pattern missing in {path}: {old}")
              path.write_text(content)
          PY
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Commit generated Rust files
        run: |
          if ! git diff --quiet -- rust; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add rust
            git commit -m "compact backend event envelopes"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - name: Check
        run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked
