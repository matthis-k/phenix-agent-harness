name: Frontend Rust check

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/frontend-rust-check.yml
      - rust/**

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@4305c38b25d97ef35a8ad1f985ccf2d2242004f2
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply structural Rust cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(path: Path, old: str, new: str) -> None:
              content = path.read_text()
              if old in content:
                  path.write_text(content.replace(old, new))
              elif new not in content:
                  raise SystemExit(f"expected pattern missing in {path}: {old}")

          def derive_default(path: Path, struct_marker: str, impl_marker: str) -> None:
              content = path.read_text()
              struct_start = content.index(struct_marker)
              derive_start = content.rfind("#[derive(", 0, struct_start)
              if derive_start >= 0 and content.rfind("\n\n", 0, struct_start) < derive_start:
                  derive_end = content.index(")]", derive_start) + 2
                  derive = content[derive_start:derive_end]
                  if "Default" not in derive:
                      parts = derive.removeprefix("#[derive(").removesuffix(")]" ).split(", ")
                      parts.insert(0, "Default")
                      content = content[:derive_start] + "#[derive(" + ", ".join(parts) + ")]" + content[derive_end:]
              else:
                  content = content[:struct_start] + "#[derive(Default)]\n" + content[struct_start:]

              if impl_marker in content:
                  impl_start = content.index(impl_marker)
                  line_start = content.rfind("\n", 0, impl_start) + 1
                  depth = 0
                  index = content.index("{", impl_start)
                  while index < len(content):
                      if content[index] == "{":
                          depth += 1
                      elif content[index] == "}":
                          depth -= 1
                          if depth == 0:
                              impl_end = index + 1
                              break
                      index += 1
                  else:
                      raise SystemExit(f"unbalanced impl in {path}")
                  while impl_end < len(content) and content[impl_end] == "\n":
                      impl_end += 1
                  content = content[:line_start] + content[impl_end:]

              path.write_text(content)

          derive_default(
              Path("rust/crates/phenix-ui-lua/src/provider.rs"),
              "pub(crate) struct LuaState {",
              "impl Default for LuaState {",
          )
          derive_default(
              Path("rust/crates/phenix-ui-runtime/src/fabric.rs"),
              "pub struct EventRouter {",
              "impl Default for EventRouter {",
          )

          fabric = Path("rust/crates/phenix-ui-runtime/src/fabric.rs")
          replace_required(fabric, "    Backend(BackendOutput),", "    Backend(Box<BackendOutput>),")
          replace_required(
              fabric,
              "    Content(EventEnvelope<ContentEvent>),",
              "    Content(Box<EventEnvelope<ContentEvent>>),",
          )
          replace_required(
              fabric,
              '''            RouteTarget::Element(element) => self
                  .nodes
                  .contains_key(element)
                  .then(|| vec![element.clone()])
                  .unwrap_or_default(),''',
              '''            RouteTarget::Element(element) => {
                  if self.nodes.contains_key(element) {
                      vec![element.clone()]
                  } else {
                      Vec::new()
                  }
              }''',
          )

          mailbox = Path("rust/crates/phenix-ui-runtime/src/mailbox.rs")
          replace_required(
              mailbox,
              "    Content(EventEnvelope<ContentEvent>),",
              "    Content(Box<EventEnvelope<ContentEvent>>),",
          )
          replace_required(
              mailbox,
              "        self.send_lossless(UiMessage::Content(event))",
              "        self.send_lossless(UiMessage::Content(Box::new(event)))",
          )
          replace_required(
              mailbox,
              "        self.send_content(EventEnvelope::broadcast(ContentEvent::Backend(output)))",
              "        self.send_content(EventEnvelope::broadcast(ContentEvent::Backend(Box::new(output))))",
          )
          replace_required(
              mailbox,
              '''        self.try_send_coalescible(UiMessage::Content(EventEnvelope::broadcast(
              ContentEvent::RefreshRequested,
          )))''',
              '''        self.try_send_coalescible(UiMessage::Content(Box::new(
              EventEnvelope::broadcast(ContentEvent::RefreshRequested),
          )))''',
          )
          replace_required(
              mailbox,
              '''        self.try_send_coalescible(UiMessage::Content(EventEnvelope::broadcast(
              ContentEvent::ClockTick,
          )))''',
              '''        self.try_send_coalescible(UiMessage::Content(Box::new(
              EventEnvelope::broadcast(ContentEvent::ClockTick),
          )))''',
          )

          consumers = Path("rust/crates/phenix-ui-runtime/src/consumers.rs")
          replace_required(
              consumers,
              "AppEvent::Backend(Box::new(output.clone()))",
              "AppEvent::Backend(output.clone())",
          )

          for path in Path("rust/crates").rglob("*.rs"):
              content = path.read_text()
              content = content.replace(
                  "BusReaction::Content(EventEnvelope::",
                  "BusReaction::Content(Box::new(EventEnvelope::",
              )
              if "BusReaction::Content(Box::new(EventEnvelope::" in content:
                  lines = content.splitlines()
                  for index, line in enumerate(lines):
                      if "BusReaction::Content(Box::new(EventEnvelope::" in line:
                          depth = line.count("(") - line.count(")")
                          cursor = index + 1
                          while depth > 0 and cursor < len(lines):
                              depth += lines[cursor].count("(") - lines[cursor].count(")")
                              cursor += 1
                          if depth == 0 and cursor > index + 1:
                              terminal = cursor - 1
                              if lines[terminal].rstrip().endswith(")") and not lines[terminal].rstrip().endswith("))"):
                                  lines[terminal] = lines[terminal] + ")"
                  content = "\n".join(lines) + ("\n" if path.read_text().endswith("\n") else "")
              path.write_text(content)
          PY
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Commit generated Rust files
        run: |
          if ! git diff --quiet -- rust; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add rust
            git commit -m "compact routed event envelopes"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - name: Check
        run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked
