name: Fix workspace primitives

on:
  push:
    branches: [migration/workspace-primitives]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with: { fetch-depth: 0 }
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Apply targeted cleanup
        run: python .github/fix-workspace-primitives.py
      - name: Remove one-shot files
        run: rm .github/fix-workspace-primitives.py .github/workflows/fix-workspace-primitives.yml
      - name: Apply canonical maintenance fixes
        run: devenv tasks run maintenance:fix
      - name: Validate patch
        run: git diff --check
      - name: Commit cleaned source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Format deterministic workspace primitives"
          git push origin HEAD:migration/workspace-primitives
