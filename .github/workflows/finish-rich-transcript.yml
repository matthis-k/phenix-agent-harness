name: Rich transcript clean integration

on:
  push:
    branches:
      - refactor/rich-transcript-blocks

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
      - name: Rebuild, validate, and publish clean feature branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          text = subprocess.check_output(
              ['git', 'show', '87c2ae1bceee7dd680531211f47eb195cba75b17:.github/workflows/finish-rich-transcript.yml'],
              text=True,
          )
          marker = '        run: |\n'
          if marker not in text:
              raise SystemExit('finalizer run block not found')
          block = text.split(marker, 1)[1]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          ) + '\n'

          old = 'cargo fmt --all\ncargo fmt --all --check'
          feature_files = [
              'crates/phenix-tui/src/rich_document.rs',
              'crates/phenix-tui/src/syntax_highlight.rs',
              'crates/phenix-tui/src/terminal_media.rs',
              'crates/phenix-tui/src/transcript.rs',
              'crates/phenix-ui-core/src/rich_text.rs',
              'crates/phenix-ui-runtime/src/runtime.rs',
          ]
          files = ' '.join(feature_files)
          new = (
              f'rustfmt --edition 2021 {files}\n'
              f'rustfmt --edition 2021 --check {files}'
          )
          if old not in script:
              raise SystemExit('cargo fmt block not found')
          Path('/tmp/finalize-rich.sh').write_text(script.replace(old, new, 1))
          PY
          bash /tmp/finalize-rich.sh
