name: tmp-model-descriptor-refs

on:
  push:
    branches:
      - agent/filter-models-by-auth
    paths:
      - .github/workflows/tmp-model-descriptor-refs.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/filter-models-by-auth
      - name: Find ModelDescriptor references
        run: grep -R -n 'ModelDescriptor' rust || true
