name: Finalize Mermaid formatting

on:
  push:
    branches: [feat/tui-workflow-diagrams]

permissions:
  contents: write

concurrency:
  group: finalize-mermaid-format
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: feat/tui-workflow-diagrams

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with: { name: devenv }

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Apply repository maintenance fixes
        run: devenv tasks run maintenance:fix

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/finalize-mermaid-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --stat
          git commit -m "Format Mermaid rendering integration [skip ci]"
          git push origin HEAD:feat/tui-workflow-diagrams
