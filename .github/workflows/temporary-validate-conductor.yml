name: Temporary conductor validation

on:
  push:
    branches:
      - feat/phenix-acp-config-directory
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-conductor-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Validate Phenix ACP conductor surface
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rustfmt
          cd rust
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo test --package phenix-acp --all-targets --locked
