name: Run flat Phenix UI refinement

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'refine/flat-phenix-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: refine/flat-phenix-ui
          fetch-depth: 0
      - name: Extract refinement
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-flat-ui.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end])

          old_runs_guard = '''if old_runs not in ui:
              raise SystemExit("runs split did not match")
          ui = ui.replace(old_runs, new_runs)'''.replace('          ', '')
          new_runs_guard = '''ui, count = re.subn(
              r'    return Array\\.from\\(\\{ length: height \\}, \\(_, row\\) => \\{\\n      const left = tree\\[row\\].*?\\n    \\}\\);',
              new_runs,
              ui,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"runs split replacement count was {count}")'''.replace('          ', '')
          if old_runs_guard not in script:
              raise SystemExit('runs guard was not found in extracted script')
          script = script.replace(old_runs_guard, new_runs_guard)

          old_footer_guard = '''if footer_old not in ui:
              raise SystemExit("footer did not match")
          ui = ui.replace(footer_old, footer_new)'''.replace('          ', '')
          new_footer_guard = '''ui, count = re.subn(
              r'(    const hints = this\\.footerHints\\(\\);\\n)    return this\\.fitLine\\(.*?\\n    \\);',
              lambda match: match.group(1) + footer_new,
              ui,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"footer replacement count was {count}")'''.replace('          ', '')
          if old_footer_guard not in script:
              raise SystemExit('footer guard was not found in extracted script')
          script = script.replace(old_footer_guard, new_footer_guard)

          visual_value = '\n    \'\'\'test("uses centered background surfaces without redundant active markers"'
          visual_lambda = '\n    lambda _match: \'\'\'test("uses centered background surfaces without redundant active markers"'
          if script.count(visual_value) != 1:
              raise SystemExit('visual test replacement value was not found exactly once')
          script = script.replace(visual_value, visual_lambda)

          Path('/tmp/apply-flat-ui.py').write_text(script + '\n')
          PY
      - name: Apply refinement
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 /tmp/apply-flat-ui.py 2>&1 | tee .github/flat-ui-error.txt
      - name: Commit result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "${{ steps.apply.outcome }}" = success ]; then
            rm .github/workflows/apply-flat-ui.yml
            rm .github/workflows/run-flat-ui-on-pr.yml
            rm -f .github/flat-ui-trigger .github/flat-ui-error.txt
            git diff --check
            git add -A
            git commit -m "refine Phenix UI visual hierarchy"
          else
            git add .github/flat-ui-error.txt
            git commit -m "chore: capture flat UI patch failure"
          fi
          git push origin HEAD:refine/flat-phenix-ui
      - name: Fail after diagnostics
        if: steps.apply.outcome != 'success'
        run: exit 1
