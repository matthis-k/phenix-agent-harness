name: Validate rmcp MCP bridge

on:
  push:
    branches:
      - agent/rmcp-mcp-bridge
  pull_request:
    branches:
      - agent/reduce-rust-boilerplate-run

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: agent/rmcp-mcp-bridge
          fetch-depth: 0
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - name: Refresh Cargo lock and compile
        run: |
          set -euo pipefail
          cd rust
          cargo check --workspace
      - name: Apply deterministic maintenance fixes
        run: nix run .#phenix-maintenance -- fix
      - name: Validate repository
        run: nix run .#phenix-maintenance -- all
      - name: Commit validated result
        run: |
          set -euo pipefail
          rm .github/workflows/validate-rmcp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            rust/Cargo.lock \
            rust/Cargo.toml \
            rust/crates/phenix-backend-acp/Cargo.toml \
            rust/crates/phenix-backend-acp/src/mcp_bridge.rs \
            .github/workflows/validate-rmcp.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: validate rmcp MCP bridge"
            git push origin HEAD:agent/rmcp-mcp-bridge
          fi
