name: Temporary conductor validation

on:
  push:
    branches:
      - feat/phenix-acp-config-directory
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-conductor-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Format and validate Phenix ACP conductor surface
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rustfmt
          cd rust
          cargo fmt --all
          cargo generate-lockfile
          cd ..
          if ! git diff --quiet -- rust; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rust
            git -c core.hooksPath=/dev/null commit -m "chore: synchronize Rust workspace"
            git push
            exit 0
          fi
          cd rust
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo test --package phenix-acp --all-targets --locked
          cargo test --package phenix-conductor --all-targets --locked
