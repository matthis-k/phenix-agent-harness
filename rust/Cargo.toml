[workspace]
resolver = "2"
members = [
  "crates/phenix-acp",
  "crates/phenix-acp-presets",
  "crates/phenix-core",
  "crates/phenix-protocol",
  "crates/phenix-backend",
  "crates/phenix-backend-acp",
  "crates/phenix-backend-native",
  "crates/phenix-conductor",
]

[workspace.dependencies]
agent-client-protocol = { version = "2.0.0", features = [
  "unstable_auth_methods",
  "unstable_elicitation",
  "unstable_end_turn_token_usage",
  "unstable_session_fork",
  "unstable_mcp_over_acp",
] }
base64 = "0.22"
clap = { version = "4.5.47", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
futures = "0.3"
genai = "0.6.0"
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2"
