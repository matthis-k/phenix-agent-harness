name: tmp-filter-models-by-auth

on:
  push:
    branches:
      - agent/filter-models-by-auth
    paths:
      - .github/workflows/tmp-filter-models-by-auth.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/filter-models-by-auth
      - name: Patch native catalog
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Test native backend
        run: cargo test --manifest-path rust/Cargo.toml -p phenix-backend-native
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/phenix-backend-native/src/lib.rs
          git commit -m 'feat: filter models by provider authentication'
          git push origin HEAD:agent/filter-models-by-auth
