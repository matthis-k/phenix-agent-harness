name: Apply reviewed Rustfmt once

on:
  push:
    branches:
      - feature/rust-ratatui-frontend
    paths:
      - .github/workflows/apply-rustfmt-once.yml

permissions:
  contents: write

concurrency:
  group: apply-rustfmt-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feature/rust-ratatui-frontend
          fetch-depth: 0
      - name: Apply formatter and remove helper
        shell: bash
        run: |
          set -euo pipefail
          cd rust
          cargo fmt --all
          cd ..
          rm .github/workflows/apply-rustfmt-once.yml
          git add rust .github/workflows/apply-rustfmt-once.yml
          if git diff --cached --quiet; then
            echo "No formatting changes were required" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(rust): apply reviewed rustfmt output"
          git push origin HEAD:feature/rust-ratatui-frontend
