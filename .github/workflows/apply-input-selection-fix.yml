name: Apply input selection cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-input-selection-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'fix/workspace-input-selection' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          ref: fix/workspace-input-selection
      - name: Generalize selection boundary names
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("modules/phenix-pi")
          replacements = {
              "hasTranscriptSelection": "hasTextSelection",
              "WORKSPACE_COPY_TRANSCRIPT": "WORKSPACE_COPY_TEXT",
              "copyTranscript": "copyWorkspaceText",
          }
          changed = 0
          for path in [*root.joinpath("extension").rglob("*.ts"), *root.joinpath("tests").rglob("*.ts")]:
              source = path.read_text()
              updated = source
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated == source:
                  continue
              path.write_text(updated)
              changed += 1
          if changed == 0:
              raise SystemExit("selection cleanup changed no files")
          PY
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Format repository changes
        run: devenv tasks run maintenance:fix:format
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules
          git commit -m "refactor(workspace): generalize text selection naming"
          git push origin HEAD:fix/workspace-input-selection
