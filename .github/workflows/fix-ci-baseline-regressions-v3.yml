name: Repair CI baseline regressions v3

on:
  push:
    branches:
      - fix/ci-baseline-regressions

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply repaired baseline patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/fix-ci-baseline-regressions-v2.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'baseline-repair', 'exec'))

          path = Path('rust/crates/phenix-conductor/tests/black_box_model_tool_loop.rs')
          text = path.read_text()
          old = '''    let specialist_result = process.receive_response(8)?;
    assert!(
        specialist_result.to_string().contains("42"),
        "specialist response did not traverse the conductor: {specialist_result}"
    );
'''
          new = '''    let mut specialist_results = vec![process.receive_response(8)?];
    for poll_id in 8_000..8_250 {
        if specialist_results
            .iter()
            .any(|result| result.to_string().contains("42"))
        {
            break;
        }
        thread::sleep(Duration::from_millis(20));
        process.send_request(
            poll_id,
            "_phenix/node/execute",
            &json!({
                "tree_id": tree_id,
                "node_id": specialist_node,
                "command": { "kind": "poll" }
            }),
        )?;
        specialist_results.push(process.receive_response(poll_id)?);
    }
    assert!(
        specialist_results
            .iter()
            .any(|result| result.to_string().contains("42")),
        "specialist response did not traverse the conductor: {specialist_results:?}"
    );
'''
          if text.count(old) != 1:
              raise SystemExit('black-box async execution assertion shape changed unexpectedly')
          path.write_text(text.replace(old, new))
          PY

          rm .github/workflows/fix-ci-baseline-regressions.yml
          rm .github/workflows/fix-ci-baseline-regressions-v2.yml
          rm .github/workflows/fix-ci-baseline-regressions-v3.yml

      - name: Check diff
        run: git diff --check

      - name: Test repaired baselines
        working-directory: rust
        run: |
          cargo test -p phenix-conductor --test black_box_model_tool_loop --test stdio_roundtrip
          cargo test -p phenix-ui-core --test editor_modes
          cargo test --workspace --no-fail-fast

      - name: Publish repaired branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair conductor and editor CI baselines"
          git push origin HEAD:fix/ci-baseline-regressions
