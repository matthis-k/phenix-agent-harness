name: PR 264 finalize fixup

on:
  push:
    branches:
      - refactor/phenix-acp-boundaries-routing-d0-d4
    paths:
      - .github/workflows/pr264-finalize-fixup.yml

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: refactor/phenix-acp-boundaries-routing-d0-d4
      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy
      - name: Apply validated base candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/pr264-base-fixup.yml').read_text().splitlines()
          start = source.index('      - name: Apply ACP transport and migration fixes')
          run = source.index('        run: |', start) + 1
          end = next(i for i in range(run, len(source)) if source[i].startswith('      - name: '))
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[run:end]) + '\n'
          Path('/tmp/apply-pr264-fixes.sh').write_text(script)
          PY
          bash /tmp/apply-pr264-fixes.sh
          python3 - <<'PY'
          from pathlib import Path

          path = Path('rust/crates/phenix-conductor/tests/black_box_model_tool_loop.rs')
          text = path.read_text()
          old_routes = '''| Role | Workflow | Target | Explanation |\n|---|---|---|---|\n| `coordinator` | `*` | `coordinator/mock/coordinator` | deterministic coordinator |\n| `specialist` | `*` | `specialist/mock/specialist` | deterministic specialist |\n| `*` | `*` | `coordinator/mock/coordinator` | fallback coordinator |\n'''
          new_routes = '''| Role | Workflow | D0 | D1 | D2 | D3 | D4 | Explanation |\n|---|---|---|---|---|---|---|---|\n| `coordinator` | `*` | `coordinator/mock/coordinator/off` | `coordinator/mock/coordinator/off` | `coordinator/mock/coordinator/off` | `coordinator/mock/coordinator/off` | `coordinator/mock/coordinator/off` | deterministic coordinator |\n| `specialist` | `*` | `specialist/mock/specialist/off` | `specialist/mock/specialist/off` | `specialist/mock/specialist/off` | `specialist/mock/specialist/off` | `specialist/mock/specialist/off` | deterministic specialist |\n| `*` | `*` | `coordinator/mock/coordinator/off` | `coordinator/mock/coordinator/off` | `coordinator/mock/coordinator/off` | `coordinator/mock/coordinator/off` | `coordinator/mock/coordinator/off` | fallback coordinator |\n'''
          if old_routes not in text:
              raise SystemExit('expected legacy black-box routing table not found')
          text = text.replace(old_routes, new_routes, 1)
          old = '    assert_eq!(configured["result"]["revision"], 1);\n'
          new = '''    assert_eq!(\n        configured["result"]["revision"],\n        1,\n        "configuration apply failed: {configured}"\n    );\n'''
          if old not in text:
              raise SystemExit('expected black-box revision assertion not found')
          path.write_text(text.replace(old, new, 1))

          mock = Path('rust/crates/phenix-conductor/src/bin/mock-acp-agent.rs')
          text = mock.read_text()
          text = text.replace(
              '            "configOptions": self.model_options(&selected_model),\n',
              '            "configOptions": self.config_options(&selected_model),\n',
              1,
          )
          old_select = '''        let config_id = required_string(&request, "configId")?;\n        if config_id != "model" {\n            return Err(format!("unsupported mock config option {config_id:?}").into());\n        }\n        let model = required_string(&request, "value")?;\n        if !self\n            .config\n            .models\n            .iter()\n            .any(|candidate| candidate.id == model)\n        {\n            return Err(format!("unknown mock model {model:?}").into());\n        }\n        let session = self\n            .sessions\n            .get_mut(&session_id)\n            .ok_or_else(|| format!("unknown mock session {session_id:?}"))?;\n        session.selected_model = model.clone();\n        self.log(json!({\n            "kind": "model_selected",\n            "backend": self.config.backend_id,\n            "session_id": session_id,\n            "model": model,\n        }))?;\n        Ok(json!({\n            "configOptions": self.model_options(&model),\n        }))\n'''
          new_select = '''        let config_id = required_string(&request, "configId")?;\n        let value = required_string(&request, "value")?;\n        match config_id.as_str() {\n            "model" => {\n                if !self\n                    .config\n                    .models\n                    .iter()\n                    .any(|candidate| candidate.id == value)\n                {\n                    return Err(format!("unknown mock model {value:?}").into());\n                }\n                let session = self\n                    .sessions\n                    .get_mut(&session_id)\n                    .ok_or_else(|| format!("unknown mock session {session_id:?}"))?;\n                session.selected_model = value.clone();\n                self.log(json!({\n                    "kind": "model_selected",\n                    "backend": self.config.backend_id,\n                    "session_id": session_id,\n                    "model": value,\n                }))?;\n                Ok(json!({\n                    "configOptions": self.config_options(&value),\n                }))\n            }\n            "thinking" => {\n                if value != "off" {\n                    return Err(format!("unsupported mock thinking level {value:?}").into());\n                }\n                let model = self\n                    .sessions\n                    .get(&session_id)\n                    .ok_or_else(|| format!("unknown mock session {session_id:?}"))?\n                    .selected_model\n                    .clone();\n                Ok(json!({\n                    "configOptions": self.config_options(&model),\n                }))\n            }\n            _ => Err(format!("unsupported mock config option {config_id:?}").into()),\n        }\n'''
          if old_select not in text:
              raise SystemExit('expected model-only mock config selection')
          text = text.replace(old_select, new_select, 1)
          old_options = '''    fn model_options(&self, current: &str) -> Value {\n        json!([{\n            "id": "model",\n            "name": "Model",\n            "category": "model",\n            "type": "select",\n            "currentValue": current,\n            "options": self.config.models.iter().map(|model| json!({\n                "value": model.id,\n                "name": model.display_name,\n            })).collect::<Vec<_>>(),\n        }])\n    }\n'''
          new_options = '''    fn config_options(&self, current_model: &str) -> Value {\n        json!([\n            {\n                "id": "model",\n                "name": "Model",\n                "category": "model",\n                "type": "select",\n                "currentValue": current_model,\n                "options": self.config.models.iter().map(|model| json!({\n                    "value": model.id,\n                    "name": model.display_name,\n                })).collect::<Vec<_>>(),\n            },\n            {\n                "id": "thinking",\n                "name": "Thinking",\n                "category": "thought_level",\n                "type": "select",\n                "currentValue": "off",\n                "options": [{ "value": "off", "name": "Off" }],\n            }\n        ])\n    }\n'''
          if old_options not in text:
              raise SystemExit('expected model-only mock options')
          mock.write_text(text.replace(old_options, new_options, 1))
          PY
          cd rust
          cargo fmt --all
      - name: Rust check and refresh lockfile
        run: cargo check --workspace --all-targets
        working-directory: rust
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: rust
      - name: Black-box conductor regression
        run: cargo test -p phenix-conductor --test black_box_model_tool_loop --locked
        working-directory: rust
      - name: Rust tests
        run: cargo test --workspace --all-targets --locked
        working-directory: rust
      - name: Commit source repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git commit -m 'fix: restore ACP workspace compilation'
          git push origin HEAD:refactor/phenix-acp-boundaries-routing-d0-d4
