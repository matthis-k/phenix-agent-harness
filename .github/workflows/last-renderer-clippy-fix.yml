name: Last renderer clippy fix

on:
  push:
    branches:
      - refactor/rich-transcript-blocks

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: refactor/rich-transcript-blocks
      - name: Fix remaining initializer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('rust/crates/phenix-tui/src/renderer.rs')
          text = path.read_text()
          old = '''        let mut state = AppState::default();
                  state.root_run = Some(run_id.clone());
                  state.selected_run = Some(run_id.clone());
          '''
          new = '''        let mut state = AppState {
                  root_run: Some(run_id.clone()),
                  selected_run: Some(run_id.clone()),
                  ..AppState::default()
              };
          '''
          if old not in text:
              raise SystemExit('remaining renderer initializer not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cd rust
          cargo fmt --all
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/crates/phenix-tui/src/renderer.rs
          git commit -m "test(tui): initialize image renderer state explicitly"
          git push origin HEAD:refactor/rich-transcript-blocks
