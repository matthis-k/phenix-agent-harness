name: PR capability cleanup

on:
  push:
    branches:
      - refactor/canonical-backend-capabilities

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: refactor/canonical-backend-capabilities
      - name: Converge capability model
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          protocol = Path('rust/crates/phenix-runtime-api/src/protocol.rs')
          text = protocol.read_text()
          if 'use serde::{Deserialize, Serialize};' not in text:
              text = text.replace(
                  'use crate::id::{AuthFlowId, DialogId, ObjectiveId, RunId, SessionEntryId, SessionId, ToolCallId};\n',
                  'use crate::id::{AuthFlowId, DialogId, ObjectiveId, RunId, SessionEntryId, SessionId, ToolCallId};\nuse serde::{Deserialize, Serialize};\n',
                  1,
              )
          for name in (
              'BackendCapabilities',
              'PromptCapabilities',
              'SessionCapabilities',
              'AuthenticationCapabilities',
              'ModelCapabilities',
              'ResourceCapabilities',
              'ExtensionUiCapabilities',
          ):
              old = f'#[derive(Clone, Debug, Default, Eq, PartialEq)]\npub struct {name}'
              new = f'#[derive(Clone, Debug, Default, Eq, PartialEq, Serialize, Deserialize)]\npub struct {name}'
              if old not in text:
                  raise SystemExit(f'missing canonical derive target: {name}')
              text = text.replace(old, new, 1)
          protocol.write_text(text)

          runtime_lib = Path('rust/crates/phenix-runtime-api/src/lib.rs')
          text = runtime_lib.read_text()
          text = text.replace('mod serde_capabilities;\n', '', 1)
          runtime_lib.write_text(text)
          Path('rust/crates/phenix-runtime-api/src/serde_capabilities.rs').unlink()

          conductor = Path('rust/crates/phenix-conductor/src/lib.rs')
          text = conductor.read_text()
          old = '''        let mut control = self.backend_control(params)?;\n        let snapshot = control.snapshot()?;\n        Ok(map_capabilities(snapshot.capabilities))\n'''
          new = '''        let mut control = self.backend_control(params)?;\n        Ok(control.snapshot()?.capabilities)\n'''
          if old not in text:
              raise SystemExit('missing backend capability mapping call')
          text = text.replace(old, new, 1)
          text, count = re.subn(
              r'\nfn map_capabilities\(value: phenix_runtime_api::BackendCapabilities\) -> BackendCapabilities \{.*?\n\}\n\nfn map_model',
              '\nfn map_model',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('missing map_capabilities function')
          for name in (
              'AuthenticationCapabilities',
              'ExtensionUiCapabilities',
              'ModelCapabilities',
              'PromptCapabilities',
              'ResourceCapabilities',
              'SessionCapabilities',
          ):
              text, count = re.subn(rf'\b{name},\s*', '', text, count=1)
              if count != 1:
                  raise SystemExit(f'missing conductor import: {name}')
          conductor.write_text(text)
          PY
          cd rust
          cargo fmt --all
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/phenix-runtime-api rust/crates/phenix-conductor/src/lib.rs
          git diff --cached --check
          git commit -m 'refactor: remove capability translation layer'
          git push origin HEAD:refactor/canonical-backend-capabilities
