name: Remove legacy Phenix catalog command

on:
  push:
    branches: [feat/unified-phenix-ui]

permissions:
  contents: write

concurrency:
  group: remove-legacy-phenix-catalog
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: feat/unified-phenix-ui
          fetch-depth: 0
      - name: Remove redundant catalog alias
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          command = Path("modules/phenix-pi/extension/phenix-command.ts")
          text = command.read_text()
          legacy = '  { value: "catalog", label: "catalog — Open the Catalog UI view" },\n'
          if legacy not in text:
              raise SystemExit("legacy catalog completion entry not found")
          command.write_text(text.replace(legacy, "", 1))

          root = Path("modules/phenix-pi/extension/root-extension.ts")
          text = root.read_text()
          text = text.replace(
              'import { type AnyDefinition, definitionRef } from "../domain/definition/definition.ts";\n',
              "",
              1,
          )
          text = text.replace(
              'import { renderCatalogDefinition, renderTerminalMermaid } from "./mermaid-rendering.ts";\n',
              'import { renderTerminalMermaid } from "./mermaid-rendering.ts";\n',
              1,
          )
          start = text.find('      if (action === "catalog") {\n')
          end = text.find('      if (action === "logs") {\n', start)
          if start < 0 or end < 0:
              raise SystemExit("legacy catalog handler block not found")
          root.write_text(text[:start] + text[end:])

          test = Path("modules/phenix-pi/tests/phenix-command.test.ts")
          text = test.read_text()
          old = '/phenix ui|status|health|logs|facts|tasks|catalog|integrations'
          new = '/phenix ui|status|health|logs|facts|tasks|integrations'
          if old not in text:
              raise SystemExit("legacy usage assertion not found")
          test.write_text(text.replace(old, new, 1))
          PY

          if rg -n 'catalog — Open the Catalog UI view|action === "catalog"|renderCatalogDefinition' modules/phenix-pi/extension modules/phenix-pi/tests; then
            echo "legacy catalog command references remain" >&2
            exit 1
          fi

          rm .github/workflows/remove-legacy-phenix-catalog.yml
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Remove redundant Phenix catalog subcommand [skip ci]"
          git push origin HEAD:feat/unified-phenix-ui
