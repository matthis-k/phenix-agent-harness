name: PR 262 repair

on:
  push:
    branches:
      - feat/neovim-native-interaction
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Apply source repair
        run: python3 .github/repair-pr-262.py

      - name: Commit source repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust
          git commit -m 'fix: satisfy Neovim navigation CI checks'
          git push
