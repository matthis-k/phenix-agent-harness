name: Rich transcript locked validation

on:
  push:
    branches:
      - refactor/rich-transcript-blocks

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
      - name: Run clean reconstruction with committed lockfile
        shell: bash
        run: |
          python - <<'EOF'
          from pathlib import Path
          text = Path('.github/workflows/finish-rich-transcript.yml').read_text()
          start = text.index('        run: |\n') + len('        run: |\n')
          end = text.index('      - name: Upload validation evidence', start)
          lines = text[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          script = script.replace(
              '    rust/Cargo.toml \\\n',
              '    rust/Cargo.toml \\\n    rust/Cargo.lock \\\n',
              1,
          )
          script = script.replace('cargo generate-lockfile\n', '', 1)
          Path('/tmp/rebuild-rich.sh').write_text(script)
          EOF
          bash /tmp/rebuild-rich.sh
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rich-transcript-locked-validation
          path: |
            /tmp/cargo-check.log
            /tmp/cargo-clippy.log
            /tmp/cargo-test.log
            /tmp/git-status.txt
            /tmp/diff-stat.txt
            rust/Cargo.lock
            rust/crates/phenix-tui/src/rich_document.rs
            rust/crates/phenix-tui/src/transcript.rs
            rust/crates/phenix-ui-runtime/src/runtime.rs
          if-no-files-found: ignore
