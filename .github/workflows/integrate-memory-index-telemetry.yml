name: Integrate memory index and telemetry

on:
  push:
    branches: [feature/production-memory]

permissions:
  contents: write

concurrency:
  group: integrate-memory-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with: { fetch-depth: 0 }
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with: { name: devenv }
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Integrate typed index and telemetry
        env:
          PATCH_SCRIPT_B64: " bicsCiAgICA    nLAopCgpyZXBsYWNlX29uY2UoCiAgICBzZXJ2aWNlLAogICAgJyAgICB0aGlzLmxpc3RlbmVycy5jbGVhcigpO1xuICAgIHRoaXMucm9vdHMuY2xlYXIoKTtcbi nLAogICAgJyAgICB0aGlzLmxpc3RlbmVycy5jbGVhcigpO1xuICAgIHRoaXMucm9vdHMuY2xlYXIoKTtcbiAgICB0aGlzLnRlbGVtZXRyeUJ5Um9vdC5jbGVhcigpO1xuJywKKQoKcmVwbGFjZV9vbmNlKAogICAgc2VydmljZSwKICAgICcgICAgICAgIGV2aWRlbmNlQnlUb29sQ2FsbDogbmV3IE1hcChcbiAgICAgICAgICBwZXJzaXN0ZWQuZXZpZGVuY2UuZmxhdE1hcCgoaXRlbSkgPT5cbi  nLAogICAgJyAgICBjb25zdCByZXN1bHQgPSBhd2FpdCB0aGlzLnJlcG9zaXRvcnkubWFpbnRhaW4ocm9vdFJ1bklkLCB0aGlzLmNsb2NrLm5vdygpKTtcbiAgICB0aGlzLmluY3JlbWVudFRlbGVtZXRyeShyb290UnVuSWQsICJtYWludGVuYW5jZVJ1bnMiKTtcbi   nLAogICAgJyAgY29uc3QgdGVsZW1ldHJ5OiBBcnJheTx7XG4gICAgcmVhZG9ubHkgZm9sZGVkOiBib29sZWFuO1xuICAgIHJlYWRvbmx5IGFnZ3Jlc3NpdmU6IGJvb2xlYW47XG4gICAgcmVhZG9ubHkgZm9sZGVkVG9vbFJlc3VsdHM6IG51bWJlcjtcbiAgfT4gPSBbXTtcbiAgY29uc3QgbWVtb3J5ID0gbWVtb3J5U3R1Yih0ZWxlbWV0cnkpO1xuICBjb25zdCBtZXNzYWdlcyA9IFtcbi    "
        run: printf '%s' "$PATCH_SCRIPT_B64" | base64 --decode | python
      - name: Apply repository maintenance fixes
        run: devenv tasks run maintenance:fix
      - name: Preserve repository lock pins
        run: git checkout -- devenv.lock
      - name: Remove one-shot workflow
        run: rm .github/workflows/integrate-memory-index-telemetry.yml
      - name: Commit integration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "feat(memory): integrate indexed retrieval and telemetry"
          git push origin HEAD:feature/production-memory
