            readonly hasTranscriptSelection?: boolean;
            readonly handoff: (delegation: NativeInputDelegation) => "consume" | "forward";
          ''',
          )
          replace(
              "modules/phenix-pi/extension/workspace/native-input-handoff.ts",
              '''  const delegation = resolveNativeInputDelegation(options.data, options.keybindings);
          ''',
              '''  const delegation = resolveNativeInputDelegation(
            options.data,
            options.keybindings,
            options.hasTranscriptSelection,
          );
          ''',
          )

          replace(
              "modules/phenix-pi/extension/native-run-transcript.ts",
              '''  get chunks(): readonly NativeTranscriptChunk[] {
            return this.chunkValues;
          }

          addChunk(chunk: NativeTranscriptChunk, spacer = false): void {
          ''',
              '''  get chunks(): readonly NativeTranscriptChunk[] {
            return this.chunkValues;
          }

          setThinkingVisible(visible: boolean): void {
            for (const chunk of this.chunkValues) {
              if (chunk.kind !== "assistant") continue;
              if (chunk.component instanceof AssistantMessageComponent) {
                chunk.component.setHideThinkingBlock(!visible);
              }
            }
          }

          addChunk(chunk: NativeTranscriptChunk, spacer = false): void {
          ''',
          )
          replace(
              "modules/phenix-pi/extension/native-run-transcript.ts",
              '''  readonly component: Container & {
            readonly chunks?: readonly NativeTranscriptChunk[];
          };
          ''',
              '''  readonly component: Container & {
            readonly chunks?: readonly NativeTranscriptChunk[];
            setThinkingVisible?(visible: boolean): void;
          };
          ''',
          )

          replace(
              "modules/phenix-pi/extension/phenix-workspace.ts",
              '''  readonly subscribe: (listener: () => void) => () => void;
            readonly submit: (text: string) => Promise<void>;
          ''',
              '''  readonly subscribe: (listener: () => void) => () => void;
            readonly notify?: (message: string, level: "info" | "warning" | "error") => void;
            readonly submit: (text: string) => Promise<void>;
          ''',
          )
          replace(
              "modules/phenix-pi/extension/phenix-workspace.ts",
              '''  private readonly onAction: (action: PhenixWorkspaceAction) => void;
            private readonly editor: CustomEditor;
          ''',
              '''  private readonly onAction: (action: PhenixWorkspaceAction) => void;
            private readonly notify: NonNullable<PhenixWorkspaceOptions["notify"]>;
            private readonly editor: CustomEditor;
          ''',
          )
          replace(
              "modules/phenix-pi/extension/phenix-workspace.ts",
              '''  private frame: RenderFrame | undefined;
            private lastSidebarSection: WorkspaceSection = "runs";
          ''',
              '''  private frame: RenderFrame | undefined;
            private lastSidebarSection: WorkspaceSection = "runs";
            private thinkingStepsVisible = false;
          ''',
          )
          replace(
              "modules/phenix-pi/extension/phenix-workspace.ts",
              '''    this.submit = options.submit;
              this.onAction = options.onAction;
              this.sectionViews = new Map(
          ''',
              '''    this.submit = options.submit;
              this.onAction = options.onAction;
              this.notify = options.notify ?? (() => undefined);
              this.sectionViews = new Map(
          ''',
          )
          replace(
              "modules/phenix-pi/extension/phenix-workspace.ts",
              '''    this.tui.terminal.write(MOUSE_ENABLE);
            }

            setStreamingMessage(message: AssistantMessage | undefined): void {
          ''',
              '''    this.tui.terminal.write(MOUSE_ENABLE);
            }

            get hasTranscriptSelection(): boolean {
              return this.transcriptSelection.selection !== undefined;
            }

            setStreamingMessage(message: AssistantMessage | undefined): void {
          ''',
          )
          replace(
              "modules/phenix-pi/extension/phenix-workspace.ts",
              '''      case "copy-selection":
                void this.transcriptSelection.copy().catch(() => undefined);
                return;
              case "clear-or-exit":
          ''',
              '''      case "copy-selection":
                void this.copyTranscript();
                return;
              case "clear-selection":
                this.transcriptSelection.clear();
                this.requestRender();
                return;
              case "thinking-toggle":
                this.thinkingStepsVisible = !this.thinkingStepsVisible;
                this.notify(
                  `Thinking steps ${this.thinkingStepsVisible ? "shown" : "collapsed"}.`,
                  "info",
                );
                this.requestRender();
                return;
              case "clear-or-exit":
          ''',
          )
          replace(
              "modules/phenix-pi/extension/phenix-workspace.ts",
              '''  private async handleSubmit(raw: string): Promise<void> {
          ''',
              '''  private async copyTranscript(): Promise<void> {
            const selected = this.transcriptSelection.selectedText();
            try {
              const copied = await this.transcriptSelection.copy();
              if (!copied) {
                this.notify("Nothing to copy from the transcript.", "warning");
                return;
              }
              this.notify(selected ? "Copied transcript selection." : "Copied transcript.", "info");
            } catch (error) {
              this.notify(
                `Unable to copy transcript: ${error instanceof Error ? error.message : String(error)}`,
                "warning",
              );
            }
          }

          private async handleSubmit(raw: string): Promise<void> {
          ''',
          )
          replace(
              "modules/phenix-pi/extension/phenix-workspace.ts",
              '''    if (transcript) {
              body.push(...transcript.component.render(width).map((line) => sliceViewLine(line, 0, width)));
          ''',
              '''    if (transcript) {
              transcript.component.setThinkingVisible?.(this.thinkingStepsVisible);
              body.push(...transcript.component.render(width).map((line) => sliceViewLine(line, 0, width)));
          ''',
          )
          replace(
              "modules/phenix-pi/extension/phenix-workspace.ts",
              '''      const streaming = new AssistantMessageComponent(
                this.streamingMessage,
                true,
                getMarkdownTheme(),
          ''',
              '''      const streaming = new AssistantMessageComponent(
                this.streamingMessage,
                !this.thinkingStepsVisible,
                getMarkdownTheme(),
          ''',
          )

          replace(
              "modules/phenix-pi/extension/default-workspace-extension.ts",
              '''    return handoffNativeWorkspaceInput({
                data,
                keybindings: activeKeybindings,
                handoff: (delegation) => {
          ''',
              '''    return handoffNativeWorkspaceInput({
                data,
                keybindings: activeKeybindings,
                hasTranscriptSelection: activeWorkspace.hasTranscriptSelection,
                handoff: (delegation) => {
          ''',
          )
          replace(
              "modules/phenix-pi/extension/default-workspace-extension.ts",
              '''          subscribe: (listener) => subscribeWorkspaceChanges(binding.runtime, listener),
                submit: async (text) => {
          ''',
              '''          subscribe: (listener) => subscribeWorkspaceChanges(binding.runtime, listener),
                notify: (message, level) => ctx.ui.notify(message, level),
                submit: async (text) => {
          ''',
          )

          replace(
              "modules/phenix-pi/extension/workspace/workspace-composer.ts",
              '''const STATUS_GAP_ROWS = 2;
          ''',
              '''const STATUS_GAP_ROWS = 1;
          ''',
          )

          replace(
              "modules/phenix-pi/tests/workspace-interaction.test.ts",
              '''  "\\x0f": "app.tools.expand",
            "\\x1b": "app.interrupt",
          ''',
              '''  "\\x0f": "app.tools.expand",
            "\\x1b": "app.interrupt",
          ''',
          )
          replace(
              "modules/phenix-pi/tests/workspace-interaction.test.ts",
              '''test("native application shortcuts are not shadowed by workspace controls", () => {
            assert.deepEqual(resolveWorkspaceInput("\\x0f", "main"), { kind: "editor" });
            assert.deepEqual(resolveWorkspaceInput("\\x02", "main"), { kind: "editor" });
            assert.deepEqual(resolveNativeInputDelegation("\\x0f", KEYBINDINGS), {
              action: "app.tools.expand",
              reopenWorkspace: true,
            });
            assert.deepEqual(resolveNativeInputDelegation("\\x07", KEYBINDINGS), {
          ''',
              '''test("workspace owns Ctrl+O while other native shortcuts remain delegated", () => {
            assert.deepEqual(resolveWorkspaceInput("\\x0f", "main"), { kind: "thinking-toggle" });
            assert.deepEqual(resolveWorkspaceInput("\\x02", "main"), { kind: "editor" });
            assert.equal(resolveNativeInputDelegation("\\x0f", KEYBINDINGS), undefined);
            assert.deepEqual(resolveNativeInputDelegation("\\x07", KEYBINDINGS), {
          ''',
          )
          replace(
              "modules/phenix-pi/tests/workspace-interaction.test.ts",
              '''test("interrupt and message queue actions retain Pi semantics", () => {
            assert.deepEqual(resolveNativeInputDelegation("\\x1b", KEYBINDINGS), {
              action: "app.interrupt",
              reopenWorkspace: true,
            });
          ''',
              '''test("Escape clears transcript selection before retaining Pi interrupt semantics", () => {
            assert.equal(resolveNativeInputDelegation("\\x1b", KEYBINDINGS, true), undefined);
            assert.deepEqual(resolveWorkspaceInput("\\x1b", "main", true), {
              kind: "clear-selection",
            });
            assert.deepEqual(resolveWorkspaceInput("\\x1b", "sidebar", true), {
              kind: "clear-selection",
            });
            assert.deepEqual(resolveNativeInputDelegation("\\x1b", KEYBINDINGS), {
              action: "app.interrupt",
              reopenWorkspace: true,
            });
          ''',
          )
          replace(
              "modules/phenix-pi/tests/workspace-interaction.test.ts",
              '''test("Ctrl+C clears or exits and Ctrl+Shift+C copies the transcript", () => {
          ''',
              '''test("raw Ctrl+C stays clear-or-exit while modifier-preserving Ctrl+Shift+C copies", () => {
          ''',
          )

          replace(
              "modules/phenix-pi/tests/native-input-handoff.test.ts",
              '''const KEY_ACTIONS: Readonly<Record<string, AppKeybinding>> = {
            "\\x07": "app.editor.external",
            "\\x0c": "app.model.select",
          };
          ''',
              '''const KEY_ACTIONS: Readonly<Record<string, AppKeybinding>> = {
            "\\x07": "app.editor.external",
            "\\x0c": "app.model.select",
            "\\x0f": "app.tools.expand",
            "\\x1b": "app.interrupt",
          };
          ''',
          )
          replace(
              "modules/phenix-pi/tests/native-input-handoff.test.ts",
              '''test("leaves unrelated input in the focused workspace", () => {
          ''',
              '''test("keeps selected Escape and Ctrl+O in the focused workspace", () => {
            for (const [data, hasTranscriptSelection] of [
              ["\\x1b", true],
              ["\\x0f", false],
            ] as const) {
              let touched = false;
              const result = handoffNativeWorkspaceInput({
                data,
                keybindings: KEYBINDINGS,
                hasTranscriptSelection,
                handoff: () => {
                  touched = true;
                  return "forward";
                },
              });

              assert.equal(result, undefined);
              assert.equal(touched, false);
            }
          });

          test("leaves unrelated input in the focused workspace", () => {
          ''',
          )

          replace(
              "modules/phenix-pi/tests/workspace-composer.test.ts",
              '''test("grows on the first newline and keeps a larger gap above the status row", () => {
          ''',
              '''test("grows on the first newline and keeps one row on both sides of input", () => {
          ''',
          )
          replace(
              "modules/phenix-pi/tests/workspace-composer.test.ts",
              '''  assert.equal(singleLine.length, 4);
            assert.equal(twoLines.length, 5);
          ''',
              '''  assert.equal(singleLine.length, 3);
            assert.equal(twoLines.length, 4);
          ''',
          )
          replace(
              "modules/phenix-pi/tests/workspace-composer.test.ts",
              '''  assert.ok(twoLines.slice(-2).every(isBlankComposerRow));
          ''',
              '''  assert.ok(isBlankComposerRow(twoLines.at(-1) ?? ""));
          ''',
          )

          replace(
              "modules/phenix-pi/tests/native-run-transcript.test.ts",
              '''    const rendered = loaded.value.component.render(100).join("\\n");
              assert.match(rendered, /QA Report/);
              assert.match(rendered, /Repository checks passed/);
          ''',
              '''    const rendered = loaded.value.component.render(100).join("\\n");
              assert.match(rendered, /QA Report/);
              assert.match(rendered, /Repository checks passed/);
              assert.doesNotMatch(rendered, /Inspecting definitions before the tool call/);
              loaded.value.component.setThinkingVisible?.(true);
              assert.match(
                loaded.value.component.render(100).join("\\n"),
                /Inspecting definitions before the tool call/,
              );
          ''',
          )
          replace(
              "modules/phenix-pi/tests/native-run-transcript.test.ts",
              '''        content: [
                  { type: "text", text: "I will inspect the definitions." },
          ''',
              '''        content: [
                  {
                    type: "thinking",
                    thinking: "Inspecting definitions before the tool call",
                  },
                  { type: "text", text: "I will inspect the definitions." },
          ''',
          )
          PY
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Format repository changes
        run: devenv tasks run maintenance:fix:format
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules
          git commit -m "fix(workspace): refine selection and transcript controls"
          git push origin HEAD:fix/workspace-selection-thinking-spacing
