name: CI Repair

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    name: Apply repair
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: fix/ci-baseline-regressions

      - name: Apply repair and restore CI
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/repair.patch
          patch -p1 < /tmp/repair.patch
          printf '%s' '' | base64 -d | gzip -d > .github/workflows/ci.yml
          git diff --check
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u
          git commit -m 'fix: make CI maintenance checks clean'
          git push origin HEAD:fix/ci-baseline-regressions
