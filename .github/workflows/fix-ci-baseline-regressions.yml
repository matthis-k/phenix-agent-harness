name: Repair CI baseline regressions

on:
  push:
    branches:
      - fix/ci-baseline-regressions

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply baseline fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old!r}")
              target.write_text(text.replace(old, new))

          replace(
              "rust/crates/phenix-runtime-api/src/protocol.rs",
              """    ToolStarted {\n        run_id: RunId,\n        tool_call_id: ToolCallId,\n        tool_name: String,\n        input_summary: String,\n    },\n""",
              """    ToolStarted {\n        run_id: RunId,\n        tool_call_id: ToolCallId,\n        tool_name: String,\n        raw_input_json: String,\n        input_summary: String,\n    },\n""",
          )

          replace(
              "rust/crates/phenix-acp/src/runtime/model.rs",
              """    ToolStarted {\n        call_id: String,\n        name: String,\n        input_summary: String,\n    },\n""",
              """    ToolStarted {\n        call_id: String,\n        name: String,\n        raw_input_json: String,\n        input_summary: String,\n    },\n""",
          )

          replace(
              "rust/crates/phenix-acp-backend/src/projection.rs",
              """    let input = tool\n        .raw_input\n        .as_ref()\n        .map_or_else(|| \"{}\".to_owned(), serde_json::Value::to_string);\n""",
              """    let raw_input_json = tool\n        .raw_input\n        .as_ref()\n        .map_or_else(|| \"{}\".to_owned(), serde_json::Value::to_string);\n""",
          )
          replace(
              "rust/crates/phenix-acp-backend/src/projection.rs",
              """        tool_name: tool.title.clone(),\n        input_summary: bounded_summary(input),\n""",
              """        tool_name: tool.title.clone(),\n        raw_input_json: raw_input_json.clone(),\n        input_summary: bounded_summary(raw_input_json),\n""",
          )

          replace(
              "rust/crates/phenix-acp-backend/src/gateway/connection.rs",
              """                tool_name,\n                input_summary,\n            } => self.push(\n""",
              """                tool_name,\n                raw_input_json,\n                input_summary,\n            } => self.push(\n""",
          )
          replace(
              "rust/crates/phenix-acp-backend/src/gateway/connection.rs",
              """                    name: tool_name,\n                    input_summary,\n""",
              """                    name: tool_name,\n                    raw_input_json,\n                    input_summary,\n""",
          )

          replace(
              "rust/crates/phenix-acp-backend/src/frontend/projection.rs",
              """                call_id,\n                name,\n                input_summary,\n            } => vec![BackendEvent::ToolStarted {\n""",
              """                call_id,\n                name,\n                raw_input_json,\n                input_summary,\n            } => vec![BackendEvent::ToolStarted {\n""",
          )
          replace(
              "rust/crates/phenix-acp-backend/src/frontend/projection.rs",
              """                tool_name: name,\n                input_summary,\n""",
              """                tool_name: name,\n                raw_input_json,\n                input_summary,\n""",
          )

          replace(
              "rust/crates/phenix-conductor/src/main.rs",
              """        SessionEvent::ToolStarted {\n            call_id,\n            name,\n            input_summary,\n        } => {\n            let tool = ToolCall::new(call_id, name)\n                .status(ToolCallStatus::InProgress)\n                .raw_input(serde_json::json!({ \"summary\": input_summary }));\n""",
              """        SessionEvent::ToolStarted {\n            call_id,\n            name,\n            raw_input_json,\n            input_summary: _,\n        } => {\n            let raw_input = serde_json::from_str(&raw_input_json).map_err(|error| {\n                agent_client_protocol::util::internal_error(format!(\n                    \"invalid structured tool input from ACP backend: {error}\"\n                ))\n            })?;\n            let tool = ToolCall::new(call_id, name)\n                .status(ToolCallStatus::InProgress)\n                .raw_input(raw_input);\n""",
          )

          replace(
              "rust/crates/phenix-ui-core/src/reducer.rs",
              """            tool_name,\n            input_summary,\n        } => state\n""",
              """            tool_name,\n            input_summary,\n            ..\n        } => state\n""",
          )

          replace(
              "rust/crates/phenix-process-backend/src/wire.rs",
              """            tool_name: string_field(object, \"toolName\")?.to_owned(),\n            input_summary: string_field(object, \"inputSummary\")?.to_owned(),\n""",
              """            tool_name: string_field(object, \"toolName\")?.to_owned(),\n            raw_input_json: object\n                .get(\"rawInput\")\n                .or_else(|| object.get(\"input\"))\n                .map_or_else(\n                    || {\n                        json!({\n                            \"summary\": object\n                                .get(\"inputSummary\")\n                                .and_then(Value::as_str)\n                                .unwrap_or_default()\n                        })\n                        .to_string()\n                    },\n                    |value| value.to_string(),\n                ),\n            input_summary: string_field(object, \"inputSummary\")?.to_owned(),\n""",
          )

          replace(
              "rust/crates/phenix-conductor/src/bin/fixture-agent.rs",
              """    AgentCapabilities, ClientRequest, ContentBlock, ContentChunk, InitializeResponse,\n    NewSessionResponse, PromptResponse, SessionNotification, SessionUpdate, StopReason,\n    TextContent,\n};\nuse agent_client_protocol::{Agent, Stdio};\n""",
              """    AgentCapabilities, ClientRequest, ContentBlock, ContentChunk, InitializeResponse,\n    PromptResponse, SessionNotification, SessionUpdate, StopReason, TextContent,\n};\nuse agent_client_protocol::{Agent, Stdio};\nuse serde_json::{json, Value};\n""",
          )
          replace(
              "rust/crates/phenix-conductor/src/bin/fixture-agent.rs",
              """                    ClientRequest::NewSessionRequest(_) => {\n                        serde_json::to_value(NewSessionResponse::new(\"fixture-session\"))\n                            .map_err(agent_client_protocol::Error::into_internal_error)?\n                    }\n                    ClientRequest::PromptRequest(prompt) => {\n""",
              """                    ClientRequest::NewSessionRequest(_) => json!({\n                        \"sessionId\": \"fixture-session\",\n                        \"configOptions\": fixture_model_options(),\n                    }),\n                    ClientRequest::SetSessionConfigOptionRequest(_) => json!({\n                        \"configOptions\": fixture_model_options(),\n                    }),\n                    ClientRequest::PromptRequest(prompt) => {\n""",
          )
          replace(
              "rust/crates/phenix-conductor/src/bin/fixture-agent.rs",
              """    Ok(())\n}\n""",
              """    Ok(())\n}\n\nfn fixture_model_options() -> Value {\n    json!([{\n        \"id\": \"model\",\n        \"name\": \"Model\",\n        \"category\": \"model\",\n        \"type\": \"select\",\n        \"currentValue\": \"provider/model\",\n        \"options\": [{\n            \"value\": \"provider/model\",\n            \"name\": \"Fixture Model\",\n        }],\n    }])\n}\n""",
          )

          replace(
              "rust/crates/phenix-ui-core/tests/editor_modes.rs",
              "Some(3)",
              "Some(5)",
              expected=2,
          )
          PY

          rm .github/workflows/fix-ci-baseline-regressions.yml

      - name: Check diff
        run: git diff --check

      - name: Test repaired baselines
        working-directory: rust
        run: |
          cargo test -p phenix-conductor --test black_box_model_tool_loop --test stdio_roundtrip
          cargo test -p phenix-ui-core --test editor_modes
          cargo test --workspace --no-fail-fast

      - name: Publish repaired branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair conductor and editor CI baselines"
          git push origin HEAD:fix/ci-baseline-regressions
