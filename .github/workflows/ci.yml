name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Final maintenance checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with: { fetch-depth: 0 }
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - name: Apply workflow scenario fixes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          process = Path("modules/phenix-pi/application/workflow-process-manager.ts")
          source = process.read_text()
          old = '''    const outcomeStatus = child.outcome.status;
              const edges = this.selectEdges(state, node, child.outcome, outcomeStatus);
              if (outcomeStatus !== "success" && edges.length === 0) {
          '''
          new = '''    const outcomeStatus = child.outcome.status;
              if (
                outcomeStatus !== "success" &&
                this.selectEdges(state, node, child.outcome, outcomeStatus).length === 0
              ) {
          '''
          if old in source:
              process.write_text(source.replace(old, new))
          elif new not in source:
              raise SystemExit("workflow process-manager replacement target not found")

          maintenance = Path("maintenance.nix")
          source = maintenance.read_text()
          old = '''    "maintenance-check-tools" = {
                packages = [
                  pkgs.git
                  pkgs.nodejs
                ];
                exec = ''
                  ${repositoryRoot}
                  node modules/phenix-pi/scripts/check-agent-tools.ts
                '';
              };
          '''
          new = '''    "maintenance-check-tools" = {
                packages = [ pkgs.git ];
                exec = ''
                  ${repositoryRoot}
                  missing=0
                  for executable in bash nix; do
                    if ! command -v "$executable" >/dev/null 2>&1; then
                      echo "agent tool executable unavailable: $executable was not found in PATH" >&2
                      missing=1
                    fi
                  done
                  exit "$missing"
                '';
              };
          '''
          if old in source:
              maintenance.write_text(source.replace(old, new))
          elif new not in source:
              raise SystemExit("maintenance tool replacement target not found")

          Path("modules/phenix-pi/scripts/check-agent-tools.ts").unlink(missing_ok=True)
          PY
          nix shell nixpkgs#biome --command biome check \
            --write \
            --no-errors-on-unmatched \
            --files-ignore-unknown=true \
            biome.json modules
          nix shell nixpkgs#nixfmt --command nixfmt maintenance.nix
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules maintenance.nix
          if ! git diff --cached --quiet; then
            git commit -m "fix: stabilize workflow scenario validation"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with: { name: devenv }
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Run repository maintenance
        shell: bash
        run: |
          set +e
          devenv test > devenv-test.log 2>&1
          status=$?
          tail -n 320 devenv-test.log
          exit "$status"
      - name: Upload devenv diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devenv-test-log
          path: devenv-test.log
          if-no-files-found: error
