name: Implement TUI diagrams fast

on:
  push:
    branches: [feat/tui-workflow-diagrams]

permissions:
  contents: write

concurrency:
  group: implement-tui-diagrams-fast
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: feat/tui-workflow-diagrams

      - name: Apply implementation script
        shell: bash
        run: |
          set +e
          python <<'PY' > /tmp/implementation.log 2>&1
          from pathlib import Path
          import traceback

          try:
              workflow = Path('.github/workflows/implement-tui-diagrams.yml').read_text()
              start_marker = "          python <<'PY'\n"
              end_marker = "\n          PY\n"
              start = workflow.index(start_marker) + len(start_marker)
              end = workflow.index(end_marker, start)
              raw = workflow[start:end]
              script = "\n".join(line[10:] if line.startswith("          ") else line for line in raw.splitlines())
              compile(script, 'implement-tui-diagrams.py', 'exec')
              exec(compile(script, 'implement-tui-diagrams.py', 'exec'))
          except BaseException:
              traceback.print_exc()
              raise
          PY
          status=$?
          cp /tmp/implementation.log .github/implementation-error.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/implementation-error.txt modules/phenix-pi modules/pi-npm
          git commit -m "Capture TUI diagram implementation result [skip ci]" || true
          git push origin HEAD:feat/tui-workflow-diagrams
          exit "$status"
