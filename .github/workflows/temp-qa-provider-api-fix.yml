name: Temporary QA provider API fix

on:
  push:
    branches:
      - feat/auth-discovery-strategies
    paths:
      - .github/workflows/temp-qa-provider-api-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: feat/auth-discovery-strategies
      - name: Remove parallel provider policy API
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rust/crates/phenix-backend/src/lib.rs')
          source = path.read_text()
          needle = 'pub mod provider;\n\n'
          if needle not in source:
              raise SystemExit('public provider module export not found')
          path.write_text(source.replace(needle, '', 1))
          PY
          rm rust/crates/phenix-backend/src/provider.rs
          ! rg -n 'AuthenticationStrategy|AuthenticationManager|ProviderAuthentication|ModelDiscoveryStrategy|ModelDiscoveryService|ModelCatalogSource|AuthenticationMethodCapability' rust
          git diff --check
          cd rust
          cargo fmt --check
          cargo test -p phenix-backend
      - name: Commit single auth/discovery authority
        run: |
          set -euo pipefail
          rm .github/workflows/temp-qa-provider-api-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: keep auth discovery backend-owned until migration'
          git push origin HEAD:feat/auth-discovery-strategies
