name: Apply input selection fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-input-selection-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'fix/workspace-input-selection' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          ref: fix/workspace-input-selection
      - name: Apply input selection support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from textwrap import dedent

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text()
              if old not in source:
                  raise SystemExit(f"literal not found in {path}: {old!r}")
              target.write_text(source.replace(old, new, 1))

          def substitute(path: str, pattern: str, replacement: str) -> None:
              target = Path(path)
              source = target.read_text()
              value = dedent(replacement).strip("\n")
              updated, count = re.subn(pattern, value, source, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise SystemExit(f"pattern matched {count} times in {path}: {pattern}")
              target.write_text(updated)

          composer = "modules/phenix-pi/extension/workspace/workspace-composer.ts"
          replace(
              composer,
              "  readonly theme: ObservabilityTheme;\n}",
              "  readonly theme: ObservabilityTheme;\n  readonly decorateBodyLine?: (line: string, row: number, width: number) => string;\n}",
          )
          replace(
              composer,
              "  const body = editorBody(input.lines);",
              "  const body = editorBody(input.lines).map(\n    (line, row) => input.decorateBodyLine?.(line, row, innerWidth) ?? line,\n  );",
          )

          workspace = "modules/phenix-pi/extension/phenix-workspace.ts"
          replace(
              workspace,
              'import { renderWorkspaceComposer } from "./workspace/workspace-composer.ts";',
              'import {\n  editorBody,\n  renderWorkspaceComposer,\n} from "./workspace/workspace-composer.ts";',
          )
          replace(
              workspace,
              "  private readonly transcriptSelection = new TranscriptSelectionSurface();\n  private readonly transcriptView = new TerminalView();",
              "  private readonly transcriptSelection = new TranscriptSelectionSurface();\n  private readonly inputSelection = new TranscriptSelectionSurface();\n  private readonly transcriptView = new TerminalView();",
          )
          replace(
              workspace,
              "    this.controller = new WorkspaceControllerAdapter({",
              "    this.editor.onChange = () => {\n      if (!this.inputSelection.selectedText()) return;\n      this.inputSelection.clear();\n      this.requestRender();\n    };\n    this.controller = new WorkspaceControllerAdapter({",
          )
          substitute(
              workspace,
              r'  get hasTranscriptSelection\(\): boolean \{\s*return this\.transcriptSelection\.selection !== undefined;\s*\}',
              '''
              get hasTextSelection(): boolean {
                return (
                  this.inputSelection.selectedText() !== undefined ||
                  this.transcriptSelection.selectedText() !== undefined
                );
              }
              ''',
          )
          replace(
              workspace,
              "      this.transcriptSelection.selection !== undefined,",
              "      this.hasTextSelection,",
          )
          substitute(
              workspace,
              r'      case "clear-selection":\s*this\.transcriptSelection\.clear\(\);\s*this\.requestRender\(\);\s*return;',
              '''
                    case "clear-selection":
                      this.inputSelection.clear();
                      this.transcriptSelection.clear();
                      this.requestRender();
                      return;
              ''',
          )
          substitute(
              workspace,
              r'    const editorLines = this\.renderPaneSafely\(\s*"Editor",\s*dimensions\.mainWidth,\s*Math\.max\(1, height - 1\),\s*\(\) =>\s*renderWorkspaceComposer\(\{\s*lines: this\.editor\.render\(Math\.max\(1, dimensions\.mainWidth - 3\)\),\s*width: dimensions\.mainWidth,\s*active: focus === "main",\s*theme: this\.theme,\s*\}\),\s*false,\s*\);',
              '''
                  const rawEditorLines = this.editor.render(Math.max(1, dimensions.mainWidth - 3));
                  const inputLines = editorBody(rawEditorLines).map((line) =>
                    stripTranscriptAnsi(line).replaceAll(CURSOR_MARKER, ""),
                  );
                  const editorLines = this.renderPaneSafely(
                    "Editor",
                    dimensions.mainWidth,
                    Math.max(1, height - 1),
                    () =>
                      renderWorkspaceComposer({
                        lines: rawEditorLines,
                        width: dimensions.mainWidth,
                        active: focus === "main",
                        theme: this.theme,
                        decorateBodyLine: (line, row, lineWidth) =>
                          this.inputSelection.renderLine(line, row, lineWidth, this.theme),
                      }),
                    false,
                  );
              ''',
          )
          substitute(
              workspace,
              r'    this\.transcriptSelection\.setFrame\(\{\s*bounds: transcriptBounds,\s*offset: transcript\.offset,\s*lines: transcript\.plainLines,\s*\}\);',
              '''
                  this.transcriptSelection.setFrame({
                    bounds: transcriptBounds,
                    offset: transcript.offset,
                    lines: transcript.plainLines,
                  });
                  this.inputSelection.setFrame({
                    bounds: {
                      x: editorBounds.x + 2,
                      y: editorBounds.y,
                      width: Math.max(0, editorBounds.width - 3),
                      height: inputLines.length + 1,
                    },
                    offset: 0,
                    lines: inputLines,
                  });
              ''',
          )
          substitute(
              workspace,
              r'  private async copyTranscript\(\): Promise<void> \{.*?\n  \}\n\n  private async handleSubmit',
              '''
              private async copyTranscript(): Promise<void> {
                const inputSelected = this.inputSelection.selectedText();
                const transcriptSelected = this.transcriptSelection.selectedText();
                try {
                  const copied = inputSelected
                    ? await this.inputSelection.copy()
                    : await this.transcriptSelection.copy();
                  if (!copied) {
                    this.notify("Nothing to copy.", "warning");
                    return;
                  }
                  this.notify(
                    inputSelected
                      ? "Copied input selection."
                      : transcriptSelected
                        ? "Copied transcript selection."
                        : "Copied transcript.",
                    "info",
                  );
                } catch (error) {
                  this.notify(
                    `Unable to copy text: ${error instanceof Error ? error.message : String(error)}`,
                    "warning",
                  );
                }
              }

              private async handleSubmit
              ''',
          )
          substitute(
              workspace,
              r'  private selectTranscript\(node: RunTreeNode\): void \{\s*this\.transcriptSelection\.clear\(\);',
              '''
              private selectTranscript(node: RunTreeNode): void {
                this.inputSelection.clear();
                this.transcriptSelection.clear();
              ''',
          )
          substitute(
              workspace,
              r'(  private handleMouse\(event: MouseEvent\): void \{\s*if \(!this\.frame\) return;)',
              '''
              private handleMouse(event: MouseEvent): void {
                if (!this.frame) return;
                if (this.inputSelection.dragging) {
                  const changed = event.release
                    ? this.inputSelection.end(event)
                    : this.inputSelection.update(event);
                  if (changed) this.requestRender();
                  return;
                }
              ''',
          )
          substitute(
              workspace,
              r'    if \(event\.release\) return;\s*if \(event\.button === 0 && this\.transcriptSelection\.begin\(event\)\) \{\s*this\.focusMain\(\);\s*this\.requestRender\(\);\s*return;\s*\}',
              '''
                  if (event.release) return;
                  if (event.button === 0 && this.inputSelection.begin(event)) {
                    this.transcriptSelection.clear();
                    this.focusMain();
                    this.requestRender();
                    return;
                  }
                  if (event.button === 0 && this.transcriptSelection.begin(event)) {
                    this.inputSelection.clear();
                    this.focusMain();
                    this.requestRender();
                    return;
                  }
              ''',
          )
          replace(
              workspace,
              "    this.transcriptSelection.clear();\n    const section = this.frame.sections.find(",
              "    this.inputSelection.clear();\n    this.transcriptSelection.clear();\n    const section = this.frame.sections.find(",
          )

          extension = "modules/phenix-pi/extension/default-workspace-extension.ts"
          replace(
              extension,
              "      hasTranscriptSelection: activeWorkspace.hasTranscriptSelection,",
              "      hasTranscriptSelection: activeWorkspace.hasTextSelection,",
          )

          tests = "modules/phenix-pi/tests/workspace-composer.test.ts"
          replace(
              tests,
              'test("grows on the first newline and keeps one row on both sides of input", () => {',
              '''test("decorates input body rows without affecting composer spacing", () => {
                const decorated: number[] = [];
                const lines = renderWorkspaceComposer({
                  lines: ["────────", "first", "second", "────────"],
                  width: 40,
                  active: true,
                  theme: THEME,
                  decorateBodyLine: (line, row) => {
                    decorated.push(row);
                    return line;
                  },
                });
                assert.deepEqual(decorated, [0, 1]);
                assert.equal(lines.length, 4);
              });

              test("grows on the first newline and keeps one row on both sides of input", () => {''',
          )

          Path("modules/phenix-pi/tests/input-selection-boundary.test.ts").write_text(dedent('''
          import assert from "node:assert/strict";
          import test from "node:test";

          import type { ObservabilityTheme } from "../extension/observability-theme.ts";
          import { TranscriptSelectionSurface } from "../extension/workspace/transcript-selection-surface.ts";

          const THEME = {
            fg: (_tone: string, text: string) => text,
            bg: (_tone: string, text: string) => text,
            bold: (text: string) => text,
          } as unknown as ObservabilityTheme;

          test("input-sized selection frames support selection text and clearing", () => {
            const surface = new TranscriptSelectionSurface();
            surface.setFrame({
              bounds: { x: 2, y: 10, width: 20, height: 3 },
              offset: 0,
              lines: ["first line", "second line"],
            });

            assert.equal(surface.begin({ x: 3, y: 12 }), true);
            assert.equal(surface.update({ x: 9, y: 12 }), true);
            assert.equal(surface.end({ x: 9, y: 12 }), true);
            assert.equal(surface.selectedText(), "first ");
            assert.ok(surface.renderLine("first line", 0, 20, THEME));

            surface.clear();
            assert.equal(surface.selection, undefined);
            assert.equal(surface.selectedText(), undefined);
          });
          ''').lstrip())
          PY
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Format repository changes
        run: devenv tasks run maintenance:fix:format
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules
          git commit -m "fix(workspace): support input text selection"
          git push origin HEAD:fix/workspace-input-selection
