name: Grill 10 patch driver

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/grill-10-readonly-bash'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/^          python3 <<'PY'$/,/^          PY$/p" .github/workflows/grill-10-apply.yml \
            | sed '1d;$d;s/^          //' > /tmp/grill-10-apply.py
          python3 /tmp/grill-10-apply.py
          rm .github/workflows/grill-10-apply.yml
      - name: Commit implementation
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: sandbox read-only bash executions"
          git push origin "HEAD:$HEAD_REF"
