name: Agent remove dead execution helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Remove obsolete helper
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rust/crates/phenix-conductor/src/server.rs')
          content = path.read_text()
          old = '''    fn fail_execution(
              &self,
              execution_id: &ExecutionId,
              error: ProtocolError,
          ) -> Result<(), ServerError> {
              let mut runtime = self.lock_runtime()?;
              fail_runtime_execution(&mut runtime, execution_id, error)?;
              Ok(())
          }

          '''
          if content.count(old) != 1:
              raise SystemExit(f'expected one obsolete fail_execution method, found {content.count(old)}')
          path.write_text(content.replace(old, '', 1))
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check
      - name: Commit product change
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/phenix-conductor/src/server.rs
          git commit -m 'refactor: remove obsolete execution failure helper'
          git pull --rebase origin "${GITHUB_HEAD_REF}"
          git push origin HEAD:"${GITHUB_HEAD_REF}"
