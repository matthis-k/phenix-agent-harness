name: Repair CI baseline regressions v4

on:
  push:
    branches:
      - fix/ci-baseline-regressions

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply repaired baseline patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/fix-ci-baseline-regressions-v3.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'baseline-repair-v3', 'exec'))

          path = Path('rust/crates/phenix-ui-core/src/reducer.rs')
          text = path.read_text()
          old = (
              '                tool_name: "read".to_owned(),\n'
              '                input_summary: "file.rs".to_owned(),\n'
          )
          new = (
              '                tool_name: "read".to_owned(),\n'
              '                raw_input_json: r#"{\"path\":\"file.rs\"}"#.to_owned(),\n'
              '                input_summary: "file.rs".to_owned(),\n'
          )
          if text.count(old) != 1:
              raise SystemExit('tool lifecycle test fixture shape changed unexpectedly')
          path.write_text(text.replace(old, new))
          PY

          rm .github/workflows/fix-ci-baseline-regressions.yml
          rm .github/workflows/fix-ci-baseline-regressions-v2.yml
          rm .github/workflows/fix-ci-baseline-regressions-v3.yml
          rm .github/workflows/fix-ci-baseline-regressions-v4.yml

      - name: Check diff
        run: git diff --check

      - name: Test repaired baselines
        working-directory: rust
        run: |
          cargo test -p phenix-conductor --test black_box_model_tool_loop --test stdio_roundtrip
          cargo test -p phenix-ui-core --test editor_modes
          cargo test --workspace --no-fail-fast

      - name: Publish repaired branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          source_paths=(
            rust/crates/phenix-runtime-api/src/protocol.rs
            rust/crates/phenix-acp/src/runtime/model.rs
            rust/crates/phenix-acp-backend/src/projection.rs
            rust/crates/phenix-acp-backend/src/gateway/connection.rs
            rust/crates/phenix-acp-backend/src/frontend/projection.rs
            rust/crates/phenix-conductor/src/main.rs
            rust/crates/phenix-ui-core/src/reducer.rs
            rust/crates/phenix-process-backend/src/wire.rs
            rust/crates/phenix-conductor/src/bin/fixture-agent.rs
            rust/crates/phenix-ui-core/tests/editor_modes.rs
            rust/crates/phenix-conductor/tests/black_box_model_tool_loop.rs
            rust/crates/phenix-conductor/tests/stdio_roundtrip.rs
          )
          workflow_paths=(
            .github/workflows/fix-ci-baseline-regressions.yml
            .github/workflows/fix-ci-baseline-regressions-v2.yml
            .github/workflows/fix-ci-baseline-regressions-v3.yml
            .github/workflows/fix-ci-baseline-regressions-v4.yml
          )

          git add -- "${source_paths[@]}"
          git add -u -- "${workflow_paths[@]}"

          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' "${source_paths[@]}" "${workflow_paths[@]}" | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "unexpected staged paths"
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi

          git commit -m "fix: repair conductor and editor CI baselines"
          git push origin HEAD:fix/ci-baseline-regressions
