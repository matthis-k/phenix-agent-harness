name: Temporary register conductor auth

on:
  push:
    branches:
      - feat/phenix-acp-config-directory
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-register-conductor-auth
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: feat/phenix-acp-config-directory
      - name: Register auth module and remove migration
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin feat/phenix-acp-config-directory
          python - <<'PY'
          from pathlib import Path
          path = Path('rust/crates/phenix-conductor/src/lib.rs')
          text = path.read_text()
          marker = '#![forbid(unsafe_code)]\n\n'
          if 'mod auth;\n' not in text:
              if marker not in text:
                  raise SystemExit('conductor lib marker missing')
              text = text.replace(marker, marker + 'mod auth;\n\n', 1)
              path.write_text(text)
          PY
          git rm .github/workflows/temporary-register-conductor-auth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/crates/phenix-conductor/src/lib.rs
          git -c core.hooksPath=/dev/null commit -m "build: register conductor auth module"
          git push
