name: Patch turn indicator into workspace

on:
  push:
    branches: [ui/turn-steering-interrupt]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ui/turn-steering-interrupt
          fetch-depth: 0
      - name: Patch workspace turn rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workspace = Path("modules/phenix-pi/extension/phenix-workspace.ts")
          text = workspace.read_text()

          replacements = [
              (
                  'import { transcriptAvailabilityMessage } from "./transcript-availability.ts";\n',
                  'import { transcriptAvailabilityMessage } from "./transcript-availability.ts";\nimport { renderWorkspaceTurn } from "./workspace/turn-indicator.ts";\n',
              ),
              (
                  '  private streamingMessage: AssistantMessage | undefined;\n  private disposed = false;\n',
                  '  private streamingMessage: AssistantMessage | undefined;\n  private rootTurnActive = false;\n  private disposed = false;\n',
              ),
              (
                  '  setStreamingMessage(message: AssistantMessage | undefined): void {\n    this.streamingMessage = message;\n    this.requestRender();\n  }\n\n',
                  '  setStreamingMessage(message: AssistantMessage | undefined): void {\n    this.streamingMessage = message;\n    this.requestRender();\n  }\n\n  setRootTurnActive(active: boolean): void {\n    if (this.rootTurnActive === active) return;\n    this.rootTurnActive = active;\n    this.requestRender();\n  }\n\n',
              ),
              (
                  '    const active = countActive(snapshot.ui.tree.root);\n    const activity =\n      active > 0\n        ? `${state(this.theme, "running", "● RUNNING")} ${color(\n            this.theme,\n            "dim",\n            `· ${active} active`,\n          )}`\n        : state(this.theme, "completed", "✓ IDLE");\n',
                  '    const active = countActive(snapshot.ui.tree.root);\n',
              ),
              (
                  '    const header = [\n      ` ${heading(this.theme, "PHENIX")}`,\n      ` ${activity} ${color(this.theme, "dim", "·")} ${color(this.theme, healthTone, health)}`,\n    ].map((line) => surface(this.theme, "customMessageBg", fitViewLine(line, width)));\n',
                  '    const header = [\n      ` ${heading(this.theme, "PHENIX")} ${color(this.theme, "dim", "·")} ${color(\n        this.theme,\n        healthTone,\n        health,\n      )}`,\n      ` ${renderWorkspaceTurn(this.theme, {\n        rootActive: this.rootTurnActive,\n        activeDescendants: active,\n      })}`,\n    ].map((line) => surface(this.theme, "customMessageBg", fitViewLine(line, width)));\n',
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one workspace match: {old[:80]!r}")
              text = text.replace(old, new)
          workspace.write_text(text)

          extension = Path("modules/phenix-pi/extension/default-workspace-extension.ts")
          text = extension.read_text()
          replacements = [
              (
                  '  pi.on("agent_start", () => {\n    rootTurnActive = true;\n    refreshTurn();\n  });\n',
                  '  pi.on("agent_start", () => {\n    rootTurnActive = true;\n    workspace?.setRootTurnActive(true);\n    refreshTurn();\n  });\n',
              ),
              (
                  '  pi.on("agent_end", () => {\n    rootTurnActive = false;\n    refreshTurn();\n  });\n',
                  '  pi.on("agent_end", () => {\n    rootTurnActive = false;\n    workspace?.setRootTurnActive(false);\n    refreshTurn();\n  });\n',
              ),
              (
                  '            onSubmitStarted: () => {\n              rootTurnActive = true;\n              refreshTurn();\n            },\n            onSubmitFailed: () => {\n              rootTurnActive = false;\n              refreshTurn();\n            },\n',
                  '            onSubmitStarted: () => {\n              rootTurnActive = true;\n              workspace?.setRootTurnActive(true);\n              refreshTurn();\n            },\n            onSubmitFailed: () => {\n              rootTurnActive = false;\n              workspace?.setRootTurnActive(false);\n              refreshTurn();\n            },\n',
              ),
              (
                  '        activeWorkspace = instance;\n        activeKeybindings = keybindings;\n',
                  '        instance.setRootTurnActive(rootTurnActive);\n        activeWorkspace = instance;\n        activeKeybindings = keybindings;\n',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one extension match: {old[:80]!r}")
              text = text.replace(old, new)
          extension.write_text(text)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-turn-sidebar-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Show turn ownership inside the workspace"
          git push origin HEAD:ui/turn-steering-interrupt
