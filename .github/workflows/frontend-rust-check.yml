name: Frontend Rust check

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/frontend-rust-check.yml
      - rust/**

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@4305c38b25d97ef35a8ad1f985ccf2d2242004f2
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Complete event envelope migration
        run: |
          python - <<'PY'
          from pathlib import Path

          needle = "AppEvent::Backend("

          def wrap_backend_output_calls(content: str) -> str:
              cursor = 0
              while True:
                  start = content.find(needle, cursor)
                  if start < 0:
                      return content
                  argument_start = start + len(needle)
                  if content.startswith("Box::new(", argument_start):
                      cursor = argument_start
                      continue
                  if not content.startswith("BackendOutput::", argument_start):
                      cursor = argument_start
                      continue

                  depth = 1
                  index = argument_start
                  in_string = False
                  escaped = False
                  while index < len(content):
                      character = content[index]
                      if in_string:
                          if escaped:
                              escaped = False
                          elif character == "\\":
                              escaped = True
                          elif character == '"':
                              in_string = False
                      else:
                          if character == '"':
                              in_string = True
                          elif character == "(":
                              depth += 1
                          elif character == ")":
                              depth -= 1
                              if depth == 0:
                                  break
                      index += 1
                  if depth != 0:
                      raise SystemExit("unbalanced AppEvent::Backend call")

                  argument = content[argument_start:index]
                  replacement = f"{needle}Box::new({argument}))"
                  content = content[:start] + replacement + content[index + 1:]
                  cursor = start + len(replacement)

          for path in Path("rust/crates").rglob("*.rs"):
              original = path.read_text()
              migrated = wrap_backend_output_calls(original)
              if migrated != original:
                  path.write_text(migrated)
          PY
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Commit generated Rust files
        run: |
          if ! git diff --quiet -- rust; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add rust
            git commit -m "finish backend event envelope migration"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - name: Check
        run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked
