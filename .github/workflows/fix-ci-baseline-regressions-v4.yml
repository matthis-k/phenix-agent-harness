name: Repair CI baseline regressions v4

on:
  push:
    branches:
      - fix/ci-baseline-regressions

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply repaired baseline patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/fix-ci-baseline-regressions-v3.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'baseline-repair-v3', 'exec'))

          path = Path('rust/crates/phenix-ui-core/src/reducer.rs')
          text = path.read_text()
          old = (
              '                tool_name: "read".to_owned(),\n'
              '                input_summary: "file.rs".to_owned(),\n'
          )
          new = (
              '                tool_name: "read".to_owned(),\n'
              '                raw_input_json: r#"{\"path\":\"file.rs\"}"#.to_owned(),\n'
              '                input_summary: "file.rs".to_owned(),\n'
          )
          if text.count(old) != 1:
              raise SystemExit('tool lifecycle test fixture shape changed unexpectedly')
          path.write_text(text.replace(old, new))
          PY

          rm .github/workflows/fix-ci-baseline-regressions.yml
          rm .github/workflows/fix-ci-baseline-regressions-v2.yml
          rm .github/workflows/fix-ci-baseline-regressions-v3.yml
          rm .github/workflows/fix-ci-baseline-regressions-v4.yml

      - name: Check diff
        run: git diff --check

      - name: Test repaired baselines
        working-directory: rust
        run: |
          cargo test -p phenix-conductor --test black_box_model_tool_loop --test stdio_roundtrip
          cargo test -p phenix-ui-core --test editor_modes
          cargo test --workspace --no-fail-fast

      - name: Publish repaired branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair conductor and editor CI baselines"
          git push origin HEAD:fix/ci-baseline-regressions
