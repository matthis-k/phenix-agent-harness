name: Harden memory feature branch

on:
  push:
    branches: [feature/phenix-memory]

permissions:
  contents: write

concurrency:
  group: harden-memory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with: { fetch-depth: 0 }
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with: { name: devenv }
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Scope tool-call evidence by run
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("modules/phenix-pi/application/memory-service.ts")
          text = path.read_text()
          replacements = {
              "state.evidenceByToolCall.get(input.toolCallId)": "state.evidenceByToolCall.get(toolCallKey(input.runId, input.toolCallId))",
              "state.evidenceByToolCall.set(input.toolCallId, evidence.id)": "state.evidenceByToolCall.set(toolCallKey(input.runId, input.toolCallId), evidence.id)",
              "state.evidenceByToolCall.get(toolCallId)": "state.evidenceByToolCall.get(toolCallKey(runId, toolCallId))",
              "[[item.source.toolCallId, item.id] as const]": "[[toolCallKey(item.runId, item.source.toolCallId), item.id] as const]",
          }
          for before, after in replacements.items():
              if before not in text:
                  raise SystemExit(f"expected source fragment not found: {before}")
              text = text.replace(before, after)

          marker = "function classifyToolResult(input: CaptureToolResultInput): {"
          helper = "function toolCallKey(runId: RunId, toolCallId: string): string {\n  return `${runId}:${toolCallId}`;\n}\n\n"
          if marker not in text:
              raise SystemExit("tool-result classifier marker not found")
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text)
          PY
      - name: Apply repository maintenance fixes
        run: devenv tasks run maintenance:fix
      - name: Preserve repository lock pins
        run: git checkout -- devenv.lock
      - name: Commit hardening
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "fix(memory): scope tool-call evidence by run [skip ci]"
          git push origin HEAD:feature/phenix-memory
