name: Test initializer cleanup

on:
  push:
    branches:
      - refactor/rich-transcript-blocks

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: refactor/rich-transcript-blocks
      - name: Clean test initializers
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e 's/let mut state = AppState::default\(\);\n        state\.exit_requested = true;/let state = AppState {\n            exit_requested: true,\n            ..AppState::default()\n        };/g' rust/crates/phenix-ui-runtime/src/consumers.rs
          perl -0pi -e 's/let mut state = AppState::default\(\);\n        state\.root_run = Some\(run_id\.clone\(\)\);/let mut state = AppState {\n            root_run: Some(run_id.clone()),\n            ..AppState::default()\n        };/g' rust/crates/phenix-ui-runtime/src/runtime.rs
          perl -0pi -e 's/let mut state = AppState::default\(\);\n        state\.root_run = Some\(run_id\.clone\(\)\);\n        state\.selected_run = Some\(run_id\.clone\(\)\);/let mut state = AppState {\n            root_run: Some(run_id.clone()),\n            selected_run: Some(run_id.clone()),\n            ..AppState::default()\n        };/g' rust/crates/phenix-ui-runtime/src/runtime.rs
          cd rust
          cargo fmt --all
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- rust; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust
          git commit -m "test(ui): initialize state explicitly"
          git push origin HEAD:refactor/rich-transcript-blocks
