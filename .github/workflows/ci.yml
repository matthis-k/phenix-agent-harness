name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-session-ui:
    name: Apply Phenix sidebar and transcript UI
    if: github.event_name == 'pull_request' && github.head_ref == 'refine/flat-phenix-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: refine/flat-phenix-ui
          fetch-depth: 0
      - name: Apply staged source transformation
        id: apply
        continue-on-error: true
        shell: bash
        run: python .github/apply-phenix-session-ui.py > apply-session-ui.log 2>&1
      - name: Upload source transformation diagnostics
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apply-session-ui-log
          path: apply-session-ui.log
          if-no-files-found: error
      - name: Stop after source transformation failure
        if: steps.apply.outcome == 'failure'
        shell: bash
        run: |
          cat apply-session-ui.log
          exit 1
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with: { name: devenv }
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Format changes
        run: devenv shell maintenance-fix-format
      - name: Discard unrelated formatter changes
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(modules/pi-packages\.nix|modules/patches/pi-extension-sidebar\.patch|modules/phenix-pi/extension/(phenix-sidebar|run-transcript|run-monitor|root-extension|phenix-ui)\.ts|modules/phenix-pi/tests/(phenix-ui|run-monitor)\.test\.ts|\.github/(apply-phenix-session-ui\.py|workflows/ci\.yml))$'
          while IFS= read -r file; do
            if [[ ! "$file" =~ $allowed ]]; then
              git restore -- "$file"
            fi
          done < <(git diff --name-only)
      - name: Run repository maintenance
        shell: bash
        run: |
          set +e
          devenv test > devenv-test.log 2>&1
          status=$?
          tail -n 360 devenv-test.log
          exit "$status"
      - name: Restore canonical workflow and commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            pull_request:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: ci-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            checks:
              name: Final maintenance checks
              runs-on: ubuntu-latest
              timeout-minutes: 90
              steps:
                - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
                  with: { fetch-depth: 0 }
                - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
                  with:
                    github_access_token: ${{ secrets.GITHUB_TOKEN }}
                    extra_nix_config: |
                      experimental-features = nix-command flakes
                      accept-flake-config = true
                      max-jobs = auto
                - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
                  with: { name: devenv }
                - name: Install devenv
                  run: nix profile add nixpkgs#devenv
                - name: Run repository maintenance
                  shell: bash
                  run: |
                    set +e
                    devenv test > devenv-test.log 2>&1
                    status=$?
                    tail -n 320 devenv-test.log
                    exit "$status"
                - name: Upload devenv diagnostics
                  if: failure()
                  uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
                  with:
                    name: devenv-test-log
                    path: devenv-test.log
                    if-no-files-found: error
          YAML
          sed -i 's/^          //' .github/workflows/ci.yml
          rm .github/apply-phenix-session-ui.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add persistent Phenix sidebar and session transcript viewer'
          git push origin HEAD:refine/flat-phenix-ui
