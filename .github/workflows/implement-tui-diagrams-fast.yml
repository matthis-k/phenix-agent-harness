name: Implement TUI diagrams fast

on:
  push:
    branches: [feat/tui-workflow-diagrams]

permissions:
  contents: write

concurrency:
  group: implement-tui-diagrams-fast
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: feat/tui-workflow-diagrams

      - name: Apply integration
        run: python .github/scripts/integrate_tui_diagrams.py

      - name: Update locked runtime dependencies
        run: |
          npm install \
            --prefix modules/pi-npm \
            --package-lock-only \
            --ignore-scripts \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/phenix-pi modules/pi-npm
          git diff --cached --stat
          git commit -m "Integrate Mermaid rendering into catalog and status [skip ci]"
          git push origin HEAD:feat/tui-workflow-diagrams
