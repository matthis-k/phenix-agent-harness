name: context-error-fix-pr

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/context-and-skills' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/context-and-skills
          fetch-depth: 0
      - run: python3 .github/context-error-fix.py
      - run: cargo fmt --manifest-path rust/Cargo.toml --all
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/phenix-conductor/src/server.rs
          git commit -m 'fix: map context failures to invalid requests'
          git push origin HEAD:agent/context-and-skills
