name: Clean and diagnose embedded auth terminal

on:
  push:
    branches:
      - fix/acp-auth-transcript-errors
    paths:
      - .github/workflows/cleanup-and-verify-auth-terminal.yml

permissions:
  contents: write

jobs:
  cleanup-and-diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: fix/acp-auth-transcript-errors
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Remove generated files and capture compiler diagnostics
        shell: bash
        run: |
          set -euo pipefail

          git rm -r --ignore-unmatch rust/target
          rm -rf rust/target

          python3 - <<'PY'
          from pathlib import Path
          path = Path('.gitignore')
          source = path.read_text()
          rule = '/rust/target/'
          if rule not in source.splitlines():
              if '/target/\n' in source:
                  source = source.replace('/target/\n', '/target/\n/rust/target/\n', 1)
              else:
                  source += '\n/rust/target/\n'
              path.write_text(source)
          PY

          export CARGO_TARGET_DIR=/tmp/phenix-target
          set +e
          cargo fmt --manifest-path rust/Cargo.toml --all
          fmt_status=$?
          cargo check \
            --manifest-path rust/Cargo.toml \
            --workspace \
            --all-targets \
            --locked \
            --message-format=short \
            > /tmp/auth-terminal-check.log 2>&1
          check_status=$?
          set -e

          {
            echo "fmt_status=${fmt_status}"
            echo "check_status=${check_status}"
            grep -E '(^|: )(error(\[[A-Z0-9]+\])?:|warning:)' /tmp/auth-terminal-check.log | tail -n 240 || true
          } > .github/diagnostics-auth-terminal.txt

          rm .github/workflows/cleanup-and-verify-auth-terminal.yml
          git add .gitignore .github/diagnostics-auth-terminal.txt
          git add -u rust/target .github/workflows/cleanup-and-verify-auth-terminal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(auth): remove build output and capture diagnostics"
          git push origin HEAD:fix/acp-auth-transcript-errors

          echo "fmt=${fmt_status} check=${check_status}"
