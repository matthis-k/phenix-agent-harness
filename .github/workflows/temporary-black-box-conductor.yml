name: Temporary black-box conductor validation

on:
  push:
    branches:
      - feat/phenix-acp-config-directory
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-black-box-conductor-validation
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: feat/phenix-acp-config-directory
      - name: Apply adapter fixes and run black-box tests
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin feat/phenix-acp-config-directory
          python - <<'PY'
          from pathlib import Path

          lib = Path('rust/crates/phenix-conductor/src/lib.rs')
          text = lib.read_text()
          old = '''        for backend in self.backends {
              let config = AcpBackendConfig::new(backend.command, cwd.to_path_buf())?;
              let transport = AcpAgentBackend::gateway_transport(config, channel_capacity)?;
              builder = builder.backend(backend.id.clone(), transport.clone())?;
              transports.insert(backend.id, transport);
          }
          '''
          new = '''        for backend in self.backends {
              let command = parse_command(&backend.command)?;
              let launch = serde_json::json!({
                  "command": command.program,
                  "args": command.arguments,
                  "env": backend.environment,
              })
              .to_string();
              let config = AcpBackendConfig::new(launch, cwd.to_path_buf())?;
              let transport = AcpAgentBackend::gateway_transport(config, channel_capacity)?;
              builder = builder.backend(backend.id.clone(), transport.clone())?;
              transports.insert(backend.id, transport);
          }
          '''
          if old in text:
              lib.write_text(text.replace(old, new, 1))
          elif '"env": backend.environment' not in text:
              raise SystemExit('conductor backend launch block not found')

          main = Path('rust/crates/phenix-conductor/src/main.rs')
          text = main.read_text()
          old = '''            let tool = ToolCall::new(call_id, name)
                  .status(ToolCallStatus::InProgress)
                  .raw_input(serde_json::json!({ "summary": input_summary }));
          '''
          new = '''            let raw_input = serde_json::from_str(&input_summary)
                  .unwrap_or_else(|_| serde_json::json!({ "summary": input_summary }));
              let tool = ToolCall::new(call_id, name)
                  .status(ToolCallStatus::InProgress)
                  .raw_input(raw_input);
          '''
          if old in text:
              main.write_text(text.replace(old, new, 1))
          elif 'serde_json::from_str(&input_summary)' not in text:
              raise SystemExit('conductor tool projection block not found')

          test = Path('rust/crates/phenix-conductor/tests/black_box_model_tool_loop.rs')
          text = test.read_text()
          old = '''    process.send_request(
              8,
              "_phenix/node/execute",
              &json!({
                  "tree_id": tree_id,
                  "node_id": specialist_node,
                  "command": {
                      "kind": "prompt",
                      "text": tool_input["prompt"],
                      "images": [],
                  }
              }),
          )?;
          let specialist_result = process.receive_response(8)?;
          assert!(
              specialist_result.to_string().contains("42"),
              "specialist response did not traverse the conductor: {specialist_result}"
          );

          process.send_request(
              9,
          '''
          new = '''    process.send_request(
              8,
              "_phenix/node/subscribe",
              &json!({
                  "tree_id": tree_id,
                  "node_id": specialist_node,
              }),
          )?;
          process.receive_response(8)?;

          process.send_request(
              9,
              "_phenix/node/execute",
              &json!({
                  "tree_id": tree_id,
                  "node_id": specialist_node,
                  "command": {
                      "kind": "prompt",
                      "text": tool_input["prompt"],
                      "images": [],
                  }
              }),
          )?;
          let mut saw_specialist_result = False
          while True:
              pass

          process.send_request(
              10,
          '''
          # The Rust replacement is assembled separately to avoid accidental Python formatting.
          rust_new = '''    process.send_request(
              8,
              "_phenix/node/subscribe",
              &json!({
                  "tree_id": tree_id,
                  "node_id": specialist_node,
              }),
          )?;
          process.receive_response(8)?;

          process.send_request(
              9,
              "_phenix/node/execute",
              &json!({
                  "tree_id": tree_id,
                  "node_id": specialist_node,
                  "command": {
                      "kind": "prompt",
                      "text": tool_input["prompt"],
                      "images": [],
                  }
              }),
          )?;
          let mut saw_specialist_result = false;
          loop {
              let message = process.receive()?;
              if message.get("method").and_then(Value::as_str) == Some("_phenix/node/event")
                  && message.to_string().contains("42")
              {
                  saw_specialist_result = true;
              }
              if message.get("id") == Some(&Value::from(9)) {
                  break;
              }
          }
          assert!(
              saw_specialist_result,
              "specialist response did not traverse the subscribed conductor node"
          );

          process.send_request(
              10,
          '''
          if old in text:
              text = text.replace(old, rust_new, 1)
              text = text.replace('let final_messages = receive_prompt(&process, 9)?;', 'let final_messages = receive_prompt(&process, 10)?;', 1)
              text = text.replace('        10,\n        "_phenix/session_tree/get",', '        11,\n        "_phenix/session_tree/get",', 1)
              text = text.replace('let completed_tree = process.receive_response(10)?;', 'let completed_tree = process.receive_response(11)?;', 1)
              test.write_text(text)
          elif 'saw_specialist_result' not in text:
              raise SystemExit('black-box delegated execution block not found')
          PY
          rustup component add rustfmt
          cd rust
          cargo fmt --all
          cargo test --package phenix-conductor --all-targets
          cd ..
          git rm .github/workflows/temporary-black-box-conductor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust
          git -c core.hooksPath=/dev/null commit -m "test: validate routed model tool loop end to end"
          git push
