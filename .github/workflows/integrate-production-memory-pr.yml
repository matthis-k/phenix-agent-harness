name: Integrate production memory PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: integrate-production-memory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'feature/production-memory' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: feature/production-memory
          fetch-depth: 0
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Apply reviewed CI repair
        run: |
          python .github/scripts/repair_memory_ci.py
          python - <<'PY'
          from pathlib import Path
          path = Path('modules/phenix-pi/tests/memory-service.test.ts')
          text = path.read_text()
          text = text.replace(
              '  readonly noteBatches: readonly MemoryNote[][] = [];',
              '  readonly noteBatches: MemoryNote[][] = [];',
              1,
          )
          text = text.replace(
              '    (this.noteBatches as MemoryNote[][]).push([...notes]);',
              '    this.noteBatches.push([...notes]);',
              1,
          )
          path.write_text(text)
          PY
      - name: Apply repository maintenance fixes
        run: devenv tasks run maintenance:fix
      - name: Preserve repository lock pins
        run: git checkout -- devenv.lock
      - name: Remove one-shot integration files
        run: |
          rm -f .github/workflows/integrate-production-memory.yml
          rm -f .github/workflows/integrate-production-memory-v2.yml
          rm -f .github/workflows/integrate-production-memory-v3.yml
          rm -f .github/workflows/integrate-production-memory-pr.yml
          rm -f .github/workflows/repair-memory-ci.yml
          rm -f .github/scripts/add_memory_snapshot_telemetry.py
          rm -f .github/scripts/integrate_memory_index_telemetry.py
          rm -f .github/scripts/fix_memory_static_invariants.py
          rm -f .github/scripts/fix_memory_interface_bounds.py
          rm -f .github/scripts/repair_memory_ci.py
      - name: Validate exact final tree
        run: devenv test
      - name: Commit verified integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "fix(memory): complete typed production integration"
          git push origin HEAD:feature/production-memory
