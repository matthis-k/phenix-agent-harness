name: Restore workspace consistency test fix

on:
  pull_request:
    branches:
      - agent/grill-04-workspace-leases

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/grill-05-workspace-consistency
          fetch-depth: 0
      - name: Restore parent file and patch traversal test only
        shell: bash
        run: |
          git checkout 18652ed8177df6e9173db40a0687f65ac8e9a360 -- rust/crates/phenix-conductor/src/workspace_consistency.rs
          python - <<'PY'
          from pathlib import Path
          path = Path('rust/crates/phenix-conductor/src/workspace_consistency.rs')
          text = path.read_text()
          old = '            guard.observe("../outside"),'
          new = '            guard.read_utf8("../outside"),'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all --manifest-path rust/Cargo.toml
          rm .github/workflows/restore-consistency-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- rust/crates/phenix-conductor/src/workspace_consistency.rs .github/workflows/restore-consistency-test.yml
          git commit -m "fix: test traversal through native read boundary"
          git push origin HEAD:agent/grill-05-workspace-consistency
