name: Fix embedded authentication terminal once

on:
  push:
    branches:
      - fix/acp-auth-transcript-errors
    paths:
      - .github/workflows/fix-auth-terminal-errors-once.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: fix/acp-auth-transcript-errors
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply fixes and run full Rust gates
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR=/tmp/phenix-target

          python3 - <<'PY'
          from pathlib import Path

          path = Path('rust/crates/phenix-acp/src/lib.rs')
          source = path.read_text()
          old = '    SessionEvent, SessionImage, SessionOpenKind, SessionOpenRequest, SessionRouter, StaticWorkflow,\n'
          new = '    SessionEvent, SessionImage, SessionOpenKind, SessionOpenRequest, SessionRouter,\n    SessionTranscriptRole, StaticWorkflow,\n'
          if source.count(old) != 1:
              raise SystemExit('unexpected phenix-acp runtime export shape')
          path.write_text(source.replace(old, new, 1))

          path = Path('rust/crates/phenix-ui-runtime/src/runtime.rs')
          source = path.read_text()
          old = 'use phenix_runtime_api::{BackendClient, BackendCommand, BackendRuntime, BackendWorker};\n'
          new = 'use phenix_runtime_api::{BackendClient, BackendRuntime, BackendWorker};\n'
          if source.count(old) != 1:
              raise SystemExit('unexpected runtime API import shape')
          path.write_text(source.replace(old, new, 1))

          path = Path('rust/crates/phenix-ui-runtime/src/auth_terminal.rs')
          source = path.read_text()
          old = '    native_pty_system, ChildKiller, CommandBuilder, MasterPty, PtySize, PtySystem,\n'
          new = '    native_pty_system, ChildKiller, CommandBuilder, MasterPty, PtySize,\n'
          if source.count(old) != 1:
              raise SystemExit('unexpected portable-pty import shape')
          path.write_text(source.replace(old, new, 1))
          PY

          cargo fmt --manifest-path rust/Cargo.toml --all

          set +e
          cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --locked --message-format=short > /tmp/check.log 2>&1
          check_status=$?
          clippy_status=0
          test_status=0
          if (( check_status == 0 )); then
            cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked --message-format=short -- -D warnings > /tmp/clippy.log 2>&1
            clippy_status=$?
          else
            : > /tmp/clippy.log
          fi
          if (( check_status == 0 && clippy_status == 0 )); then
            cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked --message-format=short > /tmp/test.log 2>&1
            test_status=$?
          else
            : > /tmp/test.log
          fi
          set -e

          rm -f .github/diagnostics-auth-terminal.txt
          if (( check_status || clippy_status || test_status )); then
            {
              echo "check_status=${check_status}"
              echo "clippy_status=${clippy_status}"
              echo "test_status=${test_status}"
              for phase in check clippy test; do
                echo
                echo "## ${phase}"
                grep -E '(^|: )(error(\[[A-Z0-9]+\])?:|warning:|test result:)' "/tmp/${phase}.log" | tail -n 240 || true
                tail -n 100 "/tmp/${phase}.log"
              done
            } > .github/diagnostics-auth-terminal.txt
          fi

          rm .github/workflows/fix-auth-terminal-errors-once.yml
          git add rust/crates/phenix-acp/src/lib.rs \
            rust/crates/phenix-ui-runtime/src/runtime.rs \
            rust/crates/phenix-ui-runtime/src/auth_terminal.rs
          git add -u .github/diagnostics-auth-terminal.txt .github/workflows/fix-auth-terminal-errors-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "fix(auth): complete generic terminal host integration"
          git push --quiet origin HEAD:fix/acp-auth-transcript-errors

          echo "check=${check_status} clippy=${clippy_status} test=${test_status}"
          if (( check_status || clippy_status || test_status )); then
            exit 1
          fi
