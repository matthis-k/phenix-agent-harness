name: Finalize ACP authoring

on:
  push:
    branches:
      - feat/phenix-acp-config-directory

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phenix-acp-config-directory
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Generate, format, and test
        working-directory: rust
        run: |
          cargo generate-lockfile
          cargo fmt --all
          cargo test --package phenix-acp --package phenix-tui
      - name: Commit generated sources and remove workflow
        run: |
          rm .github/workflows/temporary-finalize-acp-authoring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/Cargo.lock rust/crates/phenix-acp/src rust/crates/phenix-tui/src/acp_config.rs .github/workflows/temporary-finalize-acp-authoring.yml
          git commit -m "Finalize multi-format ACP definition loading"
          git push origin HEAD:feat/phenix-acp-config-directory
