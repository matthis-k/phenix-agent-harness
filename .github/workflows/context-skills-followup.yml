name: context-skills-followup

on:
  push:
    branches:
      - agent/context-and-skills

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/context-and-skills
          fetch-depth: 0
      - run: python3 .github/context-skills-followup.py
      - run: cargo fmt --manifest-path rust/Cargo.toml --all
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md rust
          git commit -m 'fix: enforce manual-only skill loading'
          git push origin HEAD:agent/context-and-skills
      - run: cargo test --manifest-path rust/Cargo.toml -p phenix-core -p phenix-protocol -p phenix-conductor
