name: Enforce exact checkpoint shape

on:
  push:
    branches:
      - cleanup/remove-contract-versioning

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: cleanup/remove-contract-versioning
      - name: Reject superseded checkpoint shapes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("modules/phenix-pi/domain/workflow/checkpoint.ts")
          text = path.read_text()
          anchor = '''export interface RestoredWorkflowCheckpoint {
  readonly throughSequence: number;
  readonly snapshot: WorkflowCheckpointSnapshot;
}
'''
          replacement = anchor + '''
const WORKFLOW_CHECKPOINT_KEYS = new Set([
  "definitionId",
  "definitionFingerprint",
  "throughSequence",
  "snapshotFingerprint",
  "snapshot",
]);
'''
          text = text.replace(anchor, replacement)
          validation = '''function validCheckpointData(value: unknown): WorkflowCheckpointSavedData | undefined {
  if (!isRecord(value)) return undefined;
'''
          text = text.replace(
              validation,
              validation + '''  if (Object.keys(value).some((key) => !WORKFLOW_CHECKPOINT_KEYS.has(key))) return undefined;
''',
          )
          path.write_text(text)
          PY
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/phenix-pi/domain/workflow/checkpoint.ts
          git commit -m "Reject superseded checkpoint shapes"
          git push origin HEAD:cleanup/remove-contract-versioning
