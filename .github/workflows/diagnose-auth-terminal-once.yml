name: Diagnose embedded authentication terminal once

on:
  push:
    branches:
      - fix/acp-auth-transcript-errors
    paths:
      - .github/workflows/diagnose-auth-terminal-once.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: fix/acp-auth-transcript-errors
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Capture concise diagnostics
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR=/tmp/phenix-target

          set +e
          cargo fmt --manifest-path rust/Cargo.toml --all --check > /tmp/fmt.log 2>&1
          fmt_status=$?
          cargo check \
            --manifest-path rust/Cargo.toml \
            --workspace \
            --all-targets \
            --locked \
            --message-format=short \
            > /tmp/check.log 2>&1
          check_status=$?
          set -e

          {
            echo "fmt_status=${fmt_status}"
            echo "check_status=${check_status}"
            echo
            echo "## rustfmt"
            tail -n 80 /tmp/fmt.log
            echo
            echo "## cargo check"
            grep -E '(^|: )(error(\[[A-Z0-9]+\])?:|warning:)' /tmp/check.log | tail -n 240 || true
            if (( check_status != 0 )); then
              echo
              echo "## cargo check tail"
              tail -n 120 /tmp/check.log
            fi
          } > .github/diagnostics-auth-terminal.txt

          rm .github/workflows/diagnose-auth-terminal-once.yml
          git add .github/diagnostics-auth-terminal.txt
          git add -u .github/workflows/diagnose-auth-terminal-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(auth): capture terminal integration diagnostics"
          git push --quiet origin HEAD:fix/acp-auth-transcript-errors
