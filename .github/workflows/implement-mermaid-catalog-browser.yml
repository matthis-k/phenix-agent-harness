name: Implement Mermaid catalog browser

on:
  push:
    branches: [fix/mermaid-viewport]

permissions:
  contents: write

concurrency:
  group: implement-mermaid-catalog-browser
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: fix/mermaid-viewport

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with: { name: devenv }

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Implement full-screen catalog browser
        shell: bash
        run: |
          cat > modules/phenix-pi/extension/catalog-browser.ts <<'EOF'
          import type { TUI } from "@earendil-works/pi-tui";
          import {
            matchesKey,
            sliceByColumn,
            truncateToWidth,
            visibleWidth,
            type Component,
          } from "@earendil-works/pi-tui";

          import type { AnyDefinition } from "../domain/definition/definition.ts";
          import { renderCatalogDefinition } from "./mermaid-rendering.ts";
          import type { ObservabilityTheme } from "./observability-theme.ts";

          type CatalogPane = "definitions" | "preview";

          export interface CatalogBrowserOptions {
            readonly tui: TUI;
            readonly theme: ObservabilityTheme;
            readonly definitions: readonly AnyDefinition[];
            readonly initialDefinitionId?: string;
            readonly onClose: () => void;
          }

          export class CatalogBrowser implements Component {
            private readonly tui: TUI;
            private readonly theme: ObservabilityTheme;
            private readonly definitions: readonly AnyDefinition[];
            private readonly onClose: () => void;
            private selectedIndex: number;
            private activePane: CatalogPane = "definitions";
            private horizontalOffset = 0;
            private verticalOffset = 0;
            private maxHorizontalOffset = 0;
            private maxVerticalOffset = 0;
            private previewHeight = 1;

            constructor(options: CatalogBrowserOptions) {
              this.tui = options.tui;
              this.theme = options.theme;
              this.definitions = options.definitions;
              this.onClose = options.onClose;
              const initialIndex = options.initialDefinitionId
                ? options.definitions.findIndex(
                    (definition) => String(definition.id) === options.initialDefinitionId,
                  )
                : -1;
              this.selectedIndex = initialIndex >= 0 ? initialIndex : 0;
            }

            invalidate(): void {
              // Rendering is derived directly from current state and terminal dimensions.
            }

            handleInput(data: string): void {
              if (matchesKey(data, "escape") || data === "q" || data === "Q") {
                this.onClose();
                return;
              }
              if (matchesKey(data, "tab") || matchesKey(data, "shift+tab")) {
                this.activePane = this.activePane === "definitions" ? "preview" : "definitions";
                this.requestRender();
                return;
              }
              if (this.activePane === "definitions") {
                this.handleDefinitionInput(data);
                return;
              }
              this.handlePreviewInput(data);
            }

            render(width: number): string[] {
              const height = Math.max(8, this.tui.terminal.rows);
              if (width < 36) return this.renderNarrow(width, height);

              const sidebarWidth = Math.min(42, Math.max(24, Math.floor(width * 0.3)));
              const previewWidth = Math.max(1, width - sidebarWidth - 1);
              const bodyHeight = Math.max(1, height - 3);
              this.previewHeight = bodyHeight;

              const previewLines = this.previewLines();
              const longestPreviewLine = previewLines.reduce(
                (longest, line) => Math.max(longest, visibleWidth(line)),
                0,
              );
              this.maxHorizontalOffset = Math.max(0, longestPreviewLine - previewWidth);
              this.maxVerticalOffset = Math.max(0, previewLines.length - bodyHeight);
              this.horizontalOffset = clamp(
                this.horizontalOffset,
                0,
                this.maxHorizontalOffset,
              );
              this.verticalOffset = clamp(this.verticalOffset, 0, this.maxVerticalOffset);

              const selected = this.selectedDefinition();
              const header = this.fitLine(
                this.theme.fg(
                  "accent",
                  this.theme.bold(
                    ` Phenix catalog · ${selected ? String(selected.id) : "no definitions"}`,
                  ),
                ),
                width,
              );
              const rule = this.fitLine(this.theme.fg("dim", "─".repeat(width)), width);
              const sidebarLines = this.renderSidebar(sidebarWidth, bodyHeight);
              const body: string[] = [];
              for (let row = 0; row < bodyHeight; row += 1) {
                const source = previewLines[this.verticalOffset + row] ?? "";
                const preview = this.fitLine(
                  sliceByColumn(source, this.horizontalOffset, previewWidth, true),
                  previewWidth,
                );
                body.push(`${sidebarLines[row]}${this.theme.fg("dim", "│")}${preview}`);
              }
              const footer = this.fitLine(
                this.theme.fg(
                  "muted",
                  ` ${this.activePane === "definitions" ? "definitions" : "preview"} · Tab switch · arrows navigate/pan · PgUp/PgDn page · Home/End horizontal · Esc close · x ${this.horizontalOffset}/${this.maxHorizontalOffset} · y ${this.verticalOffset}/${this.maxVerticalOffset}`,
                ),
                width,
              );
              return [header, rule, ...body, footer].slice(0, height);
            }

            private handleDefinitionInput(data: string): void {
              if (
                matchesKey(data, "up") ||
                data === "k" ||
                data === "K"
              ) {
                this.selectRelative(-1);
              } else if (
                matchesKey(data, "down") ||
                data === "j" ||
                data === "J"
              ) {
                this.selectRelative(1);
              } else if (matchesKey(data, "pageUp")) {
                this.selectRelative(-Math.max(1, this.previewHeight - 2));
              } else if (matchesKey(data, "pageDown")) {
                this.selectRelative(Math.max(1, this.previewHeight - 2));
              } else if (matchesKey(data, "home")) {
                this.select(0);
              } else if (matchesKey(data, "end")) {
                this.select(this.definitions.length - 1);
              } else if (matchesKey(data, "right") || matchesKey(data, "enter")) {
                this.activePane = "preview";
                this.requestRender();
              }
            }

            private handlePreviewInput(data: string): void {
              const horizontalStep = 4;
              const verticalPage = Math.max(1, this.previewHeight - 2);
              if (matchesKey(data, "left") || data === "h" || data === "H") {
                this.horizontalOffset = clamp(
                  this.horizontalOffset - horizontalStep,
                  0,
                  this.maxHorizontalOffset,
                );
              } else if (matchesKey(data, "right") || data === "l" || data === "L") {
                this.horizontalOffset = clamp(
                  this.horizontalOffset + horizontalStep,
                  0,
                  this.maxHorizontalOffset,
                );
              } else if (matchesKey(data, "up") || data === "k" || data === "K") {
                this.verticalOffset = clamp(
                  this.verticalOffset - 1,
                  0,
                  this.maxVerticalOffset,
                );
              } else if (matchesKey(data, "down") || data === "j" || data === "J") {
                this.verticalOffset = clamp(
                  this.verticalOffset + 1,
                  0,
                  this.maxVerticalOffset,
                );
              } else if (matchesKey(data, "pageUp")) {
                this.verticalOffset = clamp(
                  this.verticalOffset - verticalPage,
                  0,
                  this.maxVerticalOffset,
                );
              } else if (matchesKey(data, "pageDown")) {
                this.verticalOffset = clamp(
                  this.verticalOffset + verticalPage,
                  0,
                  this.maxVerticalOffset,
                );
              } else if (matchesKey(data, "home")) {
                this.horizontalOffset = 0;
              } else if (matchesKey(data, "end")) {
                this.horizontalOffset = this.maxHorizontalOffset;
              } else {
                return;
              }
              this.requestRender();
            }

            private selectRelative(delta: number): void {
              if (this.definitions.length === 0) return;
              this.select(
                (this.selectedIndex + delta + this.definitions.length) % this.definitions.length,
              );
            }

            private select(index: number): void {
              if (this.definitions.length === 0) return;
              this.selectedIndex = clamp(index, 0, this.definitions.length - 1);
              this.horizontalOffset = 0;
              this.verticalOffset = 0;
              this.requestRender();
            }

            private selectedDefinition(): AnyDefinition | undefined {
              return this.definitions[this.selectedIndex];
            }

            private previewLines(): string[] {
              const selected = this.selectedDefinition();
              if (!selected) return ["No invokable definitions are available."];
              try {
                return renderCatalogDefinition(selected).split("\n");
              } catch (error) {
                return [
                  `${selected.id} — ${selected.title}`,
                  "",
                  `Unable to render definition: ${errorMessage(error)}`,
                ];
              }
            }

            private renderSidebar(width: number, height: number): string[] {
              if (this.definitions.length === 0) {
                return Array.from({ length: height }, (_, row) =>
                  this.fitLine(row === 0 ? " No definitions" : "", width),
                );
              }
              const start = clamp(
                this.selectedIndex - Math.floor(height / 2),
                0,
                Math.max(0, this.definitions.length - height),
              );
              return Array.from({ length: height }, (_, row) => {
                const index = start + row;
                const definition = this.definitions[index];
                if (!definition) return " ".repeat(width);
                const selected = index === this.selectedIndex;
                const kind = definition.kind === "workflow" ? "W" : "A";
                const shortId = String(definition.id).replace(/^(?:agent|workflow)\./, "");
                const line = `${selected ? "→" : " "} ${kind} ${shortId}`;
                const styled = selected
                  ? this.theme.fg(
                      this.activePane === "definitions" ? "accent" : "text",
                      this.theme.bold(line),
                    )
                  : this.theme.fg("muted", line);
                return this.fitLine(styled, width);
              });
            }

            private renderNarrow(width: number, height: number): string[] {
              const lines = [
                this.theme.fg("accent", this.theme.bold(" Phenix catalog")),
                this.theme.fg("warning", " Terminal is too narrow for the split catalog view."),
                "",
                " Resize to at least 36 columns.",
                " Esc closes the catalog.",
              ];
              return Array.from({ length: height }, (_, row) =>
                this.fitLine(lines[row] ?? "", width),
              );
            }

            private fitLine(line: string, width: number): string {
              const clipped = truncateToWidth(line, width, "");
              return clipped + " ".repeat(Math.max(0, width - visibleWidth(clipped)));
            }

            private requestRender(): void {
              this.tui.requestRender();
            }
          }

          function clamp(value: number, minimum: number, maximum: number): number {
            return Math.max(minimum, Math.min(value, maximum));
          }

          function errorMessage(error: unknown): string {
            return error instanceof Error ? error.message : String(error);
          }
          EOF

          cat > modules/phenix-pi/tests/catalog-browser.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";

          import type { TUI } from "@earendil-works/pi-tui";
          import { visibleWidth } from "@earendil-works/pi-tui";

          import type { AnyDefinition } from "../domain/definition/definition.ts";
          import { CatalogBrowser } from "../extension/catalog-browser.ts";
          import type { ObservabilityTheme } from "../extension/observability-theme.ts";

          const theme = {
            fg: (_tone: string, text: string) => text,
            bold: (text: string) => text,
          } as unknown as ObservabilityTheme;

          test("catalog browser fills the terminal and never wraps preview lines", () => {
            const tui = fakeTui(18);
            const browser = new CatalogBrowser({
              tui,
              theme,
              definitions: [workflowDefinition("workflow.long", "0123456789".repeat(30))],
              onClose: () => undefined,
            });

            const lines = browser.render(72);
            assert.equal(lines.length, 18);
            assert.ok(lines.every((line) => visibleWidth(line) === 72));
            assert.equal(lines.filter((line) => line.includes("0123456789")).length, 1);
          });

          test("catalog browser horizontally and vertically pans the no-wrap preview", () => {
            const tui = fakeTui(12);
            const browser = new CatalogBrowser({
              tui,
              theme,
              definitions: [workflowDefinition("workflow.long", `START-${"x".repeat(180)}-END`)],
              onClose: () => undefined,
            });

            const initial = browser.render(60).join("\n");
            assert.match(initial, /START-/);

            browser.handleInput("\t");
            for (let index = 0; index < 20; index += 1) browser.handleInput("\x1b[C");
            const shifted = browser.render(60).join("\n");
            assert.doesNotMatch(shifted, /START-/);
            assert.ok(tui.renderRequests > 0);
          });

          test("catalog browser sidebar selection changes the preview and escape closes", () => {
            const tui = fakeTui(14);
            let closed = false;
            const browser = new CatalogBrowser({
              tui,
              theme,
              definitions: [
                workflowDefinition("workflow.first", "First definition"),
                workflowDefinition("workflow.second", "Second definition"),
              ],
              onClose: () => {
                closed = true;
              },
            });

            assert.match(browser.render(80).join("\n"), /workflow\.first/);
            browser.handleInput("\x1b[B");
            assert.match(browser.render(80).join("\n"), /workflow\.second/);
            browser.handleInput("\x1b");
            assert.equal(closed, true);
          });

          function fakeTui(rows: number): TUI & { renderRequests: number } {
            return {
              terminal: { rows },
              renderRequests: 0,
              requestRender() {
                this.renderRequests += 1;
              },
            } as unknown as TUI & { renderRequests: number };
          }

          function workflowDefinition(id: string, description: string): AnyDefinition {
            return {
              id,
              kind: "workflow",
              title: id,
              description,
              input: { id: `${id}.input` },
              output: { id: `${id}.output` },
              graph: {
                entry: "start",
                nodes: [
                  {
                    kind: "invoke",
                    id: "start",
                    title: "Start",
                    definition: { id: "agent.scout" },
                    input: "test.input",
                    wait: "await",
                  },
                  { kind: "return", id: "done", title: "Done", output: "test.output" },
                ],
                edges: [{ from: "start", to: "done" }],
              },
              limits: { timeoutMs: 1_000, maxNodeRuns: 2, maxParallelism: 1 },
            } as unknown as AnyDefinition;
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          path = Path("modules/phenix-pi/extension/root-extension.ts")
          text = path.read_text()
          text = text.replace(
              'import { renderCatalogDefinition, renderTerminalMermaid } from "./mermaid-rendering.ts";\n',
              'import { CatalogBrowser } from "./catalog-browser.ts";\nimport { renderTerminalMermaid } from "./mermaid-rendering.ts";\n',
          )
          old = '''      if (action === "catalog") {
                const definitions = await activeRuntime.catalog.listAvailable(activeRoot);
                const query = rawOptions.trim().toLowerCase();
                if (!query) {
                  ctx.ui.notify(
                    definitions.map((definition) => `${definition.id} — ${definition.title}`).join("\\n"),
                    "info",
                  );
                  return;
                }
                const matches = definitions.filter((definition) => {
                  const id = String(definition.id).toLowerCase();
                  const shortId = id.replace(/^(?:agent|workflow)\\./, "");
                  return id === query || shortId === query || definition.title.toLowerCase() === query;
                });
                if (matches.length !== 1) {
                  ctx.ui.notify(
                    matches.length === 0
                      ? `Catalog definition not found: ${rawOptions}`
                      : `Catalog selector is ambiguous: ${matches.map((item) => item.id).join(", ")}`,
                    "warning",
                  );
                  return;
                }
                const match = matches.at(0);
                if (!match) throw new Error(`Catalog match disappeared for ${rawOptions}`);
                const definition = activeRuntime.catalog.get(definitionRef(match.id)) as AnyDefinition;
                ctx.ui.notify(limit(renderCatalogDefinition(definition)), "info");
                return;
              }
          '''
          new = '''      if (action === "catalog") {
                const available = await activeRuntime.catalog.listAvailable(activeRoot);
                const query = rawOptions.trim().toLowerCase();
                const matches = query
                  ? available.filter((definition) => {
                      const id = String(definition.id).toLowerCase();
                      const shortId = id.replace(/^(?:agent|workflow)\\./, "");
                      return (
                        id === query ||
                        shortId === query ||
                        definition.title.toLowerCase() === query
                      );
                    })
                  : [];
                if (query && matches.length !== 1) {
                  ctx.ui.notify(
                    matches.length === 0
                      ? `Catalog definition not found: ${rawOptions}`
                      : `Catalog selector is ambiguous: ${matches.map((item) => item.id).join(", ")}`,
                    "warning",
                  );
                  return;
                }
                if (ctx.mode !== "tui") {
                  ctx.ui.notify(
                    available.map((definition) => `${definition.id} — ${definition.title}`).join("\\n"),
                    "info",
                  );
                  return;
                }
                const definitions = available.map(
                  (definition) =>
                    activeRuntime.catalog.get(definitionRef(definition.id)) as AnyDefinition,
                );
                await ctx.ui.custom((tui, theme, _keybindings, done) =>
                  new CatalogBrowser({
                    tui,
                    theme,
                    definitions,
                    ...(matches[0]
                      ? { initialDefinitionId: String(matches[0].id) }
                      : {}),
                    onClose: () => done(undefined),
                  }),
                );
                return;
              }
          '''
          if old not in text:
              raise SystemExit("catalog handler patch target not found")
          path.write_text(text.replace(old, new))
          PY

      - name: Apply repository maintenance fixes
        run: devenv tasks run maintenance:fix

      - name: Run canonical tests
        run: devenv test

      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/implement-mermaid-catalog-browser.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --stat
          git commit -m "Add full-screen Mermaid catalog browser"
          git push origin HEAD:fix/mermaid-viewport
