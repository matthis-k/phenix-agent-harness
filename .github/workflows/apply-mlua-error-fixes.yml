name: Apply mlua error fixes

on:
  push:
    branches:
      - feature/rust-ratatui-frontend
    paths:
      - .github/workflows/apply-mlua-error-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feature/rust-ratatui-frontend
      - name: Correct message-only Lua errors
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("rust/crates/phenix-ui-lua/src/api.rs")
          text = path.read_text()
          replacements = {
              'mlua::Error::external(\n            "color must be a name, #RRGGBB, index, or {r,g,b}",\n        )': 'mlua::Error::runtime(\n            "color must be a name, #RRGGBB, index, or {r,g,b}",\n        )',
              'mlua::Error::external(format!("unknown color: {value}"))': 'mlua::Error::runtime(format!("unknown color: {value}"))',
              'mlua::Error::external(format!(\n                        "unknown split direction: {value}"\n                    ))': 'mlua::Error::runtime(format!(\n                        "unknown split direction: {value}"\n                    ))',
              'mlua::Error::external("layout split must contain children")': 'mlua::Error::runtime("layout split must contain children")',
              'mlua::Error::external(format!(\n            "unknown layout node kind: {value}"\n        ))': 'mlua::Error::runtime(format!(\n            "unknown layout node kind: {value}"\n        ))',
              'mlua::Error::external(\n            "focus direction must be next, previous, left, right, up, or down",\n        )': 'mlua::Error::runtime(\n            "focus direction must be next, previous, left, right, up, or down",\n        )',
              'mlua::Error::external(\n            "axis must be horizontal/width/x or vertical/height/y",\n        )': 'mlua::Error::runtime(\n            "axis must be horizontal/width/x or vertical/height/y",\n        )',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected text missing: {old[:80]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Format and commit
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/phenix-ui-lua/src/api.rs
          git commit -m 'fix(lua): classify configuration errors correctly'
          git push origin HEAD:feature/rust-ratatui-frontend
