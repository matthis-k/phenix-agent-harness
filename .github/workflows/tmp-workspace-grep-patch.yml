name: Temporary workspace grep patch

on:
  push:
    branches:
      - agent/fix-workspace-grep-rg

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: Apply workspace grep fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one occurrence, found {count}")
              return text.replace(old, new, 1)

          def replace_function(text: str, name: str, next_name: str, replacement: str) -> str:
              start = text.index(f"fn {name}(")
              end = text.index(f"\nfn {next_name}(", start)
              return text[:start] + replacement.rstrip() + "\n" + text[end:]

          rust_path = Path("rust/crates/phenix-conductor/src/workspace_tools.rs")
          rust = rust_path.read_text()

          rust = replace_once(
              rust,
              "Paths are workspace-relative. Use offset and limit for large files.",
              "Paths may be workspace-relative, absolute within the workspace, or use ~/ when it resolves within the workspace. Use offset and limit for large files.",
              "read tool description",
          )
          rust = replace_once(
              rust,
              "Paths are workspace-relative and missing parent directories are created.",
              "Paths may be workspace-relative, absolute within the workspace, or use ~/ when it resolves within the workspace; missing parent directories are created.",
              "write tool description",
          )
          rust = replace_once(
              rust,
              "The pattern uses GNU grep regular-expression syntax; .git is excluded.",
              "The pattern uses ripgrep regular-expression syntax; hidden and ignored files are searched while .git is excluded.",
              "grep tool description",
          )
          if rust.count('"description": "Workspace-relative file path"') != 2:
              raise SystemExit("file path schema descriptions changed unexpectedly")
          rust = rust.replace(
              '"description": "Workspace-relative file path"',
              '"description": "Workspace-relative, absolute-within-workspace, or ~/ file path"',
          )
          rust = replace_once(
              rust,
              '"description": "Workspace-relative file or directory to search; defaults to ."',
              '"description": "Workspace-relative, absolute-within-workspace, or ~/ file or directory to search; defaults to ."',
              "grep path schema description",
          )
          if rust.count("relative_workspace_path(&input.path)?") != 2:
              raise SystemExit("read/write path resolver calls changed unexpectedly")
          rust = rust.replace(
              "relative_workspace_path(&input.path)?",
              "relative_workspace_path(workspace, &input.path)?",
          )

          execute_grep = r'''
          fn execute_grep(workspace: &Path, arguments: &str) -> Result<String, String> {
              let input: GrepInput = serde_json::from_str(arguments)
                  .map_err(|error| format!("invalid grep arguments: {error}"))?;
              if input.pattern.is_empty() {
                  return Err("grep pattern must not be empty".to_owned());
              }
              let relative = relative_workspace_path(workspace, input.path.as_deref().unwrap_or("."))?;
              let rg = std::env::var_os("PHENIX_RG").unwrap_or_else(|| OsString::from("rg"));
              let mut command = Command::new(rg);
              command
                  .arg("--hidden")
                  .arg("--no-ignore")
                  .arg("--line-number")
                  .arg("--with-filename")
                  .arg("--no-heading")
                  .arg("--color")
                  .arg("never")
                  .arg("--glob")
                  .arg("!**/.git/**");
              if input.case_sensitive == Some(false) {
                  command.arg("--ignore-case");
              }
              let output = command
                  .arg("--")
                  .arg(&input.pattern)
                  .arg(&relative)
                  .current_dir(workspace)
                  .output()
                  .map_err(|error| format!("failed to execute rg: {error}"))?;
              let exit_code = output.status.code().unwrap_or(-1);
              if !matches!(exit_code, 0 | 1) {
                  return Err(format!(
                      "rg failed with exit code {exit_code}: {}",
                      capture(&output.stderr)
                  ));
              }

              Ok(json!({
                  "pattern": input.pattern,
                  "path": relative.to_string_lossy().into_owned(),
                  "matches": capture(&output.stdout),
                  "stderr": capture(&output.stderr),
              })
              .to_string())
          }
          '''
          rust = replace_function(rust, "execute_grep", "relative_workspace_path", execute_grep)

          path_helpers = r'''
          fn relative_workspace_path(workspace: &Path, raw: &str) -> Result<PathBuf, String> {
              if raw.trim().is_empty() {
                  return Err("workspace path must not be empty".to_owned());
              }

              let path = expand_home_path(raw)?;
              if !path.is_absolute() {
                  return normalize_relative_workspace_path(&path, raw);
              }

              let workspace = if workspace.is_absolute() {
                  workspace.to_path_buf()
              } else {
                  std::env::current_dir()
                      .map_err(|error| format!("failed to resolve workspace path: {error}"))?
                      .join(workspace)
              };
              let relative = path.strip_prefix(&workspace).map_err(|_| {
                  format!("workspace path escapes the workspace: {raw}")
              })?;
              normalize_relative_workspace_path(relative, raw)
          }

          fn expand_home_path(raw: &str) -> Result<PathBuf, String> {
              if raw == "~" {
                  return std::env::var_os("HOME")
                      .map(PathBuf::from)
                      .ok_or_else(|| "cannot expand ~ because HOME is not set".to_owned());
              }
              if let Some(relative) = raw.strip_prefix("~/") {
                  let home = std::env::var_os("HOME")
                      .map(PathBuf::from)
                      .ok_or_else(|| "cannot expand ~/ because HOME is not set".to_owned())?;
                  return Ok(home.join(relative));
              }
              if raw.starts_with('~') {
                  return Err(format!("unsupported home-relative workspace path: {raw}"));
              }
              Ok(PathBuf::from(raw))
          }

          fn normalize_relative_workspace_path(path: &Path, raw: &str) -> Result<PathBuf, String> {
              let mut relative = PathBuf::new();
              for component in path.components() {
                  match component {
                      Component::CurDir => {}
                      Component::Normal(part) => relative.push(part),
                      Component::ParentDir | Component::RootDir | Component::Prefix(_) => {
                          return Err(format!("workspace path escapes the workspace: {raw}"));
                      }
                  }
              }
              if relative.as_os_str().is_empty() {
                  relative.push(".");
              }
              Ok(relative)
          }
          '''
          rust = replace_function(rust, "relative_workspace_path", "capture", path_helpers)

          old_test_start = rust.index("    #[test]\n    fn dedicated_file_tools_reject_workspace_escape_paths()")
          old_test_end = rust.index(
              "\n    #[test]\n    fn default_tool_surface_reaches_root_and_every_agent_in_a_workflow()",
              old_test_start,
          )
          new_tests = r'''
              #[test]
              fn dedicated_file_tools_reject_workspace_escape_paths() {
                  let workspace = temp_workspace("workspace-paths");
                  assert!(relative_workspace_path(&workspace, "../outside").is_err());
                  assert!(relative_workspace_path(&workspace, "nested/../../outside").is_err());
                  assert!(relative_workspace_path(&workspace, "/absolute").is_err());
                  assert_eq!(
                      relative_workspace_path(&workspace, "./src/lib.rs").unwrap(),
                      Path::new("src/lib.rs")
                  );
                  assert_eq!(
                      relative_workspace_path(&workspace, workspace.to_string_lossy().as_ref()).unwrap(),
                      Path::new(".")
                  );
                  assert_eq!(
                      relative_workspace_path(
                          &workspace,
                          workspace.join("src/lib.rs").to_string_lossy().as_ref(),
                      )
                      .unwrap(),
                      Path::new("src/lib.rs")
                  );

                  let _ = fs::remove_dir_all(workspace);
              }

              #[test]
              fn dedicated_file_tools_expand_home_paths_inside_the_workspace() {
                  let Some(home) = std::env::var_os("HOME").map(PathBuf::from) else {
                      return;
                  };
                  if !home.is_absolute() {
                      return;
                  }
                  let workspace = home.join("phenix/repos/phenix-nvim");
                  let workspace_from_home = workspace.strip_prefix(&home).unwrap();
                  let raw_workspace = format!("~/{}", workspace_from_home.to_string_lossy());
                  assert_eq!(
                      relative_workspace_path(&workspace, &raw_workspace).unwrap(),
                      Path::new(".")
                  );

                  let raw_file = format!("{raw_workspace}/lua/phenix/ui.lua");
                  assert_eq!(
                      relative_workspace_path(&workspace, &raw_file).unwrap(),
                      Path::new("lua/phenix/ui.lua")
                  );
                  assert!(relative_workspace_path(&workspace, "~/outside").is_err());
              }
          '''
          rust = rust[:old_test_start] + new_tests + rust[old_test_end:]
          rust_path.write_text(rust)

          nix_path = Path("modules/phenix-acp.nix")
          nix = nix_path.read_text()
          nix = replace_once(
              nix,
              '--set PHENIX_GREP "${pkgs.gnugrep}/bin/grep"',
              '--set PHENIX_RG "${pkgs.ripgrep}/bin/rg"',
              "conductor rg wrapper",
          )
          nix_path.write_text(nix)

          dev_path = Path("modules/development.nix")
          dev = dev_path.read_text()
          dev = replace_once(
              dev,
              "          pkgs.rustfmt\n          pkgs.statix",
              "          pkgs.rustfmt\n          pkgs.ripgrep\n          pkgs.statix",
              "dev shell ripgrep",
          )
          dev_path.write_text(dev)
          PY

          rm .github/workflows/tmp-workspace-grep-patch.yml
          nix run .#phenix-maintenance -- fix

      - name: Validate source
        run: nix run .#phenix-maintenance -- check source

      - name: Validate unit tests
        env:
          CARGO_HOME: ${{ runner.temp }}/phenix-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/phenix-cargo-target
        run: nix run .#phenix-maintenance -- test unit

      - name: Validate packaged conductor
        run: nix run .#phenix-maintenance -- test product phenix-acp

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/phenix-conductor/src/workspace_tools.rs modules/phenix-acp.nix modules/development.nix .github/workflows/tmp-workspace-grep-patch.yml
          git commit -m "fix: make workspace grep path-safe and rg-backed"
          git push origin HEAD:agent/fix-workspace-grep-rg
