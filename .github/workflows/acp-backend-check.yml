name: ACP backend check

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/acp-backend-check.yml
      - rust/**

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@4305c38b25d97ef35a8ad1f985ccf2d2242004f2
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply ACP SDK type fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("rust/crates/phenix-acp-backend/src/lib.rs")
          content = path.read_text()
          replacements = [
              (
                  ".connect_with(agent, move |cx| async move {",
                  ".connect_with(agent, move |cx: ConnectTo<Agent>| async move {",
              ),
              (
                  "async fn run_session<Link>(\n    mut session: agent_client_protocol::ActiveSession<'static, Link>,",
                  "async fn run_session<'a>(\n    mut session: agent_client_protocol::ActiveSession<'a, ConnectTo<Agent>>,
",
              ),
              (
                  ") -> Result<(), BackendError>\nwhere\n    Link: agent_client_protocol::role::HasPeer<Agent>,\n{",
                  ") -> Result<(), BackendError> {",
              ),
              (
                  "fn handle_request<Link>(\n    session: &mut agent_client_protocol::ActiveSession<'static, Link>,",
                  "fn handle_request<'a>(\n    session: &mut agent_client_protocol::ActiveSession<'a, ConnectTo<Agent>>,
",
              ),
          ]
          for old, new in replacements:
              if old not in content:
                  raise SystemExit(f"missing replacement anchor: {old}")
              content = content.replace(old, new, 1)

          content, count = re.subn(
              r"\) -> Result<bool, BackendError>\nwhere\n    Link: agent_client_protocol::role::HasPeer<Agent>,\n\{",
              ") -> Result<bool, BackendError> {",
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("handle_request bound replacement failed")

          old = "state.append_assistant_text(&text.text, outputs)?;"
          new = "state\n                            .append_assistant_text(&text.text, outputs)\n                            .map_err(to_acp_error)?;"
          if old not in content:
              raise SystemExit("notification error mapping anchor missing")
          content = content.replace(old, new, 1)
          path.write_text(content)
          PY
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Commit generated Rust files
        run: |
          if ! git diff --quiet -- rust; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add rust
            git commit -m "fix official ACP connection types"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - name: Check
        run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked
