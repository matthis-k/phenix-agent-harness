name: Clippy fix

on:
  push:
    branches:
      - refactor/rich-transcript-blocks

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: refactor/rich-transcript-blocks
      - run: python .github/scripts/clippy_fix.py
      - run: cargo fmt --all
        working-directory: rust
      - shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- rust; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust
          git commit -m "style(rust): satisfy canonical clippy gate"
          git push origin HEAD:refactor/rich-transcript-blocks
