name: Integrate production memory PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: integrate-production-memory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'feature/production-memory' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: feature/production-memory
          fetch-depth: 0
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Apply reviewed production integration
        run: |
          python .github/scripts/add_memory_snapshot_telemetry.py
          python .github/scripts/integrate_memory_index_telemetry.py
          python .github/scripts/fix_memory_static_invariants.py
          python .github/scripts/fix_memory_interface_bounds.py
      - name: Apply repository maintenance fixes
        run: devenv tasks run maintenance:fix
      - name: Run complete repository tests
        run: devenv test
      - name: Preserve repository lock pins
        run: git checkout -- devenv.lock
      - name: Remove one-shot integration files
        run: |
          rm -f .github/workflows/integrate-production-memory.yml
          rm -f .github/workflows/integrate-production-memory-v2.yml
          rm -f .github/workflows/integrate-production-memory-v3.yml
          rm -f .github/workflows/integrate-production-memory-pr.yml
          rm -f .github/scripts/add_memory_snapshot_telemetry.py
          rm -f .github/scripts/integrate_memory_index_telemetry.py
          rm -f .github/scripts/fix_memory_static_invariants.py
          rm -f .github/scripts/fix_memory_interface_bounds.py
      - name: Commit verified integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "feat(memory): integrate bounded indexed retrieval and telemetry"
          git push origin HEAD:feature/production-memory
