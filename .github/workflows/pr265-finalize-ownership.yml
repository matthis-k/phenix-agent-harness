name: PR 265 finalize workflow ownership

on:
  push:
    branches:
      - fix/workflow-ownership-issue-227

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: fix/workflow-ownership-issue-227
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Apply ownership and roundtrip fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one target, found {count}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1))

          workflow_path = Path('rust/crates/phenix-acp/src/runtime/workflow.rs')
          workflow = workflow_path.read_text()
          old = (
              '            WorkflowCondition::InputExists { path } => value_at_path(&self.input, path).is_some(),\n'
              '            WorkflowCondition::InputMissing { path } => value_at_path(&self.input, path).is_none(),\n'
          )
          new = (
              '            WorkflowCondition::InputExists { path } => {\n'
              '                source.settled() && value_at_path(&self.input, path).is_some()\n'
              '            }\n'
              '            WorkflowCondition::InputMissing { path } => {\n'
              '                source.settled() && value_at_path(&self.input, path).is_none()\n'
              '            }\n'
          )
          if workflow.count(old) != 1:
              raise SystemExit('workflow input-condition target not found exactly once')
          workflow = workflow.replace(old, new, 1)
          marker = '    #[test]\n    fn optional_review_failure_does_not_erase_successful_evidence() {'
          if workflow.count(marker) != 1:
              raise SystemExit('workflow test insertion marker not found exactly once')
          regression = r'''    #[test]
          fn input_conditions_wait_for_the_source_state_to_settle() {
              let graph = WorkflowGraph {
                  entry: "invoke".to_owned(),
                  states: vec![
                      state(
                          "invoke",
                          true,
                          WorkflowStateKind::Invoke {
                              role: RoleId::parse("worker").expect("role"),
                              objective: "Work on {objective}".to_owned(),
                          },
                      ),
                      state(
                          "return",
                          false,
                          WorkflowStateKind::Return {
                              summary: "Done".to_owned(),
                          },
                      ),
                  ],
                  transitions: vec![edge(
                      "invoke",
                      "return",
                      WorkflowCondition::InputExists {
                          path: "plan".to_owned(),
                      },
                  )],
              };
              let mut machine = WorkflowMachine::new(
                  graph,
                  "change",
                  serde_json::json!({"plan": "provided"}),
              )
              .expect("machine");

              let actions = machine.next_actions().expect("invoke");
              assert_eq!(actions.len(), 1);
              assert!(matches!(
                  actions.first(),
                  Some(WorkflowAction::Invoke { key, .. }) if key == "invoke"
              ));

              bind_and_complete(&mut machine, "invoke", 1, r#"{"status":"done"}"#);
              let actions = machine.next_actions().expect("return");
              assert!(matches!(
                  actions.last(),
                  Some(WorkflowAction::Complete(WorkflowTerminal {
                      success: true,
                      ..
                  }))
              ));
          }

          '''
          workflow = workflow.replace(marker, regression + marker, 1)
          workflow_path.write_text(workflow)

          conductor_path = Path('rust/crates/phenix-acp/src/conductor.rs')
          conductor = conductor_path.read_text()
          old_close = (
              '                self.workflow_runs.remove(&params.tree_id);\n'
              '                self.gateway.close_tree(&params.tree_id)?;\n'
          )
          if conductor.count(old_close) != 1:
              raise SystemExit('conductor close target not found exactly once')
          conductor = conductor.replace(old_close, '                self.close_tree(&params.tree_id)?;\n', 1)

          section_start = conductor.index('    pub fn poll_node(\n')
          section_end = conductor.index('    fn poll_running_states(\n', section_start)
          replacement = r'''    pub fn poll_node(
              &mut self,
              tree_id: &SessionTreeId,
              node_id: &SessionNodeId,
          ) -> Result<Vec<GatewayEvent>, GatewayError> {
              if !self.workflow_runs.contains_key(tree_id) {
                  return self.gateway.execute(tree_id, node_id, SessionCommand::Poll);
              }

              self.with_managed_run(tree_id, |conductor, run| {
                  conductor.poll_running_states(tree_id, run)?;
                  conductor.drive_managed_workflow(tree_id, run)?;
                  Ok(drain_pending(run, node_id))
              })
          }

              fn start_workflow(
              &mut self,
              params: WorkflowStartParams,
          ) -> Result<WorkflowStartResult, GatewayError> {
              if self
                  .workflow_runs
                  .get(&params.tree_id)
                  .is_some_and(|run| !run.finished)
              {
                  return Err(GatewayError::workflow(format!(
                      "tree {} already has a conductor-managed workflow",
                      params.tree_id
                  )));
              }
              self.workflow_runs.remove(&params.tree_id);

              let Some(graph) = self.workflow_graphs.get(&params.workflow).cloned() else {
                  return self.gateway.start_workflow(
                      &params.tree_id,
                      &params.workflow,
                      params.difficulty,
                      params.objective,
                  );
              };

              let (objective_id, root_node_id, root_difficulty) = self.gateway.begin_workflow(
                  &params.tree_id,
                  &params.workflow,
                  params.objective.clone(),
              )?;
              let difficulty = params.difficulty.unwrap_or(root_difficulty);
              let machine = match WorkflowMachine::new(graph, params.objective, params.input) {
                  Ok(machine) => machine,
                  Err(error) => {
                      let _ = self.gateway.finish_workflow(
                          &params.tree_id,
                          &params.workflow,
                          &objective_id,
                          false,
                      );
                      return Err(error);
                  }
              };
              let mut run = ManagedWorkflowRun {
                  workflow_id: params.workflow,
                  objective_id: objective_id.clone(),
                  root_node_id: root_node_id.clone(),
                  difficulty,
                  machine,
                  pending_events: BTreeMap::new(),
                  finished: false,
              };
              if let Err(error) = self.drive_managed_workflow(&params.tree_id, &mut run) {
                  for node_id in run.machine.running_nodes() {
                      let _ = self.gateway.cancel_subtree(&params.tree_id, &node_id);
                  }
                  let _ = self.gateway.finish_workflow(
                      &params.tree_id,
                      &run.workflow_id,
                      &run.objective_id,
                      false,
                  );
                  return Err(error);
              }
              let first_node = run
                  .machine
                  .first_bound_node()
                  .unwrap_or_else(|| root_node_id.clone());
              self.workflow_runs.insert(params.tree_id, run);
              Ok(WorkflowStartResult {
                  objective_id,
                  root_node_id: first_node,
              })
          }

              pub fn execute_node(
              &mut self,
              tree_id: &SessionTreeId,
              node_id: &SessionNodeId,
              command: SessionCommand,
          ) -> Result<Vec<GatewayEvent>, GatewayError> {
              if !self.workflow_runs.contains_key(tree_id) {
                  return self.gateway.execute(tree_id, node_id, command);
              }
              self.with_managed_run(tree_id, |conductor, run| {
                  let events = conductor.gateway.execute(tree_id, node_id, command)?;
                  conductor.observe_if_running(run, node_id, &events)?;
                  conductor.drive_managed_workflow(tree_id, run)?;
                  Ok(events)
              })
          }

              pub fn cancel_node(
              &mut self,
              tree_id: &SessionTreeId,
              node_id: &SessionNodeId,
          ) -> Result<Vec<GatewayEvent>, GatewayError> {
              if !self.workflow_runs.contains_key(tree_id) {
                  return self.gateway.cancel_subtree(tree_id, node_id);
              }
              self.with_managed_run(tree_id, |conductor, run| {
                  let events = conductor.gateway.cancel_subtree(tree_id, node_id)?;
                  for event in &events {
                      conductor.observe_if_running(run, &event.node_id, std::slice::from_ref(event))?;
                  }
                  conductor.drive_managed_workflow(tree_id, run)?;
                  Ok(events)
              })
          }

              pub fn close_tree(&mut self, tree_id: &SessionTreeId) -> Result<(), GatewayError> {
              self.gateway.close_tree(tree_id)?;
              self.workflow_runs.remove(tree_id);
              Ok(())
          }

              fn with_managed_run<T>(
              &mut self,
              tree_id: &SessionTreeId,
              operation: impl FnOnce(&mut Self, &mut ManagedWorkflowRun) -> Result<T, GatewayError>,
          ) -> Result<T, GatewayError> {
              let mut run = self
                  .workflow_runs
                  .remove(tree_id)
                  .ok_or_else(|| GatewayError::Invariant("managed workflow disappeared".to_owned()))?;
              let result = operation(self, &mut run);
              self.workflow_runs.insert(tree_id.clone(), run);
              result
          }

          '''
          conductor = conductor[:section_start] + replacement + conductor[section_end:]
          conductor_path.write_text(conductor)

          runtime_path = Path('rust/crates/phenix-conductor/src/lib.rs')
          runtime = runtime_path.read_text()
          changes = [
              (
                  '        self.conductor\n            .gateway_mut()\n            .execute(&binding.tree_id, &binding.root_node_id, command)\n',
                  '        self.conductor\n            .execute_node(&binding.tree_id, &binding.root_node_id, command)\n',
              ),
              (
                  '        let events = self\n            .conductor\n            .gateway_mut()\n            .cancel_subtree(&binding.tree_id, &binding.root_node_id)?;\n',
                  '        let events = self\n            .conductor\n            .cancel_node(&binding.tree_id, &binding.root_node_id)?;\n',
              ),
              (
                  '        self.conductor.gateway_mut().close_tree(&tree_id)?;\n',
                  '        self.conductor.close_tree(&tree_id)?;\n',
              ),
          ]
          for old, new in changes:
              if runtime.count(old) != 1:
                  raise SystemExit(f'runtime target not found exactly once: {old[:60]!r}')
              runtime = runtime.replace(old, new, 1)
          runtime_path.write_text(runtime)

          roundtrip_path = Path('rust/crates/phenix-conductor/tests/stdio_roundtrip.rs')
          roundtrip = roundtrip_path.read_text()
          start = roundtrip.index('    let mut saw_echo = false;\n    let completed = loop {')
          end = roundtrip.index('    assert!(\n        saw_echo,', start)
          new_roundtrip = r'''    let mut saw_echo = false;
              let mut completed = None;
              while !saw_echo || completed.is_none() {
                  let message = process.receive()?;
                  if message.get("method").and_then(Value::as_str) == Some("session/update")
                      && message.to_string().contains("echo: hello")
                  {
                      saw_echo = true;
                  }
                  if message.get("id") == Some(&Value::from(11)) {
                      completed = Some(message);
                  }
              }
              let completed = completed.expect("prompt response");

          '''
          roundtrip = roundtrip[:start] + new_roundtrip + roundtrip[end:]
          roundtrip_path.write_text(roundtrip)
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Compile and strict lint
        run: |
          cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --locked
          cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Stress stdio roundtrip
        run: |
          for i in $(seq 1 12); do
            echo "stdio roundtrip iteration $i"
            cargo test --manifest-path rust/Cargo.toml --locked -p phenix-conductor --test stdio_roundtrip -- --exact standard_and_phenix_acp_share_one_conductor_aggregate
          done
      - name: Full Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked
      - name: Commit validated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/phenix-acp/src/conductor.rs rust/crates/phenix-acp/src/runtime/workflow.rs rust/crates/phenix-conductor/src/lib.rs rust/crates/phenix-conductor/tests/stdio_roundtrip.rs
          git -c core.hooksPath=/dev/null -c commit.gpgSign=false commit --no-verify -m "fix: preserve conductor workflow ownership"
          git push origin HEAD:fix/workflow-ownership-issue-227
