name: PR 262 format fix

on:
  push:
    branches:
      - feat/neovim-native-interaction

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/neovim-native-interaction
      - name: Format Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cd rust
          cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust
          git commit -m "style: format Rust workspace"
          git push origin HEAD:feat/neovim-native-interaction
