name: Format UI turn PR

on:
  push:
    branches: [ui/turn-steering-interrupt]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ui/turn-steering-interrupt
          fetch-depth: 0
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Apply repository fixes
        run: devenv tasks run maintenance:fix
      - name: Commit formatting and remove temporary workflow
        run: |
          rm .github/workflows/format-ui-turn-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Apply repository formatting"
            git push origin HEAD:ui/turn-steering-interrupt
          fi
