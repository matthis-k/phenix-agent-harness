name: PR 264 base fixup

on:
  push:
    branches:
      - refactor/phenix-acp-boundaries-routing-d0-d4
    paths:
      - .github/workflows/pr264-base-fixup.yml

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: refactor/phenix-acp-boundaries-routing-d0-d4
      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy
      - name: Apply ACP transport and migration fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          backend = Path('rust/crates/phenix-acp-backend/src/lib.rs')
          text = backend.read_text()
          old_import = '    ClientSessionCapabilities, ContentBlock, CreateTerminalRequest, ExtRequest, ExtResponse,\n'
          new_import = '    ClientSessionCapabilities, ContentBlock, CreateTerminalRequest, ExtRequest,\n'
          if old_import not in text:
              raise SystemExit('expected ExtRequest/ExtResponse import not found')
          text = text.replace(old_import, new_import, 1)
          old_loop = '''            for request in startup_requests {\n                let _: ExtResponse = cx.send_request(request).block_task().await?;\n            }\n'''
          new_loop = '''            for request in startup_requests {\n                let request = phenix_acp::acp::UntypedMessage::new(\n                    request.method.as_ref(),\n                    request.params.as_ref(),\n                )?;\n                let _: serde_json::Value = cx.send_request(request).block_task().await?;\n            }\n'''
          if old_loop not in text:
              raise SystemExit('expected startup extension request loop not found')
          backend.write_text(text.replace(old_loop, new_loop, 1))

          cargo = Path('rust/crates/phenix-acp-presets/Cargo.toml')
          text = cargo.read_text()
          marker = 'shell-words.workspace = true\n'
          if 'serde_json.workspace = true' not in text:
              if marker not in text:
                  raise SystemExit('expected shell-words dependency marker not found')
              text = text.replace(marker, 'serde_json.workspace = true\n' + marker, 1)
          cargo.write_text(text)

          conversions = [
              (
                  Path('rust/crates/phenix-acp-presets/src/bin/phenix-acp-smoke.rs'),
                  'phenix_acp::acp::Error',
              ),
              (
                  Path('rust/crates/phenix-conductor/src/bin/fixture-agent.rs'),
                  'agent_client_protocol::Error',
              ),
          ]
          old = '''                    ClientRequest::SetSessionConfigOptionRequest(request) => {\n                        json!({\n                            "configOptions": fixture_config_options_with(\n                                &request.config_id.to_string(),\n                                request.value.as_ref(),\n                            ),\n                        })\n                    }\n'''
          old_compact = '''                    ClientRequest::SetSessionConfigOptionRequest(request) => json!({\n                        "configOptions": fixture_config_options_with(\n                            &request.config_id.to_string(),\n                            request.value.as_ref(),\n                        ),\n                    }),\n'''
          for path, error_type in conversions:
              text = path.read_text()
              replacement = f'''                    ClientRequest::SetSessionConfigOptionRequest(request) => {{\n                        let value = serde_json::to_value(&request.value)\n                            .map_err({error_type}::into_internal_error)?;\n                        json!({{\n                            "configOptions": fixture_config_options_with(\n                                &request.config_id.to_string(),\n                                &value,\n                            ),\n                        }})\n                    }}\n'''
              if old in text:
                  text = text.replace(old, replacement, 1)
              elif old_compact in text:
                  text = text.replace(old_compact, replacement, 1)
              else:
                  raise SystemExit(f'expected config-option arm not found in {path}')
              path.write_text(text)

          provider = Path('rust/crates/phenix-ui-lua/src/provider.rs')
          text = provider.read_text()
          old_config = '''phenix.acp.configure({\n  definition_id = "phenix.harness",\n  router = "router.mixed",\n  backend = { id = "pi", command = "pi-acp" },\n  root = {\n    tree_id = "tree-frontend",\n    role = "coordinator",\n    objective = "Interactive tree",\n  },\n})\n'''
          new_config = '''phenix.acp.configure({\n  definition_id = "phenix.harness",\n  router = "router.mixed",\n  standard_session = {\n    role = "coordinator",\n    difficulty = "d1",\n    objective = "Interactive tree",\n  },\n})\nphenix.acp.backend({ id = "pi", command = "pi-acp" })\n'''
          if old_config not in text:
              raise SystemExit('expected legacy Lua ACP config fixture not found')
          text = text.replace(old_config, new_config, 1)
          old_assert = '        assert_eq!(config.backend().id().as_str(), "pi");\n'
          new_assert = '''        assert_eq!(config.backends().len(), 1);\n        assert_eq!(config.backends()[0].id().as_str(), "pi");\n        assert_eq!(\n            config.standard_session().expect("standard session").role().as_str(),\n            "coordinator"\n        );\n'''
          if old_assert not in text:
              raise SystemExit('expected singular backend assertion not found')
          provider.write_text(text.replace(old_assert, new_assert, 1))

          gateway = Path('rust/crates/phenix-acp/src/runtime/gateway.rs')
          text = gateway.read_text()
          old_parameter = '        workflow: Option<WorkflowId>,\n        mode: AttachMode,\n'
          if text.count(old_parameter) != 1:
              raise SystemExit('expected one generic attachment workflow parameter')
          text = text.replace(old_parameter, '        mode: AttachMode,\n', 1)
          old_call = '            objective.into(),\n            None,\n            AttachMode::'
          if text.count(old_call) != 4:
              raise SystemExit(f'expected four generic attachment callers, found {text.count(old_call)}')
          text = text.replace(old_call, '            objective.into(),\n            AttachMode::')
          old_route = '''                objective: objective.clone(),\n                workflow,\n                available_backends: backend_ids(&definition),\n'''
          if text.count(old_route) != 1:
              raise SystemExit('expected generic attachment routing workflow field')
          text = text.replace(
              old_route,
              '''                objective: objective.clone(),\n                workflow: None,\n                available_backends: backend_ids(&definition),\n''',
              1,
          )
          old_backend = '''        let factory = self\n            .backends\n            .get(&backend)\n            .ok_or_else(|| GatewayError::MissingBackend(backend))?;\n'''
          new_backend = '''        let factory = self\n            .backends\n            .get(&backend)\n            .ok_or(GatewayError::MissingBackend(backend))?;\n'''
          if old_backend not in text:
              raise SystemExit('expected lazy missing-backend lookup')
          gateway.write_text(text.replace(old_backend, new_backend, 1))

          tui_config = Path('rust/crates/phenix-tui/src/acp_config.rs')
          text = tui_config.read_text()
          old_test_import = '''#[cfg(test)]\nmod tests {\n    use super::*;\n\n'''
          if old_test_import not in text:
              raise SystemExit('expected unused ACP config test import')
          tui_config.write_text(text.replace(old_test_import, '#[cfg(test)]\nmod tests {\n', 1))

          subscriptions = Path('rust/crates/phenix-conductor/src/subscriptions.rs')
          text = subscriptions.read_text()
          old_bind = 'runtime.lock().map_err(|_| ()).and_then(|mut runtime| {'
          if old_bind not in text:
              raise SystemExit('expected subscription and_then')
          text = text.replace(old_bind, 'runtime.lock().map_err(|_| ()).map(|mut runtime| {', 1)
          old_return = '''                Ok(())\n            });\n            if runtime_result.is_err() {\n'''
          new_return = '''                ()\n            });\n            if runtime_result.is_err() {\n'''
          if old_return not in text:
              raise SystemExit('expected subscription unit result')
          subscriptions.write_text(text.replace(old_return, new_return, 1))
          PY
          cd rust
          cargo fmt --all
      - name: Rust check and refresh lockfile
        run: cargo check --workspace --all-targets
        working-directory: rust
      - name: Rust clippy with committed dependency graph
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: rust
      - name: Rust tests
        run: cargo test --workspace --all-targets --locked
        working-directory: rust
      - name: Commit fixup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: restore ACP workspace compilation'
          git push origin HEAD:refactor/phenix-acp-boundaries-routing-d0-d4
