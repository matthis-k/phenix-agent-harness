name: Verify rich transcript baseline

on:
  push:
    branches:
      - refactor/rich-transcript-blocks

permissions:
  contents: read

jobs:
  conductor-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: main
      - name: Run failing conductor integration test on main
        working-directory: rust
        run: cargo test -p phenix-conductor --test black_box_model_tool_loop --locked
