name: Apply unified authentication terminal once

on:
  push:
    branches:
      - fix/acp-auth-transcript-errors
    paths:
      - .github/workflows/apply-unified-auth-terminal-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: fix/acp-auth-transcript-errors
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply unified authentication terminal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-unified-auth-terminal.py')
          source = path.read_text()
          old = '                program: invocation.remove(0),\n'
          if source.count(old) != 2:
              raise SystemExit('unexpected ACP auth migration matcher count')
          source = source.replace(old, '                program,\n')
          old = "'''        Some(OverlayState::AuthenticationPrompt { flow_id, .. }) = &state.view.overlay {\n'''"
          new = "'''    if let Some(OverlayState::AuthenticationPrompt { flow_id, .. }) = &state.view.overlay {\n'''"
          if source.count(old) != 1:
              raise SystemExit('unexpected auth cancellation old matcher')
          source = source.replace(old, new, 1)
          old = "'''        Some(OverlayState::AuthenticationPrompt { flow_id, .. })\n        | Some(OverlayState::AuthenticationTerminal { flow_id }) = &state.view.overlay {\n'''"
          new = "'''    if let Some(\n        OverlayState::AuthenticationPrompt { flow_id, .. }\n        | OverlayState::AuthenticationTerminal { flow_id },\n    ) = &state.view.overlay\n    {\n'''"
          if source.count(old) != 1:
              raise SystemExit('unexpected auth cancellation replacement matcher')
          path.write_text(source.replace(old, new, 1))
          PY
          python3 .github/scripts/apply-unified-auth-terminal.py
          cargo fmt --manifest-path rust/Cargo.toml --all
          set +e
          cargo check --manifest-path rust/Cargo.toml --workspace --all-targets
          check_status=$?
          set -e
          echo "Initial compile status: ${check_status}"
          rm .github/scripts/apply-unified-auth-terminal.py
          rm .github/workflows/apply-unified-auth-terminal-once.yml
          git add rust src headless docs .github/scripts/apply-unified-auth-terminal.py .github/workflows/apply-unified-auth-terminal-once.yml 2>/dev/null || true
          git add -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(auth): embed backend authentication terminals"
          git push origin HEAD:fix/acp-auth-transcript-errors
