name: Fix unversioned routing wording

on:
  push:
    branches:
      - cleanup/unversioned-interfaces

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[unversioned-doc]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: cleanup/unversioned-interfaces
      - name: Update wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/INTERFACES.md')
          text = path.read_text()
          old = 'selected by the versioned routing policy'
          new = 'selected by the routing policy'
          if old not in text:
              raise SystemExit('Expected wording not found')
          path.write_text(text.replace(old, new))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/INTERFACES.md
          git commit -m 'Remove versioned routing wording [unversioned-doc]'
          git push origin HEAD:cleanup/unversioned-interfaces
