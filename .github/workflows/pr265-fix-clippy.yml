name: PR 265 validate lint fix

on:
  push:
    branches:
      - fix/workflow-ownership-issue-227

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: fix/workflow-ownership-issue-227
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Apply typed workflow attach API
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/pr265-diagnostics"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/pr265-diagnostics/patch.log"
          from pathlib import Path
          import re

          workflow = Path('rust/crates/phenix-acp/src/runtime/workflow.rs')
          text = workflow.read_text()
          text, count = re.subn(
              r'\n    pub fn terminal\(&self\) -> Option<&WorkflowTerminal> \{\n        self\.terminal\.as_ref\(\)\n    \}\n',
              '\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one dead terminal method, removed {count}')
          workflow.write_text(text)

          gateway = Path('rust/crates/phenix-acp/src/runtime/gateway.rs')
          text = gateway.read_text()
          marker = '#[derive(Clone, Default)]\npub struct PhenixAcpGatewayBuilder {'
          attach_struct = '\n'.join([
              '#[derive(Clone, Debug, Eq, PartialEq)]',
              'pub struct WorkflowNodeAttach {',
              '    pub workflow_id: WorkflowId,',
              '    pub objective_id: ObjectiveId,',
              '    pub parent_node: SessionNodeId,',
              '    pub role: RoleId,',
              '    pub difficulty: Option<Difficulty>,',
              '    pub objective: String,',
              '}',
              '',
              '#[derive(Clone, Default)]',
              'pub struct PhenixAcpGatewayBuilder {',
          ])
          if marker not in text:
              raise SystemExit('gateway builder marker not found')
          text = text.replace(marker, attach_struct, 1)

          old_signature = '\n'.join([
              '    pub fn attach_workflow_node(',
              '        &mut self,',
              '        tree_id: &SessionTreeId,',
              '        workflow_id: &WorkflowId,',
              '        workflow_objective: &ObjectiveId,',
              '        parent_node: &SessionNodeId,',
              '        role: RoleId,',
              '        difficulty: Option<Difficulty>,',
              '        objective: impl Into<String>,',
              '    ) -> Result<SessionNodeId, GatewayError> {',
              '        let objective = objective.into();',
          ])
          new_signature = '\n'.join([
              '    pub fn attach_workflow_node(',
              '        &mut self,',
              '        tree_id: &SessionTreeId,',
              '        request: WorkflowNodeAttach,',
              '    ) -> Result<SessionNodeId, GatewayError> {',
              '        let WorkflowNodeAttach {',
              '            workflow_id,',
              '            objective_id: workflow_objective,',
              '            parent_node,',
              '            role,',
              '            difficulty,',
              '            objective,',
              '        } = request;',
          ])
          if old_signature not in text:
              raise SystemExit('old attach_workflow_node signature not found')
          text = text.replace(old_signature, new_signature, 1)

          edits = [
              ('tree.active_workflow.as_ref() != Some(workflow_id)', 'tree.active_workflow.as_ref() != Some(&workflow_id)'),
              ('tree.objectives.contains_key(workflow_objective)', 'tree.objectives.contains_key(&workflow_objective)'),
              ('.get(parent_node)', '.get(&parent_node)'),
              ('if parent_node == &root_node {', 'if parent_node == root_node {'),
          ]
          for before, after in edits:
              if before not in text:
                  raise SystemExit(f'gateway edit target missing: {before!r}')
              text = text.replace(before, after, 1)
          gateway.write_text(text)

          runtime_mod = Path('rust/crates/phenix-acp/src/runtime/mod.rs')
          text = runtime_mod.read_text()
          before = 'pub use gateway::{PhenixAcpGateway, PhenixAcpGatewayBuilder};'
          after = 'pub use gateway::{PhenixAcpGateway, PhenixAcpGatewayBuilder, WorkflowNodeAttach};'
          if before not in text:
              raise SystemExit('runtime gateway export not found')
          runtime_mod.write_text(text.replace(before, after, 1))

          conductor = Path('rust/crates/phenix-acp/src/conductor.rs')
          text = conductor.read_text()
          before = 'SessionTreeGet, SessionTreeId, SessionTreeList, WorkflowAction, WorkflowGraph, WorkflowId,\n    WorkflowStart, WorkflowStartParams, WorkflowStartResult,'
          after = 'SessionTreeGet, SessionTreeId, SessionTreeList, WorkflowAction, WorkflowGraph, WorkflowId,\n    WorkflowNodeAttach, WorkflowStart, WorkflowStartParams, WorkflowStartResult,'
          if before not in text:
              raise SystemExit('conductor import target not found')
          text = text.replace(before, after, 1)

          old_call = '\n'.join([
              '                        let node_id = self.gateway.attach_workflow_node(',
              '                            tree_id,',
              '                            &run.workflow_id,',
              '                            &run.objective_id,',
              '                            &run.root_node_id,',
              '                            role,',
              '                            Some(run.difficulty),',
              '                            objective.clone(),',
              '                        )?;',
          ])
          new_call = '\n'.join([
              '                        let node_id = self.gateway.attach_workflow_node(',
              '                            tree_id,',
              '                            WorkflowNodeAttach {',
              '                                workflow_id: run.workflow_id.clone(),',
              '                                objective_id: run.objective_id.clone(),',
              '                                parent_node: run.root_node_id.clone(),',
              '                                role,',
              '                                difficulty: Some(run.difficulty),',
              '                                objective: objective.clone(),',
              '                            },',
              '                        )?;',
          ])
          if old_call not in text:
              raise SystemExit('conductor attach call not found')
          conductor.write_text(text.replace(old_call, new_call, 1))
          PY
          patch_status=${PIPESTATUS[0]}
          if [ "$patch_status" -ne 0 ]; then exit "$patch_status"; fi
          cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Strict Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/pr265-diagnostics/clippy.log"
      - name: Full Rust tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked 2>&1 | tee "$RUNNER_TEMP/pr265-diagnostics/tests.log"
      - name: Commit validated fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/phenix-acp/src/runtime/workflow.rs rust/crates/phenix-acp/src/runtime/gateway.rs rust/crates/phenix-acp/src/runtime/mod.rs rust/crates/phenix-acp/src/conductor.rs
          git -c core.hooksPath=/dev/null -c commit.gpgSign=false commit --no-verify -m "fix: type workflow node attachment"
          git push origin HEAD:fix/workflow-ownership-issue-227
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr265-lint-fix-diagnostics
          path: ${{ runner.temp }}/pr265-diagnostics
          if-no-files-found: warn
