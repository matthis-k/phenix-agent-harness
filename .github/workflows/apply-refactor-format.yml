name: Apply refactor formatting

on:
  push:
    branches:
      - refactor/execution-runtime-boundaries

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Apply deterministic formatter output
        run: |
          python - <<'PY'
          from pathlib import Path

          execution = Path("modules/phenix-pi/application/execution-facade.ts")
          text = execution.read_text()
          old = '''      .sort(
                (left, right) => this.admission.depthOf(right.id) - this.admission.depthOf(left.id),
              );'''
          new = '''      .sort((left, right) => this.admission.depthOf(right.id) - this.admission.depthOf(left.id));'''
          if text.count(old) != 2:
              raise SystemExit(f"expected two execution sort blocks, found {text.count(old)}")
          execution.write_text(text.replace(old, new))

          admission = Path("modules/phenix-pi/application/run-admission-policy.ts")
          text = admission.read_text()
          old_imports = '''import type {
            CompiledRunSpec,
            RunLimits,
            RunRecord,
            RunRetryOptions,
            StartRun,
            WorkflowCausation,
          } from "../domain/run/model.ts";
          import type { DefinitionId, RunId } from "../domain/shared.ts";
          import { isTerminalRunState } from "../domain/run/invariants.ts";'''
          new_imports = '''import { isTerminalRunState } from "../domain/run/invariants.ts";
          import type {
            CompiledRunSpec,
            RunLimits,
            RunRecord,
            RunRetryOptions,
            StartRun,
            WorkflowCausation,
          } from "../domain/run/model.ts";
          import type { DefinitionId, RunId } from "../domain/shared.ts";'''
          if old_imports not in text:
              raise SystemExit("admission import block did not match")
          text = text.replace(old_imports, new_imports)
          old_workflow = '''    const workflow = this.catalog.require(parent.definitionId) as WorkflowDefinition<unknown, unknown>;'''
          new_workflow = '''    const workflow = this.catalog.require(parent.definitionId) as WorkflowDefinition<
              unknown,
              unknown
            >;'''
          if old_workflow not in text:
              raise SystemExit("admission workflow cast did not match")
          admission.write_text(text.replace(old_workflow, new_workflow))
          PY
      - name: Commit formatter output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/phenix-pi/application/execution-facade.ts modules/phenix-pi/application/run-admission-policy.ts
          git diff --cached --check
          git commit -m "Apply refactor formatter output"
          git push
