name: Apply budget sync scope

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/session-budget-mode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/session-budget-mode
      - name: Apply scoped synchronization
        run: |
          python scripts/apply_budget_sync_scope.py
          git diff --check
      - name: Commit clean result
        run: |
          rm scripts/apply_budget_sync_scope.py
          rm .github/workflows/apply-budget-sync-scope.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Scope budget synchronization to Phenix models"
          git push origin HEAD:feat/session-budget-mode
