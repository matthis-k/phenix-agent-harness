name: Patch native clear handling

on:
  push:
    branches:
      - ui/turn-steering-interrupt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ui/turn-steering-interrupt
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workspace = Path("modules/phenix-pi/extension/phenix-workspace.ts")
          text = workspace.read_text()
          method = '''  hasTranscriptSelection(): boolean {
    return this.transcriptSelection.selection !== undefined;
  }

'''
          marker = '  refreshRootTranscript(): void {\n'
          if method not in text:
              if marker not in text:
                  raise SystemExit("refresh marker not found")
              text = text.replace(marker, method + marker, 1)
          workspace.write_text(text)

          extension = Path("modules/phenix-pi/extension/default-workspace-extension.ts")
          text = extension.read_text()
          accept = '''      accept: (delegation) =>
        delegation.action !== "app.clear" || !activeWorkspace.hasTranscriptSelection(),
'''
          marker = '      keybindings: activeKeybindings,\n'
          if accept not in text:
              if marker not in text:
                  raise SystemExit("keybindings marker not found")
              text = text.replace(marker, marker + accept, 1)
          extension.write_text(text)
          PY
          rm .github/workflows/patch-native-clear-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Preserve clear and transcript copy semantics"
          git push origin HEAD:ui/turn-steering-interrupt
