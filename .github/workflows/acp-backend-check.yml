name: ACP backend check

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/acp-backend-check.yml
      - rust/**

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@4305c38b25d97ef35a8ad1f985ccf2d2242004f2
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply ACP SDK type fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("rust/crates/phenix-acp-backend/src/lib.rs")
          content = path.read_text()

          replacements = [
              (
                  ".connect_with(agent, move |cx| async move {",
                  ".connect_with(agent, move |cx: ConnectTo<Agent>| async move {",
              ),
              (
                  "async fn run_session<Link>(",
                  "async fn run_session<'a>(",
              ),
              (
                  "agent_client_protocol::ActiveSession<'static, Link>",
                  "agent_client_protocol::ActiveSession<'a, ConnectTo<Agent>>",
              ),
              (
                  "fn handle_request<Link>(",
                  "fn handle_request<'a>(",
              ),
              (
                  ") -> Result<(), BackendError>\nwhere\n    Link: agent_client_protocol::role::HasPeer<Agent>,\n{",
                  ") -> Result<(), BackendError> {",
              ),
              (
                  ") -> Result<bool, BackendError>\nwhere\n    Link: agent_client_protocol::role::HasPeer<Agent>,\n{",
                  ") -> Result<bool, BackendError> {",
              ),
              (
                  "state.append_assistant_text(&text.text, outputs)?;",
                  "state\n                            .append_assistant_text(&text.text, outputs)\n                            .map_err(to_acp_error)?;",
              ),
          ]

          for old, new in replacements:
              if old in content:
                  content = content.replace(old, new, 1)
              elif new not in content:
                  raise SystemExit(f"missing replacement anchor: {old}")

          path.write_text(content)
          PY
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Commit generated Rust files
        run: |
          if ! git diff --quiet -- rust; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add rust
            git commit -m "fix official ACP connection types"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - name: Check
        run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked
