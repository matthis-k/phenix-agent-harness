name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Apply CI repair
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: fix/ci-baseline-regressions

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with: { name: devenv }

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Apply source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              target = root / path
              source = target.read_text()
              count = source.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}")
              target.write_text(source.replace(old, new))

          replace(
              'rust/crates/phenix-conductor/src/lib.rs',
              'use serde::{Deserialize, Serialize};',
              'use serde::Deserialize;',
          )
          replace(
              'rust/crates/phenix-tui/src/terminal_media.rs',
              'payload.len() % 4 == 0',
              'payload.len().is_multiple_of(4)',
          )
          replace(
              'rust/crates/phenix-ui-runtime/tests/multiline_input.rs',
              '''struct EmptyProvider {
              config: FrontendConfig,
          }

          impl Default for EmptyProvider {
              fn default() -> Self {
                  Self {
                      config: FrontendConfig::default(),
                  }
              }
          }''',
              '''#[derive(Default)]
          struct EmptyProvider {
              config: FrontendConfig,
          }''',
          )
          replace(
              'rust/crates/phenix-ui-runtime/src/consumers.rs',
              '''        let mut state = AppState::default();
                  state.exit_requested = true;''',
              '''        let state = AppState {
                      exit_requested: true,
                      ..Default::default()
                  };''',
          )
          replace(
              'rust/crates/phenix-ui-runtime/src/runtime.rs',
              '''        let mut state = AppState::default();
                  state.root_run = Some(run_id.clone());
                  state.selected_run = Some(run_id.clone());''',
              '''        let mut state = AppState {
                      root_run: Some(run_id.clone()),
                      selected_run: Some(run_id.clone()),
                      ..Default::default()
                  };''',
          )
          replace(
              'rust/crates/phenix-ui-runtime/src/runtime.rs',
              '''        let mut state = AppState::default();
                  state.root_run = Some(run_id.clone());''',
              '''        let mut state = AppState {
                      root_run: Some(run_id.clone()),
                      ..Default::default()
                  };''',
          )

          renderer = root / 'rust/crates/phenix-tui/src/renderer.rs'
          source = renderer.read_text()
          old = '''    fn visible_png_media_is_projected_to_terminal_coordinates() {
              let run_id = RunId::parse("run-image").expect("run id");
              let mut state = AppState::default();
              state.root_run = Some(run_id.clone());
              state.selected_run = Some(run_id.clone());'''
          new = '''    fn visible_png_media_is_projected_to_terminal_coordinates() {
              let run_id = RunId::parse("run-image").expect("run id");
              let mut state = AppState {
                  root_run: Some(run_id.clone()),
                  selected_run: Some(run_id.clone()),
                  ..Default::default()
              };'''
          if source.count(old) != 1:
              raise SystemExit('renderer: image fixture pattern mismatch')
          renderer.write_text(source.replace(old, new))

          transcript = root / 'rust/crates/phenix-tui/src/transcript.rs'
          source = transcript.read_text()
          old = '''        let mut state = AppState::default();
                  state.root_run = Some(run_id.clone());
                  state.selected_run = Some(run_id.clone());'''
          new = '''        let mut state = AppState {
                      root_run: Some(run_id.clone()),
                      selected_run: Some(run_id.clone()),
                      ..Default::default()
                  };'''
          if source.count(old) != 5:
              raise SystemExit(f'transcript: expected 5 fixture patterns, found {source.count(old)}')
          source = source.replace(old, new)
          source = source.replace(
              '            views: vec![RichBlockView::Source, RichBlockView::Rendered],\n',
              '',
          )
          transcript.write_text(source)

          rich = root / 'rust/crates/phenix-tui/src/rich_document.rs'
          source = rich.read_text()
          source = source.replace(
              '''use phenix_ui_core::{
              parse_markdown, RichBlock, RichBlockView, RichCodeBlock, RichDocument, RichImage, RichSpan,
              RichTable, RichText,
          };''',
              '''use phenix_ui_core::{
              RichBlock, RichBlockView, RichCodeBlock, RichDocument, RichImage, RichSpan, RichTable, RichText,
          };''',
          )
          source = source.replace('    pub views: Vec<RichBlockView>,\n', '')
          source = source.replace(
              '''
          impl RenderedRichBlock {
              pub fn height(&self) -> usize {
                  self.lines.len()
              }
          }

          pub(crate) fn render_markdown(text: &str, width: u16, theme: &ThemeConfig) -> Vec<Line<'static>> {
              flatten_blocks(render_document(&parse_markdown(text), width, theme, |_| {
                  None
              }))
          }
          ''',
              '\n',
          )
          source = source.replace(
              '''
          pub(crate) fn flatten_blocks(blocks: Vec<RenderedRichBlock>) -> Vec<Line<'static>> {
              let mut lines = Vec::new();
              for (index, block) in blocks.into_iter().enumerate() {
                  if index > 0 {
                      lines.push(Line::default());
                  }
                  lines.extend(block.lines);
              }
              lines
          }
          ''',
              '\n',
          )
          source = source.replace('render_heading(*level, content, active_view, views, width, theme)', 'render_heading(*level, content, active_view, width, theme)')
          source = source.replace(
              '''    active_view: RichBlockView,
              views: Vec<RichBlockView>,
              width: usize,
              theme: &ThemeConfig,
          ) -> RenderedRichBlock {
              let depth''',
              '''    active_view: RichBlockView,
              width: usize,
              theme: &ThemeConfig,
          ) -> RenderedRichBlock {
              let depth''',
              1,
          )
          source = source.replace('RichBlock::Rule => render_rule(active_view, views, width, theme),', 'RichBlock::Rule => render_rule(active_view, width, theme),')
          source = source.replace(
              '''fn render_rule(
              active_view: RichBlockView,
              views: Vec<RichBlockView>,
              width: usize,''',
              '''fn render_rule(
              active_view: RichBlockView,
              width: usize,''',
          )
          source = source.replace('\n            views,\n            active_view,', '\n            active_view,')
          source = source.replace('\n        views,\n        active_view,', '\n        active_view,')
          source = source.replace(
              '''    RenderedRichBlock {
              lines,
              views,
              active_view: RichBlockView::Rendered,''',
              '''    RenderedRichBlock {
              lines,
              active_view: RichBlockView::Rendered,''',
          )
          source = source.replace(
              '''        assert_eq!(
              blocks[0].views,
              vec![RichBlockView::Dense, RichBlockView::Grid]
          );''',
              '''        assert_eq!(
              document.blocks[0].candidate_views(),
              &[RichBlockView::Dense, RichBlockView::Grid]
          );''',
          )
          source = source.replace(
              '''        assert_eq!(
              blocks[0].views,
              vec![
                  RichBlockView::Source,
                  RichBlockView::Highlighted,
                  RichBlockView::Rendered,
              ]
          );''',
              '''        assert_eq!(
              document.blocks[0].candidate_views(),
              &[
                  RichBlockView::Source,
                  RichBlockView::Highlighted,
                  RichBlockView::Rendered,
              ]
          );''',
          )
          source = source.replace('blocks[0].height()', 'blocks[0].lines.len()')
          source = source.replace('mod tests {\n    use super::*;', 'mod tests {\n    use super::*;\n    use phenix_ui_core::parse_markdown;')
          rich.write_text(source)

          maintenance = root / 'rust/maintenance.nix'
          source = maintenance.read_text()
          source = source.replace(
              '''let
            repositoryRoot = ''repo_root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"; cd "$repo_root/rust"'';
          in''',
              '''let
            repositoryRoot = ''repo_root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"; cd "$repo_root/rust"'';
            cargoEnvironment = ''
              export CARGO_HOME="$TMPDIR/phenix-cargo-home"
              export CARGO_TARGET_DIR="$TMPDIR/phenix-cargo-target"
            '';
          in''',
          )
          old = '        export CARGO_HOME="$TMPDIR/phenix-cargo-home"'
          if source.count(old) != 4:
              raise SystemExit(f'maintenance: expected 4 cargo env occurrences, found {source.count(old)}')
          maintenance.write_text(source.replace(old, '        ${cargoEnvironment}'))
          PY

          devenv tasks run maintenance:fix:rust-format --mode single
          devenv tasks run maintenance:fix:format --mode single

          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            pull_request:
            push:
              branches:
                - main
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: ci-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            checks:
              if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
              name: Maintenance checks
              runs-on: ubuntu-latest
              timeout-minutes: 90
              steps:
                - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

                - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
                  with:
                    github_access_token: ${{ secrets.GITHUB_TOKEN }}
                    extra_nix_config: |
                      experimental-features = nix-command flakes
                      accept-flake-config = true
                      max-jobs = auto

                - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
                  with: { name: devenv }

                - name: Install devenv
                  id: install-devenv
                  run: nix profile add nixpkgs#devenv

                - name: Formatting
                  if: ${{ !cancelled() && steps.install-devenv.outcome == 'success' }}
                  shell: bash
                  run: |
                    set -o pipefail
                    mkdir -p "$RUNNER_TEMP/ci-diagnostics"
                    devenv tasks run maintenance:format 2>&1 | tee "$RUNNER_TEMP/ci-diagnostics/format.log"

                - name: Rust compile / check
                  if: ${{ !cancelled() && steps.install-devenv.outcome == 'success' }}
                  run: devenv tasks run maintenance:rust-compile --mode single

                - name: Rust lint
                  if: ${{ !cancelled() && steps.install-devenv.outcome == 'success' }}
                  shell: bash
                  run: |
                    set -o pipefail
                    mkdir -p "$RUNNER_TEMP/ci-diagnostics"
                    devenv tasks run maintenance:rust-clippy --mode single 2>&1 | tee "$RUNNER_TEMP/ci-diagnostics/clippy.log"

                - name: Rust tests
                  if: ${{ !cancelled() && steps.install-devenv.outcome == 'success' }}
                  run: devenv tasks run maintenance:rust-tests --mode single

                - name: Nix static analysis
                  if: ${{ !cancelled() && steps.install-devenv.outcome == 'success' }}
                  run: devenv tasks run maintenance:statix --mode single

                - name: GitHub Actions syntax
                  if: ${{ !cancelled() && steps.install-devenv.outcome == 'success' }}
                  run: devenv tasks run maintenance:workflows --mode single

                - name: Required tool availability
                  if: ${{ !cancelled() && steps.install-devenv.outcome == 'success' }}
                  run: devenv tasks run maintenance:tools --mode single

                - name: Nix flake and smoke checks
                  if: ${{ !cancelled() && steps.install-devenv.outcome == 'success' }}
                  shell: bash
                  run: |
                    set -o pipefail
                    mkdir -p "$RUNNER_TEMP/ci-diagnostics"
                    devenv tasks run maintenance:flake --mode single 2>&1 | tee "$RUNNER_TEMP/ci-diagnostics/flake.log"

                - name: Repository remains clean
                  if: ${{ !cancelled() }}
                  shell: bash
                  run: |
                    set -euo pipefail
                    mkdir -p "$RUNNER_TEMP/ci-diagnostics"
                    git diff > "$RUNNER_TEMP/ci-diagnostics/source.diff"
                    git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/ci-diagnostics/status.txt"
                    cat "$RUNNER_TEMP/ci-diagnostics/source.diff"
                    cat "$RUNNER_TEMP/ci-diagnostics/status.txt"
                    test ! -s "$RUNNER_TEMP/ci-diagnostics/source.diff"
                    test ! -s "$RUNNER_TEMP/ci-diagnostics/status.txt"

                - name: Upload CI diagnostics
                  if: failure()
                  uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
                  with:
                    name: ci-diagnostics
                    path: ${{ runner.temp }}/ci-diagnostics
                    if-no-files-found: error
          YAML

          git diff --check
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u
          git commit -m 'fix: make CI maintenance checks clean'
          git push origin HEAD:fix/ci-baseline-regressions
