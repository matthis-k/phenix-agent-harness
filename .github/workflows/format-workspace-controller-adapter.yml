name: Format workspace controller adapter

on:
  push:
    branches: [migration/workspace-controller-adapter]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with: { fetch-depth: 0 }
      - name: Apply canonical source formatting
        run: python .github/format-workspace-controller-adapter.py
      - name: Remove one-shot files
        run: rm .github/format-workspace-controller-adapter.py .github/workflows/format-workspace-controller-adapter.yml
      - name: Validate patch
        run: git diff --check
      - name: Commit formatted source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Format workspace controller adapter"
          git push origin HEAD:migration/workspace-controller-adapter
