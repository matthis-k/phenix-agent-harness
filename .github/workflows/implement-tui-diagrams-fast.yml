name: Finalize TUI diagrams

on:
  push:
    branches: [feat/tui-workflow-diagrams]

permissions:
  contents: write

concurrency:
  group: finalize-tui-diagrams
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: feat/tui-workflow-diagrams

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with: { name: devenv }

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Apply formatter and validate
        shell: bash
        run: |
          devenv tasks run maintenance:fix
          devenv test

      - name: Remove implementation scaffolding
        shell: bash
        run: |
          rm -f \
            .github/implementation-error.txt \
            .github/tui-diagram-trigger \
            .github/workflows/implement-tui-diagrams.yml \
            .github/workflows/implement-tui-diagrams-pr.yml \
            .github/workflows/implement-tui-diagrams-fast.yml \
            .github/scripts/integrate_tui_diagrams.py
          rmdir .github/scripts 2>/dev/null || true

      - name: Commit finalized implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --stat
          git commit -m "Finalize Mermaid TUI rendering [skip ci]"
          git push origin HEAD:feat/tui-workflow-diagrams
