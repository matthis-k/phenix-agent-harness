name: Apply PR 232 formatter output

on:
  push:
    branches:
      - fix/workflow-failure-classification

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage PR 232 formatter patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/apply-pr232-format.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Apply formatter output to workflow failure tests"
          git push origin HEAD:fix/workflow-failure-classification
