name: Agent remove dead execution helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Remove obsolete helper
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('rust/crates/phenix-conductor/src/server.rs')
          content = path.read_text()
          pattern = r'''\n    fn fail_execution\(\n        &self,\n        execution_id: &ExecutionId,\n        error: ProtocolError,\n    \) -> Result<\(\), ServerError> \{\n        let mut runtime = self\.lock_runtime\(\)\?;\n        fail_runtime_execution\(&mut runtime, execution_id, error\)\?;\n        Ok\(\(\)\)\n    \}\n'''
          updated, count = re.subn(pattern, '\n', content, count=1)
          if count != 1:
              raise SystemExit(f'expected one obsolete fail_execution method, found {count}')
          path.write_text(updated)
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check
      - name: Commit product change
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/phenix-conductor/src/server.rs
          git commit -m 'refactor: remove obsolete execution failure helper'
          git pull --rebase origin "${GITHUB_HEAD_REF}"
          git push origin HEAD:"${GITHUB_HEAD_REF}"
