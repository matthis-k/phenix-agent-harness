name: Finalize memory model interface

on:
  push:
    branches: [feature/phenix-memory]

permissions:
  contents: write

concurrency:
  group: finalize-memory-interface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with: { fetch-depth: 0 }
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with: { name: devenv }
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Expose memory contract to every model
        env:
          PATCH_SCRIPT_B64: 
        run: printf '%s' "$PATCH_SCRIPT_B64" | base64 --decode | python
      - name: Apply repository maintenance fixes
        run: devenv tasks run maintenance:fix
      - name: Preserve repository lock pins
        run: git checkout -- devenv.lock
      - name: Remove one-shot workflow
        run: rm .github/workflows/finalize-memory-model-interface.yml
      - name: Commit model interface
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "feat(memory): expose memory contract to all models"
          git push origin HEAD:feature/phenix-memory
