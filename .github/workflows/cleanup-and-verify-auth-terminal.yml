name: Remove tracked Rust build output once

on:
  push:
    branches:
      - fix/acp-auth-transcript-errors
    paths:
      - .github/workflows/cleanup-and-verify-auth-terminal.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: fix/acp-auth-transcript-errors
          fetch-depth: 1
      - name: Remove generated Rust output
        shell: bash
        run: |
          set -euo pipefail

          git rm -r -q --ignore-unmatch rust/target
          rm -rf rust/target

          python3 - <<'PY'
          from pathlib import Path
          path = Path('.gitignore')
          source = path.read_text()
          rule = '/rust/target/'
          if rule not in source.splitlines():
              if '/target/\n' in source:
                  source = source.replace('/target/\n', '/target/\n/rust/target/\n', 1)
              else:
                  source += '\n/rust/target/\n'
              path.write_text(source)
          PY

          rm .github/workflows/cleanup-and-verify-auth-terminal.yml
          git add .gitignore
          git add -u .github/workflows/cleanup-and-verify-auth-terminal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(rust): remove tracked build output"
          git push --quiet origin HEAD:fix/acp-auth-transcript-errors
