name: Transaction sandbox repair

on:
  push:
    branches:
      - agent/grill-09-transactional-bash

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[transaction-sandbox-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: agent/grill-09-transactional-bash
          fetch-depth: 0

      - name: Replace namespace handoff with trusted controller
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("rust/crates/phenix-conductor/src/transaction.rs")
          text = path.read_text()

          text = text.replace(
              "use std::fs::{self, File, OpenOptions};\nuse std::io::Read;\nuse std::path::{Path, PathBuf};\nuse std::process::{Child, Command, Stdio};\nuse std::sync::atomic::{AtomicU64, Ordering};\nuse std::thread;\nuse std::time::{Duration, SystemTime, UNIX_EPOCH};",
              "use std::fs;\nuse std::path::{Path, PathBuf};\nuse std::process::Command;\nuse std::sync::atomic::{AtomicU64, Ordering};\nuse std::time::{SystemTime, UNIX_EPOCH};",
          )

          constants_start = text.index('const SANDBOX_RELEASE: &str =')
          constants_end = text.index('static NEXT_TRANSACTION_ID:', constants_start)
          constants = r'''const SANDBOX_SNAPSHOT: &str = "/tmp/phenix-transaction-snapshot";
          const SANDBOX_EXCLUDES: &str = "/tmp/phenix-transaction-excludes";
          const SANDBOX_INNER_STATUS: &str = "/tmp/phenix-transaction-inner-status";
          const SANDBOX_RESULT_STATUS: &str = "/tmp/phenix-transaction-result-status";
          const COMMAND_SCRIPT: &str = r#"
          bwrap_path=$1
          bash_path=$2
          rsync_path=$3
          workspace=$4
          snapshot=$5
          excludes=$6
          inner_status=$7
          result_status=$8
          user_command=$9

          : > "$result_status"
          exec 3> "$inner_status"

          command_status=0
          "$bwrap_path" \
            --die-with-parent \
            --ro-bind / / \
            --dev-bind /dev /dev \
            --proc /proc \
            --tmpfs /tmp \
            --bind "$workspace" "$workspace" \
            --unshare-pid \
            --cap-drop ALL \
            --chdir "$workspace" \
            --setenv TMPDIR /tmp \
            --json-status-fd 3 \
            -- "$bash_path" -c "$user_command" </dev/null || command_status=$?

          exec 3>&-

          command_started=0
          while IFS= read -r status_line; do
            case "$status_line" in
              *'"exit-code"'*) command_started=1 ;;
            esac
          done < "$inner_status"

          if [ "$command_started" -ne 1 ]; then
            exit "$command_status"
          fi

          "$rsync_path" \
            -rlpt \
            --delete \
            --delete-delay \
            --delay-updates \
            --quiet \
            --exclude-from "$excludes" \
            "$workspace/." \
            "$snapshot/." || { snapshot_status=$?; exit "$snapshot_status"; }

          printf '%s\n' "$command_status" > "$result_status"
          "#;

          '''
          constants = "\n".join(line.removeprefix("          ") for line in constants.splitlines()) + "\n"
          text = text[:constants_start] + constants + text[constants_end:]

          execute_start = text.index("    pub fn execute(")
          execute_end = text.index("    pub fn commit(", execute_start)
          execute = r'''    pub fn execute(
              &self,
              bash: &OsStr,
              command: &str,
          ) -> Result<TransactionOutput, TransactionError> {
              let bwrap = std::env::var_os("PHENIX_BWRAP").unwrap_or_else(|| OsString::from("bwrap"));
              let output = self
                  .sandbox_command(&bwrap, &self.paths.command_work)
                  .arg("--uid")
                  .arg("0")
                  .arg("--gid")
                  .arg("0")
                  .arg("--cap-add")
                  .arg("ALL")
                  .arg("--bind")
                  .arg(&self.paths.snapshot)
                  .arg(SANDBOX_SNAPSHOT)
                  .arg("--ro-bind")
                  .arg(&self.paths.excludes)
                  .arg(SANDBOX_EXCLUDES)
                  .arg("--bind")
                  .arg(&self.paths.inner_status)
                  .arg(SANDBOX_INNER_STATUS)
                  .arg("--bind")
                  .arg(&self.paths.result_status)
                  .arg(SANDBOX_RESULT_STATUS)
                  .arg("--")
                  .arg(bash)
                  .arg("-c")
                  .arg(COMMAND_SCRIPT)
                  .arg("phenix-transaction")
                  .arg(&bwrap)
                  .arg(bash)
                  .arg(&self.rsync)
                  .arg(self.consistency.root())
                  .arg(SANDBOX_SNAPSHOT)
                  .arg(SANDBOX_EXCLUDES)
                  .arg(SANDBOX_INNER_STATUS)
                  .arg(SANDBOX_RESULT_STATUS)
                  .arg(command)
                  .output()
                  .map_err(|source| TransactionError::Spawn {
                      program: PathBuf::from(&bwrap),
                      source,
                  })?;
              if !output.status.success() {
                  return Err(TransactionError::SandboxFailed {
                      exit_code: output.status.code().unwrap_or(-1),
                      stderr: String::from_utf8_lossy(&output.stderr).into_owned(),
                  });
              }

              let status = fs::read_to_string(&self.paths.result_status).map_err(|source| {
                  TransactionError::Io {
                      path: self.paths.result_status.clone(),
                      source,
                  }
              })?;
              let exit_code = match status.trim().parse::<i32>() {
                  Ok(code) if (0..=255).contains(&code) => code,
                  _ => {
                      return Err(TransactionError::InvalidSandboxStatus {
                          path: self.paths.result_status.clone(),
                          value: status,
                      });
                  }
              };

              Ok(TransactionOutput {
                  exit_code,
                  stdout: output.stdout,
                  stderr: output.stderr,
              })
          }

          '''
          execute = "\n".join(line.removeprefix("          ") for line in execute.splitlines()) + "\n"
          text = text[:execute_start] + execute + text[execute_end:]

          text = text.replace(
              '            .arg("--tmpfs")\n            .arg(&self.paths.root)\n',
              '',
          )

          methods_start = text.index("    fn capture_user_namespace(")
          paths_start = text.index("#[derive(Debug)]\nstruct TransactionPaths", methods_start)
          text = text[:methods_start] + "}\n\n" + text[paths_start:]

          text = text.replace(
              '''struct TransactionPaths {
              root: PathBuf,
              upper: PathBuf,
              command_work: PathBuf,
              snapshot_work: PathBuf,
              snapshot: PathBuf,
              excludes: PathBuf,
              info: PathBuf,
              release: PathBuf,
          }'''.replace("              ", ""),
              '''struct TransactionPaths {
              root: PathBuf,
              upper: PathBuf,
              command_work: PathBuf,
              snapshot: PathBuf,
              excludes: PathBuf,
              inner_status: PathBuf,
              result_status: PathBuf,
          }'''.replace("              ", ""),
          )

          text = text.replace(
              '''                    let upper = root.join("upper");
                              let command_work = root.join("command-work");
                              let snapshot_work = root.join("snapshot-work");
                              let snapshot = root.join("snapshot");
                              for path in [&upper, &command_work, &snapshot_work, &snapshot] {
                                  fs::create_dir(path).map_err(|source| TransactionError::Io {
                                      path: path.clone(),
                                      source,
                                  })?;
                              }
                              let info = root.join("info");
                              let release = root.join("release");
                              for path in [&info, &release] {
                                  fs::write(path, b"").map_err(|source| TransactionError::Io {
                                      path: path.clone(),
                                      source,
                                  })?;
                              }
                              return Ok(Self {
                                  excludes: root.join("excludes"),
                                  root,
                                  upper,
                                  command_work,
                                  snapshot_work,
                                  snapshot,
                                  info,
                                  release,
                              });'''.replace("                    ", ""),
              '''                    let upper = root.join("upper");
                              let command_work = root.join("command-work");
                              let snapshot = root.join("snapshot");
                              for path in [&upper, &command_work, &snapshot] {
                                  fs::create_dir(path).map_err(|source| TransactionError::Io {
                                      path: path.clone(),
                                      source,
                                  })?;
                              }
                              let inner_status = root.join("inner-status");
                              let result_status = root.join("result-status");
                              for path in [&inner_status, &result_status] {
                                  fs::write(path, b"").map_err(|source| TransactionError::Io {
                                      path: path.clone(),
                                      source,
                                  })?;
                              }
                              return Ok(Self {
                                  excludes: root.join("excludes"),
                                  root,
                                  upper,
                                  command_work,
                                  snapshot,
                                  inner_status,
                                  result_status,
                              });'''.replace("                    ", ""),
          )

          text = text.replace("    InvalidSandboxInfo {\n", "    InvalidSandboxStatus {\n")
          text = text.replace(
              '''    Wait {
              program: PathBuf,
              source: std::io::Error,
          },
          '''.replace("          ", ""),
              "",
          )
          text = text.replace("            Self::InvalidSandboxInfo { path, value } => write!(\n", "            Self::InvalidSandboxStatus { path, value } => write!(\n")
          text = text.replace("                \"invalid Bubblewrap sandbox info in {}: {value:?}\",\n", "                \"invalid Bubblewrap sandbox status in {}: {value:?}\",\n")
          text = text.replace(
              '''            Self::Wait { program, source } => {
              write!(f, "failed to wait for {}: {source}", program.display())
          }
          '''.replace("          ", ""),
              "",
          )
          text = text.replace(
              "            Self::Spawn { source, .. } | Self::Wait { source, .. } | Self::Io { source, .. } => {\n",
              "            Self::Spawn { source, .. } | Self::Io { source, .. } => {\n",
          )
          text = text.replace("            | Self::InvalidSandboxInfo { .. }\n", "            | Self::InvalidSandboxStatus { .. }\n")

          old_control = '''                "! printf tamper > /tmp/phenix-transaction-release 2>/dev/null; test ! -e /tmp/phenix-transaction-snapshot; test ! -e /tmp/phenix-transaction-excludes; printf new > source.txt",
              )
              .unwrap();

              assert_eq!(output.exit_code, 0);
              assert_eq!(fs::read_to_string(&transaction.paths.release).unwrap(), "1");'''.replace("              ", "")
          new_control = '''                "printf tamper > /tmp/phenix-transaction-result-status; printf tamper > /tmp/phenix-transaction-inner-status; test ! -e /tmp/phenix-transaction-snapshot; test ! -e /tmp/phenix-transaction-excludes; printf new > source.txt",
              )
              .unwrap();

              assert_eq!(output.exit_code, 0);
              assert_eq!(
                  fs::read_to_string(&transaction.paths.result_status).unwrap(),
                  "0\\n"
              );
              assert!(
                  fs::read_to_string(&transaction.paths.inner_status)
                      .unwrap()
                      .contains("\\\"exit-code\\\"")
              );'''.replace("              ", "")
          if old_control not in text:
              raise SystemExit("control-state test anchor not found")
          text = text.replace(old_control, new_control)

          forbidden = [
              "capture_user_namespace",
              "sandbox_child_pid",
              "snapshot_work",
              "InvalidSandboxInfo",
              "self.paths.release",
              "self.paths.info",
              "SANDBOX_RELEASE",
              "--userns",
              "--info-fd",
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f"stale transaction namespace token remains: {token}")

          path.write_text(text)
          PY

          git diff --check

      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/crates/phenix-conductor/src/transaction.rs
          git commit -m "fix: keep transaction controls in trusted sandbox [transaction-sandbox-repair]"
          git push origin HEAD:agent/grill-09-transactional-bash
