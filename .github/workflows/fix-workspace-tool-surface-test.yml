name: Fix workspace tool surface test

on:
  pull_request:
    branches:
      - agent/grill-04-workspace-leases

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/grill-05-workspace-consistency
          fetch-depth: 0
      - name: Align registry reachability test with authority projection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('rust/crates/phenix-conductor/src/workspace_tools.rs')
          text = path.read_text()

          old = '        BackendId, ExecutionId, ExecutionTarget, InferenceOptions, ModelId, ModelTarget,\n'
          new = (
              '        AgentDefinition, BackendId, ExecutionAuthority, ExecutionId, ExecutionTarget,\n'
              '        FilesystemAuthority, InferenceOptions, ModelId, ModelTarget,\n'
          )
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '        for agent in [&scout, &implementer, &verifier] {\n            runtime\n'
          new = (
              '        for agent in [&scout, &implementer, &verifier] {\n'
              '            let mut authority = ExecutionAuthority::read_only();\n'
              '            authority.filesystem = FilesystemAuthority::Write;\n'
              '            runtime\n'
          )
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '                .register_agent(fixture_descriptor(agent.as_str(), CallableKind::Agent))\n'
          new = (
              '                .register_agent(AgentDefinition::new(\n'
              '                    fixture_descriptor(agent.as_str(), CallableKind::Agent),\n'
              '                    authority,\n'
              '                ))\n'
          )
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY

          cargo fmt --all --manifest-path rust/Cargo.toml
          cargo test --manifest-path rust/Cargo.toml -p phenix-conductor --bin phenix-conductor default_tool_registry_reaches_root_and_every_agent_in_an_orchestration
          rm .github/workflows/fix-workspace-tool-surface-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- rust/crates/phenix-conductor/src/workspace_tools.rs .github/workflows/fix-workspace-tool-surface-test.yml
          git commit -m "test: align tool surface fixture with authority"
          git push origin HEAD:agent/grill-05-workspace-consistency
