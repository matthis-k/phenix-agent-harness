name: Repair memory CI

on:
  push:
    branches: [feature/production-memory]

permissions:
  contents: write

concurrency:
  group: repair-memory-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Apply reviewed repair
        run: python .github/scripts/repair_memory_ci.py
      - name: Apply canonical formatting and generated fixes
        run: devenv tasks run maintenance:fix
      - name: Remove one-shot repair machinery
        run: |
          rm .github/workflows/repair-memory-ci.yml
          rm .github/scripts/repair_memory_ci.py
          git checkout -- devenv.lock
      - name: Validate exact final tree
        run: devenv test
      - name: Commit verified repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "fix(memory): complete typed production integration"
          git push origin HEAD:feature/production-memory
