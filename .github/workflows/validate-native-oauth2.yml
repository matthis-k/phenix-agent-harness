name: Validate native OAuth2 migration

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'agent/native-oauth2'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: Refresh Cargo lock and compile
        run: |
          set -euo pipefail
          cd rust
          cargo check --workspace

      - name: Apply deterministic maintenance fixes
        run: |
          set -euo pipefail
          nix run .#phenix-maintenance -- fix

      - name: Validate repository
        run: |
          set -euo pipefail
          nix run .#phenix-maintenance -- all

      - name: Commit validated result
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- rust/Cargo.lock rust/Cargo.toml rust/crates/phenix-backend-native/Cargo.toml rust/crates/phenix-backend-native/src/oauth.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: apply OAuth migration validation fixes"
          git push origin "HEAD:$HEAD_REF"
