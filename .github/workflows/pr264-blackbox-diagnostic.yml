name: PR 264 black-box diagnostic

on:
  push:
    branches:
      - refactor/phenix-acp-boundaries-routing-d0-d4
    paths:
      - .github/workflows/pr264-blackbox-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: refactor/phenix-acp-boundaries-routing-d0-d4
      - name: Reuse current base-fix candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/pr264-base-fixup.yml').read_text().splitlines()
          start = source.index('      - name: Apply ACP transport and migration fixes')
          run = source.index('        run: |', start) + 1
          end = next(i for i in range(run, len(source)) if source[i].startswith('      - name: '))
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[run:end]) + '\n'
          Path('/tmp/apply-pr264-fixes.sh').write_text(script)
          PY
          bash /tmp/apply-pr264-fixes.sh
      - name: Migrate and diagnose black-box configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rust/crates/phenix-conductor/tests/black_box_model_tool_loop.rs')
          text = path.read_text()
          old_routes = '''| Role | Workflow | Target | Explanation |\n|---|---|---|---|\n| `coordinator` | `*` | `coordinator/mock/coordinator` | deterministic coordinator |\n| `specialist` | `*` | `specialist/mock/specialist` | deterministic specialist |\n| `*` | `*` | `coordinator/mock/coordinator` | fallback coordinator |\n'''
          new_routes = '''| Role | Workflow | D0 | D1 | D2 | D3 | D4 | Explanation |\n|---|---|---|---|---|---|---|---|\n| `coordinator` | `*` | `coordinator/mock/coordinator/off` | `coordinator/mock/coordinator/off` | `coordinator/mock/coordinator/off` | `coordinator/mock/coordinator/off` | `coordinator/mock/coordinator/off` | deterministic coordinator |\n| `specialist` | `*` | `specialist/mock/specialist/off` | `specialist/mock/specialist/off` | `specialist/mock/specialist/off` | `specialist/mock/specialist/off` | `specialist/mock/specialist/off` | deterministic specialist |\n| `*` | `*` | `coordinator/mock/coordinator/off` | `coordinator/mock/coordinator/off` | `coordinator/mock/coordinator/off` | `coordinator/mock/coordinator/off` | `coordinator/mock/coordinator/off` | fallback coordinator |\n'''
          if old_routes not in text:
              raise SystemExit('expected legacy black-box routing table not found')
          text = text.replace(old_routes, new_routes, 1)
          old = '    assert_eq!(configured["result"]["revision"], 1);\n'
          new = '''    assert_eq!(\n        configured["result"]["revision"],\n        1,\n        "configuration apply failed: {configured}"\n    );\n'''
          if old not in text:
              raise SystemExit('expected revision assertion not found')
          text = text.replace(old, new, 1)
          old = '    let tree_id = required_string(&created["result"], "sessionId")?;\n'
          new = '''    let tree_id = required_string(&created["result"], "sessionId")\n        .map_err(|error| format!("session/new failed: {created}; {error}"))?;\n'''
          if old not in text:
              raise SystemExit('expected sessionId extraction not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cd rust
          cargo fmt --all
      - name: Refresh dependency lock metadata
        run: cargo check -p phenix-conductor --test black_box_model_tool_loop
        working-directory: rust
      - name: Run black-box regression with response diagnostics
        run: cargo test -p phenix-conductor --test black_box_model_tool_loop --locked -- --nocapture
        working-directory: rust
