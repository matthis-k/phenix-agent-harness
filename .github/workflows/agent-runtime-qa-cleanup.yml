name: Agent runtime QA cleanup

on:
  push:
    branches:
      - agent/runtime-qa-cleanup
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[runtime-qa-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Apply deterministic cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/agent-runtime-qa-cleanup.py')
          lines = path.read_text().splitlines()
          output = []
          wrapper_matched = 0
          sub_matched = 0
          for line in lines:
              if line.startswith("replace(module, '--set PHENIX_GREP"):
                  output.extend([
                      "content = read(module)",
                      "old_wrapper = '--set PHENIX_GREP \"${phenixWorkspaceGrep}\"'",
                      "if content.count(old_wrapper) != 1:",
                      "    raise RuntimeError('modules/phenix-acp.nix: PHENIX_GREP wrapper anchor changed')",
                      "write(module, content.replace(old_wrapper, '--set PHENIX_RG \"${pkgs.ripgrep}/bin/rg\"', 1))",
                  ])
                  wrapper_matched += 1
              elif line.strip() == "updated, actual = re.subn(pattern, replacement, content, count=count, flags=flags)":
                  output.append("    updated, actual = re.subn(pattern, lambda _match: replacement, content, count=count, flags=flags)")
                  sub_matched += 1
              else:
                  output.append(line)
          if wrapper_matched != 1:
              raise SystemExit(f'expected one PHENIX_GREP patch line, found {wrapper_matched}')
          if sub_matched != 1:
              raise SystemExit(f'expected one re.subn helper line, found {sub_matched}')
          path.write_text('\n'.join(output) + '\n')
          PY
          python3 -m py_compile .github/agent-runtime-qa-cleanup.py
          python3 .github/agent-runtime-qa-cleanup.py
          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'fix: complete runtime QA cleanup [runtime-qa-cleanup]'
          git push
