name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Final maintenance checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Apply one-shot workspace patch
        if: github.event_name == 'pull_request' && github.head_ref == 'ui/turn-steering-interrupt'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workspace = Path("modules/phenix-pi/extension/phenix-workspace.ts")
          text = workspace.read_text()
          method = '''  hasTranscriptSelection(): boolean {
    return this.transcriptSelection.selection !== undefined;
  }

'''
          marker = '  refreshRootTranscript(): void {\n'
          if method not in text:
              if marker not in text:
                  raise SystemExit("refresh marker not found")
              text = text.replace(marker, method + marker, 1)
          workspace.write_text(text)

          extension = Path("modules/phenix-pi/extension/default-workspace-extension.ts")
          text = extension.read_text()
          accept = '''      accept: (delegation) =>
        delegation.action !== "app.clear" || !activeWorkspace.hasTranscriptSelection(),
'''
          marker = '      keybindings: activeKeybindings,\n'
          if accept not in text:
              if marker not in text:
                  raise SystemExit("keybindings marker not found")
              text = text.replace(marker, marker + accept, 1)
          extension.write_text(text)
          PY
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/patch-native-clear-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Preserve clear and transcript copy semantics"
          git push origin HEAD:ui/turn-steering-interrupt
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with: { name: devenv }
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Run repository maintenance
        shell: bash
        run: |
          set +e
          devenv test > devenv-test.log 2>&1
          status=$?
          tail -n 320 devenv-test.log
          exit "$status"
      - name: Upload devenv diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devenv-test-log
          path: devenv-test.log
          if-no-files-found: error
