name: Fix unversioned cleanup gate

on:
  push:
    branches:
      - cleanup/unversioned-interfaces

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[unversioned-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: cleanup/unversioned-interfaces
          fetch-depth: 0
      - name: Remove stale checkpoint diagnostic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('modules/phenix-pi/application/diagnostic-event-bridge.ts')
          text = path.read_text()
          stale = '          version: data.version,\n'
          if stale not in text:
              raise SystemExit('Expected stale checkpoint diagnostic not found')
          path.write_text(text.replace(stale, ''))
          PY
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Apply repository formatters
        run: devenv tasks run maintenance:fix
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules docs
          git commit -m 'Fix unversioned cleanup gate [unversioned-fix]'
          git push origin HEAD:cleanup/unversioned-interfaces
