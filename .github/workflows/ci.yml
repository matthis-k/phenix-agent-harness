name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Final maintenance checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: fix/theme-aware-mermaid
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with: { name: devenv }
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Apply theme-aware Mermaid integration
        shell: bash
        run: |
          python .github/scripts/apply-mermaid-theme.py
          python - <<'PY'
          from pathlib import Path

          helper = Path("modules/phenix-pi/extension/mermaid-theme.ts")
          text = helper.read_text()
          old = r'''export function ansiForegroundToHex(ansi: string): string | undefined {
            const truecolor = /\x1b\[38;2;(\d+);(\d+);(\d+)m/.exec(ansi);
            if (truecolor) {
              const channels = truecolor.slice(1).map(Number);
              if (channels.every((channel) => Number.isInteger(channel) && channel >= 0 && channel <= 255)) {
                return rgbHex(channels[0], channels[1], channels[2]);
              }
            }
            const indexed = /\x1b\[38;5;(\d+)m/.exec(ansi);
            if (!indexed) return undefined;
            const index = Number(indexed[1]);
            if (!Number.isInteger(index) || index < 0 || index > 255) return undefined;
            return ansi256Hex(index);
          }'''
          new = r'''export function ansiForegroundToHex(ansi: string): string | undefined {
            const truecolorPrefix = "\x1b[38;2;";
            if (ansi.startsWith(truecolorPrefix) && ansi.endsWith("m")) {
              const channels = ansi.slice(truecolorPrefix.length, -1).split(";").map(Number);
              if (
                channels.length === 3 &&
                channels.every(
                  (channel) => Number.isInteger(channel) && channel >= 0 && channel <= 255,
                )
              ) {
                return rgbHex(channels[0], channels[1], channels[2]);
              }
            }
            const indexedPrefix = "\x1b[38;5;";
            if (!ansi.startsWith(indexedPrefix) || !ansi.endsWith("m")) return undefined;
            const index = Number(ansi.slice(indexedPrefix.length, -1));
            if (!Number.isInteger(index) || index < 0 || index > 255) return undefined;
            return ansi256Hex(index);
          }'''
          if text.count(old) != 1:
              raise RuntimeError("ANSI parser patch did not match exactly once")
          helper.write_text(text.replace(old, new, 1))

          test_file = Path("modules/phenix-pi/tests/mermaid-theme.test.ts")
          test_text = test_file.read_text()
          old_test = r'''  assert.match(rendered, /\x1b\[38;2;/);
            assert.match(rendered, /\x1b\[38;2;205;214;244m/);'''
          new_test = r'''  assert.ok(rendered.includes("\x1b[38;2;"));
            assert.ok(rendered.includes("\x1b[38;2;205;214;244m"));'''
          if test_text.count(old_test) != 1:
              raise RuntimeError("ANSI assertion patch did not match exactly once")
          test_file.write_text(test_text.replace(old_test, new_test, 1))
          PY
      - name: Remove temporary automation
        run: |
          rm .github/scripts/apply-mermaid-theme.py
          rm .github/workflows/apply-mermaid-theme.yml
      - name: Apply canonical maintenance fixes
        shell: bash
        run: |
          set +e
          devenv tasks run maintenance:fix > maintenance-fix.log 2>&1
          status=$?
          cat maintenance-fix.log
          exit "$status"
      - name: Run canonical validation
        shell: bash
        run: |
          set +e
          devenv test > devenv-test.log 2>&1
          status=$?
          tail -n 320 devenv-test.log
          exit "$status"
      - name: Commit implementation
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --stat
          git commit -m "Use active Pi theme for Mermaid diagrams"
          git push origin HEAD:fix/theme-aware-mermaid
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: theme-aware-mermaid-diagnostics
          path: |
            maintenance-fix.log
            devenv-test.log
          if-no-files-found: ignore
