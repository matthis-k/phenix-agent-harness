            },
          ],
        },
      ],
    },
  } as unknown as RunTree;

  const source = runTreeSequenceMermaid(tree);
  assert.match(source, /rect workflow qa · running/);
  assert.match(source, /participant p1 as architect/);
  assert.match(source, /p0->>p1: start · running/);
});
