name: Fix budget mode integration

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/session-budget-mode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/session-budget-mode
      - name: Apply fixes
        run: |
          python scripts/fix_budget_mode_integration.py
          git diff --check
      - name: Commit clean result
        run: |
          rm scripts/fix_budget_mode_integration.py
          rm .github/workflows/fix-budget-mode-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix budget mode type and fixture integration"
          git push origin HEAD:feat/session-budget-mode
