name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Maintenance checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_HOME: ${{ runner.temp }}/phenix-cargo-home
      CARGO_TARGET_DIR: ${{ runner.temp }}/phenix-cargo-target
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: Run declared maintenance stages
        shell: bash
        run: |
          set -euo pipefail

          provider='.#packages.x86_64-linux.phenix-maintenance.phenixMaintenance'
          schema="$(nix eval "$provider.ci.schemaVersion")"
          if [[ "$schema" != 1 ]]; then
            printf 'Unsupported phenix-maintenance schema version: %s\n' "$schema" >&2
            exit 1
          fi

          steps_json="$(nix eval --json "$provider.ci.steps")"
          mapfile -t stages < <(
            python3 -c 'import json,sys; [print(step["id"]) for step in json.load(sys.stdin)]' <<< "$steps_json"
          )

          if [[ ${#stages[@]} -eq 0 ]]; then
            printf '%s\n' 'No maintenance stages are enabled.' >&2
            exit 1
          fi

          for stage in "${stages[@]}"; do
            printf '\n==> maintenance stage: %s\n' "$stage"
            nix run .#phenix-maintenance -- ci run "$stage"
          done

      - name: Repository remains clean
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
