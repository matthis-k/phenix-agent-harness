name: tmp-model-auth-selectability

on:
  push:
    branches:
      - agent/filter-models-by-auth
    paths:
      - .github/workflows/tmp-model-descriptor-refs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/filter-models-by-auth
      - name: Patch model descriptors
        run: python3 .github/scripts/tmp_model_auth_patch.py
      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Test Rust workspace
        run: cargo test --manifest-path rust/Cargo.toml --workspace
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            rust/crates/phenix-core/src/lib.rs \
            rust/crates/phenix-backend-native/src/lib.rs \
            rust/crates/phenix-backend-acp/src/lib.rs \
            rust/crates/phenix-conductor/tests/support/protocol_harness.rs \
            rust/crates/phenix-conductor/tests/support/server_cancellation.rs \
            rust/crates/phenix-conductor/tests/support/protocol_public_journeys.rs \
            rust/crates/phenix-conductor/tests/stdio_roundtrip.rs
          git commit -m 'feat: mark models selectable by provider auth'
          git push origin HEAD:agent/filter-models-by-auth
