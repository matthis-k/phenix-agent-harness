name: Temporary legacy ACP fixture check

on:
  push:
    branches:
      - feat/phenix-acp-config-directory

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run legacy fixture integration test
        working-directory: rust
        run: cargo test --package phenix-acp --test legacy_definitions
