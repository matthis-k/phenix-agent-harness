name: agent opt-in tool round limit

on:
  push:
    branches:
      - agent/opt-in-tool-round-limit
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply opt-in tool round limit
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('rust/crates/phenix-backend-native/src/lib.rs')
          source = path.read_text()

          replacements = [
              (
                  'use std::collections::{BTreeMap, BTreeSet};\nuse std::sync::atomic::{AtomicBool, Ordering};',
                  'use std::collections::{BTreeMap, BTreeSet};\nuse std::num::NonZeroUsize;\nuse std::sync::atomic::{AtomicBool, Ordering};',
              ),
              (
                  'pub const BACKEND_ID: &str = "phenix";\nconst MAX_TOOL_ROUNDS: usize = 32;',
                  'pub const BACKEND_ID: &str = "phenix";',
              ),
              (
                  '    models: Vec<ModelSelection>,\n    persistent_sessions: BTreeMap<SessionId, Arc<PhenixSession>>,',
                  '    models: Vec<ModelSelection>,\n    max_tool_rounds: Option<NonZeroUsize>,\n    persistent_sessions: BTreeMap<SessionId, Arc<PhenixSession>>,',
              ),
              (
                  '            credentials,\n            models: configured_models()?,\n            persistent_sessions: BTreeMap::new(),',
                  '            credentials,\n            models: configured_models()?,\n            max_tool_rounds: configured_max_tool_rounds()?,\n            persistent_sessions: BTreeMap::new(),',
              ),
              (
                  '            tools: Mutex::new(request.tools),\n            history: Mutex::new(Vec::new()),',
                  '            tools: Mutex::new(request.tools),\n            max_tool_rounds: self.max_tool_rounds,\n            history: Mutex::new(Vec::new()),',
              ),
              (
                  '    model: Mutex<ModelTarget>,\n    tools: Mutex<PreparedToolSurface>,\n    history: Mutex<Vec<ChatMessage>>,',
                  '    model: Mutex<ModelTarget>,\n    tools: Mutex<PreparedToolSurface>,\n    max_tool_rounds: Option<NonZeroUsize>,\n    history: Mutex<Vec<ChatMessage>>,',
              ),
              (
                  '        let reasoning_effort = parse_reasoning_effort(model.inference.effort.as_deref())?;\n\n        for _round in 0..MAX_TOOL_ROUNDS {',
                  '        let reasoning_effort = parse_reasoning_effort(model.inference.effort.as_deref())?;\n        let mut tool_rounds = 0usize;\n\n        loop {\n            if let Some(limit) = self.max_tool_rounds {\n                if tool_rounds >= limit.get() {\n                    return Err(BackendError::Protocol(format!(\n                        "provider exceeded {limit} consecutive tool rounds"\n                    )));\n                }\n            }\n            tool_rounds += 1;',
              ),
              (
                  '            history.push(ChatMessage::from(responses));\n        }\n\n        Err(BackendError::Protocol(format!(\n            "provider exceeded {MAX_TOOL_ROUNDS} consecutive tool rounds"\n        )))\n    }',
                  '            history.push(ChatMessage::from(responses));\n        }\n    }',
              ),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'missing expected source fragment:\n{old}')
              source = source.replace(old, new, 1)

          marker = 'fn configured_models() -> Result<Vec<ModelSelection>, BackendError> {'
          helper = '''fn configured_max_tool_rounds() -> Result<Option<NonZeroUsize>, BackendError> {
              let value = std::env::var("PHENIX_MAX_TOOL_ROUNDS").ok();
              parse_max_tool_rounds(value.as_deref())
          }

          fn parse_max_tool_rounds(value: Option<&str>) -> Result<Option<NonZeroUsize>, BackendError> {
              let Some(value) = value.map(str::trim).filter(|value| !value.is_empty()) else {
                  return Ok(None);
              };
              let parsed = value.parse::<usize>().map_err(|error| {
                  BackendError::Protocol(format!(
                      "PHENIX_MAX_TOOL_ROUNDS must be a positive integer: {error}"
                  ))
              })?;
              NonZeroUsize::new(parsed).map(Some).ok_or_else(|| {
                  BackendError::Protocol(
                      "PHENIX_MAX_TOOL_ROUNDS must be greater than zero".to_owned(),
                  )
              })
          }

          '''
          if marker not in source:
              raise SystemExit('configured_models marker missing')
          source = source.replace(marker, helper + marker, 1)

          test_marker = '    #[test]\n    fn reasoning_effort_uses_typed_inference_option() {'
          test = '''    #[test]
              fn tool_round_limit_is_opt_in() {
                  assert_eq!(parse_max_tool_rounds(None).unwrap(), None);
                  assert_eq!(parse_max_tool_rounds(Some("  ")).unwrap(), None);
                  assert_eq!(
                      parse_max_tool_rounds(Some("7")).unwrap().unwrap().get(),
                      7
                  );
                  assert!(matches!(
                      parse_max_tool_rounds(Some("0")),
                      Err(BackendError::Protocol(_))
                  ));
                  assert!(matches!(
                      parse_max_tool_rounds(Some("many")),
                      Err(BackendError::Protocol(_))
                  ));
              }

          '''
          if test_marker not in source:
              raise SystemExit('reasoning effort test marker missing')
          source = source.replace(test_marker, test + test_marker, 1)

          path.write_text(source)
          PY
      - name: Format and test native backend
        shell: bash
        run: |
          cd rust
          cargo fmt --all
          cargo test -p phenix-backend-native
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/phenix-backend-native/src/lib.rs
          git diff --cached --check
          git commit -m 'fix: make tool round limit opt in'
          git push origin HEAD:agent/opt-in-tool-round-limit
