name: Apply workspace runtime startup fix

on:
  push:
    branches: [fix/workspace-runtime-startup]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with: { fetch-depth: 0 }
      - name: Apply source changes
        run: python .github/apply-workspace-runtime-event.py
      - name: Remove one-shot scaffolding
        run: rm .github/apply-workspace-runtime-event.py .github/workflows/apply-workspace-runtime-event.yml
      - name: Validate patch
        run: git diff --check
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix default workspace runtime startup"
          git push origin HEAD:fix/workspace-runtime-startup
