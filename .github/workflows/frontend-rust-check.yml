name: Frontend Rust check

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/frontend-rust-check.yml
      - rust/**

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@4305c38b25d97ef35a8ad1f985ccf2d2242004f2
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply structural Rust cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def edit(path_name: str, transform) -> None:
              path = Path(path_name)
              before = path.read_text()
              after = transform(before)
              if before == after:
                  raise SystemExit(f"no migration applied to {path}")
              path.write_text(after)

          def lua_state(content: str) -> str:
              content = content.replace(
                  "pub(crate) struct LuaState {",
                  "#[derive(Default)]\npub(crate) struct LuaState {",
                  1,
              )
              return re.sub(
                  r"\nimpl Default for LuaState \{.*?\n\}\n",
                  "\n",
                  content,
                  count=1,
                  flags=re.S,
              )

          def fabric(content: str) -> str:
              content = content.replace(
                  "    Backend(BackendOutput),",
                  "    Backend(Box<BackendOutput>),",
                  1,
              )
              content = content.replace(
                  "    Content(EventEnvelope<ContentEvent>),",
                  "    Content(Box<EventEnvelope<ContentEvent>>),",
                  1,
              )
              content = content.replace(
                  "pub struct EventRouter {",
                  "#[derive(Default)]\npub struct EventRouter {",
                  1,
              )
              content = re.sub(
                  r"\nimpl Default for EventRouter \{.*?\n\}\n",
                  "\n",
                  content,
                  count=1,
                  flags=re.S,
              )
              content, count = re.subn(
                  r"RouteTarget::Element\(element\) => self\s*\.nodes\s*\.contains_key\(element\)\s*\.then\(\|\| vec!\[element\.clone\(\)\]\)\s*\.unwrap_or_default\(\),",
                  """RouteTarget::Element(element) => {
                if self.nodes.contains_key(element) {
                    vec![element.clone()]
                } else {
                    Vec::new()
                }
            }""",
                  content,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("RouteTarget::Element migration did not match")
              return content

          def mailbox(content: str) -> str:
              content = content.replace(
                  "    Content(EventEnvelope<ContentEvent>),",
                  "    Content(Box<EventEnvelope<ContentEvent>>),",
                  1,
              )
              content = content.replace(
                  "self.send_lossless(UiMessage::Content(event))",
                  "self.send_lossless(UiMessage::Content(Box::new(event)))",
                  1,
              )
              content = content.replace(
                  "ContentEvent::Backend(output)",
                  "ContentEvent::Backend(Box::new(output))",
                  1,
              )
              content = content.replace(
                  "UiMessage::Content(EventEnvelope::broadcast(\n            ContentEvent::RefreshRequested,\n        ))",
                  "UiMessage::Content(Box::new(EventEnvelope::broadcast(\n            ContentEvent::RefreshRequested,\n        )))",
                  1,
              )
              content = content.replace(
                  "UiMessage::Content(EventEnvelope::broadcast(\n            ContentEvent::ClockTick,\n        ))",
                  "UiMessage::Content(Box::new(EventEnvelope::broadcast(\n            ContentEvent::ClockTick,\n        )))",
                  1,
              )
              return content

          def consumers(content: str) -> str:
              return content.replace(
                  "AppEvent::Backend(Box::new(output.clone()))",
                  "AppEvent::Backend(output.clone())",
                  1,
              )

          edit("rust/crates/phenix-ui-lua/src/provider.rs", lua_state)
          edit("rust/crates/phenix-ui-runtime/src/fabric.rs", fabric)
          edit("rust/crates/phenix-ui-runtime/src/mailbox.rs", mailbox)
          edit("rust/crates/phenix-ui-runtime/src/consumers.rs", consumers)
          PY
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Commit generated Rust files
        run: |
          if ! git diff --quiet -- rust; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add rust
            git commit -m "compact routed event envelopes"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - name: Check
        run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked
