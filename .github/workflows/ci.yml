name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-native-transcript:
    name: Export Pi-native transcript viewer
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/native-run-transcript-viewer'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: feature/native-run-transcript-viewer
          fetch-depth: 0
      - name: Apply source integration
        run: python .github/apply-native-transcript-viewer.py
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Format generated source
        run: devenv shell maintenance-fix-format
      - name: Discard unrelated formatter changes
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(modules/tooling\.nix|modules/phenix-pi/extension/(native-run-transcript|phenix-ui|root-extension)\.ts|modules/phenix-pi/tests/(native-run-transcript|phenix-ui)\.test\.ts)$'
          while IFS= read -r file; do
            if [[ ! "$file" =~ $allowed ]]; then
              git restore -- "$file"
            fi
          done < <(git diff --name-only)
      - name: Export generated source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-transcript-generated-source
          path: |
            modules/tooling.nix
            modules/phenix-pi/extension/native-run-transcript.ts
            modules/phenix-pi/extension/phenix-ui.ts
            modules/phenix-pi/extension/root-extension.ts
            modules/phenix-pi/tests/native-run-transcript.test.ts
            modules/phenix-pi/tests/phenix-ui.test.ts
          if-no-files-found: error
