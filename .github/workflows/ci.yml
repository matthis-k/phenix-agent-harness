name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Final maintenance checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Apply ACP backend migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              content = path.read_text()
              if old not in content:
                  if new in content:
                      return
                  raise SystemExit(f"missing replacement anchor in {path}: {old}")
              path.write_text(content.replace(old, new, 1))

          backend = Path("rust/crates/phenix-acp-backend/src/lib.rs")
          replace_once(
              backend,
              "use std::sync::mpsc::Receiver;\nuse std::thread;",
              "use std::sync::atomic::{AtomicBool, Ordering};\nuse std::sync::mpsc::{Receiver, RecvTimeoutError};\nuse std::sync::Arc;\nuse std::thread;\nuse std::time::Duration;",
          )
          replace_once(
              backend,
              '''        let (request_tx, request_rx) = mpsc::unbounded();
        let relay = thread::Builder::new()
            .name("phenix-acp-request-relay".to_owned())
            .spawn(move || {
                for request in requests {
                    let shutdown = matches!(request.command, BackendCommand::Shutdown);
                    if request_tx.unbounded_send(request).is_err() || shutdown {
                        break;
                    }
                }
            })
            .map_err(|error| BackendError::Start(error.to_string()))?;

        let result = futures::executor::block_on(run_connection(
            agent,
            self.config.cwd,
            request_rx,
            outputs,
        ));
        relay.join().map_err(|_| BackendError::Panicked)?;
        result''',
              '''        let (request_tx, request_rx) = mpsc::unbounded();
        let stop_relay = Arc::new(AtomicBool::new(false));
        let relay_stop = Arc::clone(&stop_relay);
        let relay = thread::Builder::new()
            .name("phenix-acp-request-relay".to_owned())
            .spawn(move || loop {
                match requests.recv_timeout(Duration::from_millis(100)) {
                    Ok(request) => {
                        let shutdown = matches!(request.command, BackendCommand::Shutdown);
                        if request_tx.unbounded_send(request).is_err() || shutdown {
                            break;
                        }
                    }
                    Err(RecvTimeoutError::Timeout) if relay_stop.load(Ordering::Acquire) => break,
                    Err(RecvTimeoutError::Timeout) => {}
                    Err(RecvTimeoutError::Disconnected) => break,
                }
            })
            .map_err(|error| BackendError::Start(error.to_string()))?;

        let result = futures::executor::block_on(run_connection(
            agent,
            self.config.cwd,
            request_rx,
            outputs,
        ));
        stop_relay.store(true, Ordering::Release);
        relay.join().map_err(|_| BackendError::Panicked)?;
        result''',
          )

          tui = Path("rust/crates/phenix-tui/src/main.rs")
          replace_once(
              tui,
              "use phenix_frontend_config::FrontendProviderRef;",
              "use phenix_acp_backend::{AcpAgentBackend, AcpBackendConfig};\nuse phenix_frontend_config::FrontendProviderRef;",
          )
          replace_once(
              tui,
              '''use phenix_runtime_api::{
    BackendCommand, BackendOutput, BackendReply, BackendRuntime, ClientInformation, RequestId,
};''',
              '''use phenix_runtime_api::{
    AgentBackend, BackendCommand, BackendOutput, BackendReply, BackendRuntime, ClientInformation,
    RequestId,
};''',
          )
          replace_once(
              tui,
              "const HANDSHAKE_TIMEOUT: Duration = Duration::from_secs(30);",
              '''const HANDSHAKE_TIMEOUT: Duration = Duration::from_secs(30);

#[derive(Clone, Copy, Debug, Eq, PartialEq)]
enum BackendKind {
    Process,
    Acp,
}''',
          )
          replace_once(
              tui,
              '''fn spawn_backend() -> Result<BackendRuntime, Box<dyn Error>> {
    Ok(BackendRuntime::spawn(
        Box::new(create_process_backend()?),
        CHANNEL_CAPACITY,
    )?)
}''',
              '''fn spawn_backend() -> Result<BackendRuntime, Box<dyn Error>> {
    let backend: Box<dyn AgentBackend> = match parse_backend_kind(
        env::var("PHENIX_BACKEND").ok().as_deref(),
    )? {
        BackendKind::Process => Box::new(create_process_backend()?),
        BackendKind::Acp => Box::new(create_acp_backend()?),
    };
    Ok(BackendRuntime::spawn(backend, CHANNEL_CAPACITY)?)
}

fn parse_backend_kind(value: Option<&str>) -> Result<BackendKind, io::Error> {
    match value.map(str::trim) {
        None | Some("") | Some("process") | Some("pi-jsonl") => Ok(BackendKind::Process),
        Some("acp") => Ok(BackendKind::Acp),
        Some(value) => Err(io::Error::new(
            io::ErrorKind::InvalidInput,
            format!("unsupported PHENIX_BACKEND value: {value}"),
        )),
    }
}

fn create_acp_backend() -> Result<AcpAgentBackend, Box<dyn Error>> {
    let command = env::var("PHENIX_ACP_COMMAND").unwrap_or_else(|_| "pi-acp".to_owned());
    let config = AcpBackendConfig::new(command, env::current_dir()?)?;
    Ok(AcpAgentBackend::new(config))
}''',
          )
          replace_once(
              tui,
              '''    fn crossterm_keys_are_reduced_to_backend_neutral_values() {
        let key = convert_key(KeyEvent::new(
            CrosstermKeyCode::Char('x'),
            CrosstermModifiers::CONTROL | CrosstermModifiers::SHIFT,
        ));
        assert_eq!(key.code, KeyCode::Character('x'));
        assert!(key.modifiers.control);
        assert!(key.modifiers.shift);
    }
}''',
              '''    fn crossterm_keys_are_reduced_to_backend_neutral_values() {
        let key = convert_key(KeyEvent::new(
            CrosstermKeyCode::Char('x'),
            CrosstermModifiers::CONTROL | CrosstermModifiers::SHIFT,
        ));
        assert_eq!(key.code, KeyCode::Character('x'));
        assert!(key.modifiers.control);
        assert!(key.modifiers.shift);
    }

    #[test]
    fn backend_selection_is_explicit_and_defaults_to_the_transitional_process_adapter() {
        assert_eq!(parse_backend_kind(None).expect("default"), BackendKind::Process);
        assert_eq!(
            parse_backend_kind(Some("process")).expect("process"),
            BackendKind::Process
        );
        assert_eq!(
            parse_backend_kind(Some("acp")).expect("ACP"),
            BackendKind::Acp
        );
        assert!(parse_backend_kind(Some("unknown")).is_err());
    }
}''',
          )
          PY
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo fmt --manifest-path rust/Cargo.toml --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --quiet -- rust; then
            git add rust
            git commit -m "expose official ACP backend to Ratatui"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with: { name: devenv }
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Run repository maintenance
        shell: bash
        run: |
          set +e
          devenv test > devenv-test.log 2>&1
          status=$?
          tail -n 320 devenv-test.log
          exit "$status"
      - name: Upload devenv diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devenv-test-log
          path: devenv-test.log
          if-no-files-found: error
