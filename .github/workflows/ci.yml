# Generated by phenix-flake-ci. Edit the Nix maintenance declaration, not this file.
name: "CI"

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: "Source"
    runs-on: "ubuntu-latest"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: "Nix formatting"
        run: nix run .#phenix-maintenance -- check source nix-format

      - name: "Rust formatting"
        run: nix run .#phenix-maintenance -- check source rust-format

      - name: "Statix"
        run: nix run .#phenix-maintenance -- check source statix

      - name: "Actionlint"
        run: nix run .#phenix-maintenance -- check source actionlint

      - name: "Test target classification"
        run: nix run .#phenix-maintenance -- check source test-targets

      - name: "Generated workflow"
        run: nix run .#phenix-maintenance -- check source workflow-sync

      - name: Repository remains clean
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"


  rust:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: "Rust"
    runs-on: "ubuntu-latest"
    timeout-minutes: 60
    needs:
      - source
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: "Clippy"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
        run: nix run .#phenix-maintenance -- check rust

      - name: "Unit tests"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
        run: nix run .#phenix-maintenance -- test unit

      - name: "Doc tests"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
        run: nix run .#phenix-maintenance -- test doc

      - name: "phenix-backend-acp / persistent_continuity"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
        run: nix run .#phenix-maintenance -- test integration backend-acp-persistent-continuity

      - name: "phenix-backend-acp / tool_bridge"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
        run: nix run .#phenix-maintenance -- test integration backend-acp-tool-bridge

      - name: "phenix-acp / repeated_prompts"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
        run: nix run .#phenix-maintenance -- test integration phenix-acp-repeated-prompts

      - name: "conductor / black_box_model_tool_loop"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
        run: nix run .#phenix-maintenance -- test system conductor-model-tool-loop

      - name: "conductor / black_box_workflow_callables"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
        run: nix run .#phenix-maintenance -- test system conductor-workflow-callables

      - name: "conductor / durable_retries"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
        run: nix run .#phenix-maintenance -- test system conductor-durable-retries

      - name: "conductor / execution_provider_runtime"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
        run: nix run .#phenix-maintenance -- test system conductor-execution-providers

      - name: "conductor / fixed_target_continuity"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
        run: nix run .#phenix-maintenance -- test system conductor-fixed-target-continuity

      - name: "conductor / routed_context_continuity"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
        run: nix run .#phenix-maintenance -- test system conductor-routed-context-continuity

      - name: "conductor / stdio_roundtrip"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
        run: nix run .#phenix-maintenance -- test system conductor-stdio-roundtrip

      - name: "conductor / protocol_e2e"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
        run: nix run .#phenix-maintenance -- test system conductor-protocol-e2e

      - name: "conductor / runtime_edge_cases"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
        run: nix run .#phenix-maintenance -- test system conductor-runtime-edge-cases

      - name: "conductor / termination_causes"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
        run: nix run .#phenix-maintenance -- test system conductor-termination-causes

      - name: "conductor / workspace_execution_leases"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
        run: nix run .#phenix-maintenance -- test system conductor-workspace-execution-leases

      - name: Repository remains clean
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"


  product:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: "Product"
    runs-on: "ubuntu-latest"
    timeout-minutes: 60
    needs:
      - source
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: "Phenix ACP smoke"
        run: nix run .#phenix-maintenance -- test product phenix-acp

      - name: "Stitch runtime smoke"
        run: nix run .#phenix-maintenance -- test product stitch-runtime

      - name: "Stitch MCP package"
        run: nix run .#phenix-maintenance -- test product stitch-mcp

      - name: Repository remains clean
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"


  checks:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: "Maintenance checks"
    needs:
      - source
      - rust
      - product
    runs-on: ubuntu-latest
    steps:
      - name: Verify all maintenance jobs passed
        run: |
          set -euo pipefail
          [[ '${{ needs.source.result }}' == success ]]
          [[ '${{ needs.rust.result }}' == success ]]
          [[ '${{ needs.product.result }}' == success ]]
