name: ACP backend check

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/acp-backend-check.yml
      - rust/**

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@4305c38b25d97ef35a8ad1f985ccf2d2242004f2
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply ACP SDK connection fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("rust/crates/phenix-acp-backend/src/lib.rs")
          content = path.read_text()

          replacements = [
              (
                  "use agent_client_protocol::{AcpAgent, Agent, Client, ConnectTo, SessionMessage};",
                  "use agent_client_protocol::{AcpAgent, Agent, Client, ConnectionTo, SessionMessage};",
              ),
              (
                  "move |cx: ConnectTo<Agent>| async move",
                  "move |cx: ConnectionTo<Agent>| async move",
              ),
              (
                  "agent_client_protocol::ActiveSession<'a, ConnectTo<Agent>>",
                  "agent_client_protocol::ActiveSession<'a, ConnectionTo<Agent>>",
              ),
              (
                  "agent_client_protocol::ActiveSession<'static, Link>",
                  "agent_client_protocol::ActiveSession<'a, ConnectionTo<Agent>>",
              ),
          ]

          for old, new in replacements:
              if old in content:
                  content = content.replace(old, new, 1)
              elif new not in content:
                  raise SystemExit(f"missing replacement anchor: {old}")

          path.write_text(content)
          PY
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Commit generated Rust files
        run: |
          if ! git diff --quiet -- rust; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add rust
            git commit -m "use concrete official ACP connection type"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - name: Check
        run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked
